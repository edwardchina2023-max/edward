我们的泪水淹没这卑鄙的灵魂为苍天献上虔诚的祭品谁能离开自己的家园抛弃世世代代的尊严谁能忍心看那昨日的小丑带走我们的笑容青春堕入红尘双眼蒙上了灰让久违不见的泪水灼痛少女的心让愤怒语化为音符控诉无耻的谎言嘶哑着你的喉咙发出一阵怒吼让我们撕碎这旧世界让我们重构美丽新世界让我们的泪水淹没这卑鄙的灵魂为苍天献上虔诚的祭品谁能离开自己的家园抛弃世世代代的尊严谁能忍心看那昨日的小丑带走我们的笑容青春堕入红尘双眼蒙上了灰让久违不见的泪水洗涤受伤的心灵日出依旧寒冷大地杂草丛生让骤雨钟出的音响谱成命运的交响嘶哑着你的喉咙发出一阵怒吼让我们撕碎这旧世界让我们重构美丽新世界让我们的泪水淹没这卑鄙的灵魂上天保佑明天会更好\n· · ·\n"}, {"year": 2022, "month": 6, "day": 1, "text": "冯仑：今年在西安，给秦始皇上了个坟，想了很多事，就想知道咱们什么时候才能走出他老人家定下的那套圈子。。。再说今天，关于赚钱的游戏规则已经有了400多部法律。。。但如果咱们政府都不把法律当回事，\n老百姓更不会当回事了可观看回放连播7场-第6-5正在直播对话冯仑：我们的日子、票子和房子\n"}, {"year": 2022, "month": 6, "day": 2, "text": "“行无愧作心常坦身处艰难气若虹”访乡贤陈独秀，觉得有必要分享几句微人轻言。思想家，教育家，中国共产党创始人，革命家，作家，诗人，学者，书法家，这些既然是事实，本应无需赘述，但实在他的名很大，却声很小。在纪念馆和墓园看到很多之前在网上没注意到的细节和故事，最有感触的是这副写在南京监狱里的对联，不知是否原迹，但读来意义非常。\n这副对联源于一位孤勇者去看望另一位孤勇者激发的才情。刘海粟和胡适差不多，比陈独秀小十多岁。那个年代，刘和陈，一个敢画美女裸体，一个敢进国民党监狱，自然在北大一见如故。陈第五次进去时间比较长，刘不听劝，非要冒险去看陈，囚笼遇故知，陈肯定高兴，据说俩人高谈阔论十分尽兴，最后陈给刘留字：“行无愧作心常坦，身处艰难气若虹。”从这两句话再往后看，当年从牢里出来，昔日总书记的路有很多，他一没向学生低头去延安，二没向外人低头去苏联，三没向仇人低头去当官。\n虽说成王败寇，但论起这精神，这气性。几人不服。\n"}, {"year": 2022, "month": 6, "day": 8, "text": "晚间无事，一个人在灵隐附近顺着山泉声闲逛，被飞来峰门卫拦下，转身顺着韬光古道，也不知爬了多少台阶，毫无思想准备第一次上了北高峰，\n累的稀里糊涂，看到“天下第一财神庙”（真不是吹牛，有不少咱们熟悉的老朋友都来过，比如徽宗，康熙，乾隆，东坡，还有毛主席，朱元帅。。。）\n猛然想起年前受朋友馈赠“招财进宝”条幅就出自这里前几天还在家里端详过，坐在山门前，品着门口那副对联：\n灵境在心还应上下求索顺时从事自能左右逢源夜风习习，妙的很。\n"}, {"year": 2022, "month": 6, "day": 13, "text": "我读过的最深刻的西藏游记，出自上周病逝的哲学家张祥龙教授：“东部山岭经历的生命时间要靠四季来递次表达，而西部高山的时间则可以刹那呈现！神圣和开悟就在其中。\n永恒的冰雪中冷藏着更久远纯洁的时间，一根在冰川上打出的冰芯里蕴含着成百个世纪。难道说，在这样一个生存氛围变暖变浊的时代，人们的神圣感需要这样的时间体验来进发？无论如何，这次西藏之行让我深感，中华民族的精神需要从流水的横向时间精神转变为冰雪绿树的纵向时间精神天道如江海，神性如冰魂。并不是不要流水，不要儒家、道家和禅宗，而是要让它们先经历现代的高反，化身为绝顶处的粒雪盆和冰瀑布，然后在冰洞冰舌处被阳光唤出。这个伟大民族需要从世界最高的高原起头，这个时代也不能堕落成什么“小时代”，而是需要一个相比于过去更加坚挺高拔但又不失《易》义的中国精神范式，川藏路上的骑行者们就是它的报信人万象|张祥龙：人间终极处一对西藏的现象学感受\n"}, {"year": 2022, "month": 6, "day": 14, "text": "周末去拉萨，已定好机票。此行所见所闻均非常规设计，有曹老师在，总会有未期之欢喜。还能带几个人一同前往，对西藏，对佛教，对藏族同胞有好奇或执念的朋友实在不可错过。\n萨嘎达瓦月，去拉萨朝圣，跟随修行者冥想|5天4晚，限15\n"}, {"year": 2022, "month": 6, "day": 15, "text": "奔波一周，抛下悬而未决的一堆事，到灵隐歇一下。看到桌上的烟灰缸，\n特别翻出离家前奶奶给的五星皖，拆开点一颗，别说华子，就是给我古巴雪茄也不换。天真热，树上没有一点风，忍不住很怀念皖河乡老屋的穿堂风，夏天结束前希望还有机会回去享受一下等待，真是一门大功课。\n"}, {"year": 2022, "month": 6, "day": 16, "text": "饭后从下天竺出发，经小西天、佛学院、中印古寺、在法喜寺回到天竺路过法镜寺，转了一圈回到灵隐。手机上突然看到藏族朋友发的大昭寺晚霞，今天（藏历4月15）对他们而言是个非常重要的节日，叫萨噶达瓦节，是为了纪念释迦牟尼佛在这个月诞生、觉悟、涅繁。大昭寺里有一尊释迦牟尼佛少年时期的等身像，看到这样的景象，他们一定感到很幸福吧。想起过两天正要和几位朋友一起前往，不禁心生感恩，祝你幸福。\n"}, {"year": 2022, "month": 6, "day": 18, "text": "街头即景，明天和藏族兄弟约了篮球，今晚不喝酒，只吃肉\n"}, {"year": 2022, "month": 6, "day": 19, "text": "这个点还在想心事的朋友，推荐一首这里人都喜欢的藏语歌《1376》，\n歌词大意：祝你心想事成\n"}, {"year": 2022, "month": 6, "day": 20, "text": "放下，然后看见。克服高反，一个简单的练习。\n思想食堂×松赞我都询底的放下\n"}, {"year": 2022, "month": 6, "day": 20, "text": "和曹老师拜访藏医馆，大家都饶有兴致，请藏医加班看看高反，给每人都开了3元-30元、3天-5天不等的藏药，等轮到我一大夫号完脉：没什么问题我：有一点问题。\n大夫：.\n我：我就不明白为啥每次来藏地，吃得挺多，回去一称轻了好几斤。等到北京，为啥随便吃什么都胖？\n大夫：那证明你消化系统好我：..\n大夫：..\n我：您看是不是因为在藏区吃的东西对我保持体重有帮助，回北京因为吃不着才胖？\n大夫：应该有点关联我：要不帮我弄点助减肉的药，我带回去吃大夫：好，给你开一个月的量人到中年，60元的减肥药到手\n"}, {"year": 2022, "month": 6, "day": 21, "text": "做过核酸，出发去神性弥漫的山南。\n"}, {"year": 2022, "month": 6, "day": 21, "text": "夏至清凉。\n"}, {"year": 2022, "month": 6, "day": 23, "text": "定定住拉萨，依依向京华；\n何期甜茶泪，忽忆案前花。\n《近天有感》\n"}, {"year": 2022, "month": 6, "day": 26, "text": "今日课程：生死与传承授课老师：刘东浙大中西书院院长清华国学研究院教授\n"}, {"year": 2022, "month": 6, "day": 26, "text": "中国儒家生死观-生：生无所息 (不能躺平)\n死：视死如归 (是条汉子)\n举个例子，中国明清启蒙思想家黄宗羲，人生四可死—黄宗羲在自知大去之期已近的时候，不仅要求把自己的遗体“安放石床，不用棺，不作佛事，不做七七，凡鼓吹、巫、铭旌、纸幡、纸钱一概不用”，更在给孙女婿万承勋的信中写道：“总之，年纪到此可死；自反平生虽无善状，亦无恶状，可死；于先人未了，亦稍稍无款，可死；一生著述未必尽传，自料亦不下古之名家，可死。如此四可死，死真无苦矣！”\n"}, {"year": 2022, "month": 6, "day": 27, "text": "走着走着就没人了，地球一开始就给予我们的，文明无法替代。\n· · ·\n"}, {"year": 2022, "month": 7, "day": 1, "text": "暑假到了，又到了花式溜娃的新赛季。提供一个解决方案：10天后出发，深入没有高反的秘境森林草原。\n在自然人类文明的末端，让小盆友看看那些不一样的同龄人：骑马的扎西，采蘑菇的卓玛，还有在牧场挤奶的拉姆。。。让大盆友们和藏族智者格西（同教授、博导）聊聊天，探讨一下文明与炊烟。\n可以说体验很丰富，基本都是独享式体验，节奏也很友好古城锅庄-木屋野炊-秘境穿越-黑陶作坊，还有大佛寺世界最大转经筒，小布达拉宫松赞林寺，少不了去藏民家做客吃硬肉，喝横酒，跟着藏族兄弟姐妹，咱汉族同胞们瞬间能歌又善舞。\n折腾累了就坐着听听雪虎的《心经》，又或《金瓶梅》，一起聊聊曾经的理想，探讨一下未来的出路。不用担心孩子们精力还过剩，我们一直关注着独克宗古城里有个篮球场轻徒步，微辛苦；\n大自然，小课堂。\n还有三个亲子名额，早安排早爽。\n"}, {"year": 2022, "month": 7, "day": 10, "text": "明天去香格里拉，游学前先给手机腾内存。近两周京杭杂记。没有景点和地标的城市照片，分不清哪是哪。可能过日子，怎么过、和谁过，远比在哪过更重要。所谓人间既有真趣，山中何分南北。\n"}, {"year": 2022, "month": 7, "day": 11, "text": "今天听到一个商业新名词：航程中断（飞机選挑子了）。算算折腾了13个小时，意外地到了昆明，距离香格里拉还有600公里，快了，喘口气明天接着赶路。饥肠，老板笑着说得再煮10分钟才能上筷子，因为菇子好吃但有毒\n"}, {"year": 2022, "month": 7, "day": 12, "text": "万没想到。因为爱情，歌德说把心留在了海德堡，几乎成了一句旅游slogan，当然海德堡也名副其实。德国游学前，看季羡林先生的《留德十年》\n，知道他老人家留学时忙于勤奋读书，又疲于应付德语和日常生活，鲜有郊游。曾以为他老人家只在德国最后一天时路过海德堡，远远看过一眼，\n不至于像歌德一样把心留在海德堡，但大概率，因为美丽的房东女儿伊姆加德，应该会把心留在哥廷根。今日万没想到，官宣竟是留在了敦煌一个人，走过很多地方，终于有个深邃之所，能把心儿寄放。是一种幸福，也是一种浪漫。\n季美林：把心留在敦煌\n"}, {"year": 2022, "month": 7, "day": 12, "text": "5进香巴拉，家一样地方。\n"}, {"year": 2022, "month": 7, "day": 12, "text": "这个季节的松茸绝对是奢侈品，三弟村子里的藏族朋友今天采了不少品相上好的，加推一波。朋友们放心买，亲弟弟在亚丁发货，有问题我负责，\n买贵了，大哥也负责https:/ji.youzan.com/qnaXz7第一次正式广而告之，特别恭喜中石油研究生黄老三，走遍全国后，终于在技术文明的末端，迈向自然人类文明的深处，在理塘的高原上找到自己的安身之事。大家多多支持。https:/ji.youzan.com/qnaXz7买就对了是的，替我老娘补一句，老三还是单身，这会儿他正在拉波去亚丁的路上，信号差，明天补发他的二维码。\n松茸之乡金色拉液\n"}, {"year": 2022, "month": 7, "day": 13, "text": "出海倒时差，高原倒海拔黎明前的觉知：没有酒神精神体验的生命是不完整的。尼采说，理性的技术文明之光太过炽烈，以至于我们忘记了夜之幽暗。忘记了生命本有的抵御庸常、探索神秘的冲动的、创造的、非理性之美。\n所以有一句常被用来劝酒的戏言：不喝酒，活着得多没劲？！虽然毫无道理，却莫名会有给人当头棒喝之功效。生活需要节日，生命需要狂欢，阿波罗需要把他看护的孩子不定期托付给狄奥尼索斯。\n但酒神精神的实践路径绝不仅仅是一通豪饮，比如比如吃牛肝菌时少煮十分钟，又比如在一场高原篮球之后的午夜梦回。\n高原，真是酒神精神势力的天然领地。有机会得请孙老师来这里讲尼采。\n"}, {"year": 2022, "month": 7, "day": 13, "text": "没有信号的一天，去了一个和雨崩一样被誉为“天堂”的地方，下山路上风光即景。\n"}, {"year": 2022, "month": 7, "day": 14, "text": "在老土司的院子里吃了1碗米线，2只煎蛋，喝足酥油茶，抬头已日晒三竿。旅行，是从一个美好的地方，向另一个美好的地方进发。\n"}, {"year": 2022, "month": 7, "day": 14, "text": "美不胜收的一天，从世外桃源出来，总要回归一下现实：人是铁，饭是钢，主业还得是食堂。\n迪庆藏族自治州·香格里拉市独克宗古城-大佛寺\n"}, {"year": 2022, "month": 7, "day": 15, "text": "尼采大爷曾说：每一个不曾起舞的日子，都是对生命的辜负。其实，这句话在大爷还年轻的时候，他是这么说的：迄今为止，你真正爱过什么？是什么让你的灵魂飞扬？\n石卡雪山十公里硬徒步\n"}, {"year": 2022, "month": 7, "day": 16, "text": "来祝贺尊追格西今日举行坐床仪式，升任松赞林寺堪布，今日起即称：尊追仁波切。\n想起去年今月，带着师友和孩子们同在这里（图6、7），得尊追老师良言善导，不由庆幸感念。今日再见，仁波切身份尊荣，却和悦如昨。不胜感恩阿若康巴扎巴老师携安杰兄弟牵线。\n整个上午，大家都感到说不出的兴奋和满足感，各自默默体味“殊胜”的感觉。唯愿孩子们以佛菩萨的言行为榜样，健康成长、德智常伴。\n之参访松赞林寺\n"}, {"year": 2022, "month": 7, "day": 17, "text": "有点懒洋洋\n"}, {"year": 2022, "month": 7, "day": 22, "text": "飞一次敦煌不容易，和孩子一起飞敦煌就更不容易了。感恩于哲老师，\n很荣幸为敦煌游学加码，已锁定敦煌研究院两位圈内大名鼎鼎的研究员王惠民、孙志军老师给大家分享敦煌的故事。除此之外，思想食堂一贯风格，行程必有隐藏彩蛋。\n这几年国内旅游大热，景区为保护文物不得不采取不得已的管理措施。趁着还能看，就一定要去看那些即将看不到的特窟；还要看看那些把青春献给敦煌的人；去一趟敦煌，该知道文明的来龙去脉，方能体会历史的美丽与哀愁。\n思想食堂×敦煌研究院诚意出品，报名过半，出发在即。\n"}, {"year": 2022, "month": 7, "day": 22, "text": "起起老师决定全家出动参加敦煌游学，他不吝溢美之词，说我们的行程安排应该是国内最好的，可以作为他给孩子的毕业礼（已从北京十一中学实验班考入一零一高中国际部）。而他们的到来，又何尝不是给我们的又一特别礼物，参加游学的同学们可谓超值了。\n起起老师以字写心，他的书和文章都值得一读再读。今天推送的这篇敦煌文章，是他向老同事们（备注：《生活》、《新周刊》的作者们）的致敬之笔，那是一批中国少有的“职人”，用有温度的文字记录过历史的敦煌，\n和时代的敦煌人。一种相惜，令人动容。\n胡起起：敦煌学的重心为何能回到敦煌\n"}, {"year": 2022, "month": 7, "day": 22, "text": "香格里拉游学归来分享，和明天的课程主题很契合。正在播零量71排C\n"}, {"year": 2022, "month": 7, "day": 23, "text": "第一次现场听欢欢老师讲她的佛教哲学研究，PPT里菩提迦叶的照片是她自己拍摄，托她的福，第一次看到“坐床”的“床”的原型（图2中间）。课程开场就非常欢乐，大家发言踊跃，还一起诵读了《心经》。\n何老师不疾不徐，婉约娓妮，有种飞天即视感。想请她带同学们去敦煌，\n又想跟她去印度浙江大学「生命哲学」高级研修班\n"}, {"year": 2022, "month": 7, "day": 24, "text": "如果说昨天是与菩提树下殊胜的一次邂逅，今天注定是要感受爱琴海蓝色奔放的一天了今天思温老师会给大家梳理轴心时代的西方哲学故事，与昨天欢欢老师讲的东方智慧遥遥呼应。\n本月授课的两位老师是昔日的研究生同学，昨天晚宴两位都在，同学们都觉得两位老师都是知行合一的人。\n浙江大学生命哲学高级研修班1期\n"}, {"year": 2022, "month": 7, "day": 31, "text": "天王盖地虎，一物降一物。\n· · ·\n"}, {"year": 2022, "month": 8, "day": 2, "text": "简简单单，菇子盖饭\n"}, {"year": 2022, "month": 8, "day": 3, "text": "书说：禅僧如果每天一心只想着做饭、扫地，不念想其他事，就是一种修京中速记一RSAL\n"}, {"year": 2022, "month": 8, "day": 4, "text": "不日将启程敦煌，草上翻书，徜祥西域，又和远在理塘的老三聊起高原。\n突然对“色即是空”若有所思：有时候，眼里的色填不住心里的空；又有时候，心里的色遮住了眼前的空。所以，色即是空，只是你的色不是你的空。比如眼前的绿色就是一种转瞬即逝的空，而遥远的大漠或是孕育坚定\n"}, {"year": 2022, "month": 8, "day": 7, "text": "思想食堂与朱海就老师2年打磨好课：真实世界经济学。经济学家和企业家一样不避讳幽暗，也不倡导崇高，尊重人性，所以经济学即是“人学”。\n这个“人”字的前面如果需要形容词，一定是：自由的。\n其实很多人误会了经济学，把经济学和财经、商业搞一起了，真正的经济学者关注的是人，关注人的行为如何发生，每个独立的人和其他一切的关系，也即社会的真实运转法则。\n一与朱老师在灵隐策课时草记。\n堂课了解真正的经济学一一奥派经济学与哈耶克思想|课程\n"}, {"year": 2022, "month": 8, "day": 7, "text": "航变，明早提前出发。放不下这口菇子，刹碎了浅浅的贴个秋\n"}, {"year": 2022, "month": 8, "day": 8, "text": "在廊坊市北京国际机场，喝一碗16元的“皮蛋瘦肉粥”，读一本8元的\n《敦煌宝藏》。哪个更能反映“人民日益增长的物质文化需要同落后的社会生产力之间的矛盾”？\n报告，我是人民北京市·北京大兴国际机场航站楼-国内出发\n"}, {"year": 2022, "month": 8, "day": 9, "text": "疫情消息此起彼伏，很多地方都去不了，茫茫西域似乎只有敦煌默默扛住了所有。游以稀为贵，学以师为稀，这几日有诸多变化干扰，都一一化解，深感本次游学得到于老师和敦煌研究院研学前辈的优先支持，实属大幸。唯博物馆的表情包和久违的沙葱和马特，为忧伤的搬砖人压惊。顺利接到队友，希望明天各位远方的朋友平安抵达。\n"}, {"year": 2022, "month": 8, "day": 10, "text": "自2020年开始，思想食堂游学就默默多了机场一日游环节，还没出关，\n已喝足了大西北的风。接到本次游学的最小同学，7岁的Maggie，两年未见，长大了一大截，该是经得住未来一周的天干大风吹、烈日黄沙晒了\n"}, {"year": 2022, "month": 8, "day": 11, "text": "青山流水易多情，黄沙残阳真干净；风吹殷殷心头空，焕见朗朗月儿明。\n"}, {"year": 2022, "month": 8, "day": 11, "text": "孙志军老师开讲游学第一课，屏幕上全程大片，随手拍的沙尘暴视频仿佛电影《2012》，令人惊叹。\n第一次看到孙老师的名字是在樊锦诗老师的传记中，书里樊院长说每每扛不住的时候就会去158窟，看看涅的大佛。那张涅佛像的插图下有一行小字“摄影孙志军”。\n孙老师从事敦煌文物摄影三十多年，被誉为“莫高窟的定影者”，也是研究院接待各国文化“使节”的“御用”代表。\n感谢研究院文化弘扬部柴副部长争取，今日孙老师能拨（据说有日本学友团在排队等候）授课并带队考察阳关、玉门关、古长城、河仓城及雅丹魔鬼城一线，期待万分。\n孙志军《以图证史一敦煌莫高窟以及周边环境演变》\n#思想食堂暑期敦煌游学·与历史学家同行\n"}, {"year": 2022, "month": 8, "day": 11, "text": "跟着孙老师，在阳关拐进本地老司机都不知道的一条小路，闯进2000年前的汉代龙勒（高马为龙，驭马为勒，因擒疑似汗血宝马献汉武帝闻名，\n是当时本土最边远的县城）遗址：寿昌城。在尚未进入考古发掘之前，在文保单位圈墙前，和当地没有暑假辅导班的小朋友在玩笑中做了一场真正的田野考古，他日寿昌城成为阳关热点，此番踏足可谓意义非凡。\n孙老师详细介绍了古城遗址的年代、结构和历史变化，语言精炼客观，颇有国家地理风。走出寿昌城，远眺古董滩并阳关古烽燧，溯疏勒河西行至玉门关，于狂风中徒步汉长城遗址，细数烽火台点火材料，搜索守关军士生活痕迹。。。比之于2年前单驾西游，其收获、感悟不可同日而语。\n"}, {"year": 2022, "month": 8, "day": 12, "text": "就地开始游学第二课，于哲老师正在讲《敦煌大历史》，丰富的独家细节加上于氏单口幽默，实乃提神抗衰老之神课。敦煌昨日突发全员核酸，\n历史正在发生，历史仍在重复，历史充满争议。记下今天，把历史还给未\n#思想食堂暑期亲子游学·与历史学家同行·敦煌大历史\n"}, {"year": 2022, "month": 8, "day": 14, "text": "敦煌静默，已守在酒店第三天。这场文化游学也不知不觉成为那场“战争”中的一部分。仿佛是一群未经训练的临时兵，被赐予战士的称号，无师自通地就地开辟阵地，对着看不见的敌人乱射一通，把子弹打光，然后靠在静默的午后战壕，不知道传说中的敌人还在不在，静默，等待。只能等待，等待任何可以打破静默的声音。然后，痛饮一顿。\n《大沈歌》\n大瓮一扬倾江海饮日吞月胸中来大梦一场三千载悲喜穿肠莫挂怀大风翁张浪形骸疏狂放歌死便埋大疯一躺两相忘不知东方天既白\n"}, {"year": 2022, "month": 8, "day": 15, "text": "同学们普遍觉得这个“老”酒店有人味，连续两天出不去门，却几乎没见到因吃住产生冲突静默期旺季房费2.5折，餐饮5折。晚上排核酸，大姐告诉我，这是一个拥有一半以上20年老员工的酒店，总经理和副总全天与团队同在。\n"}, {"year": 2022, "month": 8, "day": 17, "text": "今日最动听。\n再见，敦煌。\n再见，山庄。\n"}, {"year": 2022, "month": 8, "day": 17, "text": "和疑问，也带来了行动和尊重。\n以上，敬礼敦煌。\n再见。黄沙，裹着风。无数次掠过河畔的绿洲，却不能安住在青山绿水间，因为唯有辽阔的西域大漠才是他们的故乡。\n又见。那些繁华而温润的城市，把抵御风沙作为古老的使命奉若至理，却又对那片苍茫心驰神往。\n融合，即碰撞。\n只是来自东南沿海的精打细算，在光天大漠下难免成为一种矫揉造作。大风吹来一片黄沙，凡阳光熨烫过的，不留下一点褶皱。谁还在执着东西之分，中心与蛮荒之别呢？\n历史的定律从未停止作用，而是局部地在每个人身上悄然重复。\n#思想食堂敦煌游学·与历史学家同行\n"}, {"year": 2022, "month": 8, "day": 19, "text": "饭点出的门，开了一百多公里，一家人吃顿风餐。找到个好地方，得喝一\n"}, {"year": 2022, "month": 8, "day": 20, "text": "北京的金山上。。。有点冷，去捡点柴火。\n哎巴扎嘿。\n"}, {"year": 2022, "month": 8, "day": 25, "text": "因朋友突然被黄码加身，诸多围绕朋友计划的行程夏然而止，落个半日清闲。在这条走过无数遍的小路上，想起一个个曾于此并肩漫步的亲人、朋友、老师和同学。。。真是一段不可思议的存在，幡然醒悟自己为什么执着于四处推崇这个隐没杭城的人间所在。从白天晃到黑夜，像是在一个全新的国度，仿若那年秋天，浪迹在满天茶香的宇治乡间，有种别样的轻松\n"}, {"year": 2022, "month": 8, "day": 26, "text": "走飞来峰，登永福寺。祈福。稍息，亮点是体验了新开的咖啡厅，点一杯“随缘”，先为咖啡口味抽签，我抽的是《心经》，想到自己只抄过此经，不算偕越，正得意的很，翻开签条：“分辨内心善恶，方能得真自在”朴素的道理，与诸哲无异，骇然起敬，饮一口慈杯压惊。\n"}, {"year": 2022, "month": 8, "day": 27, "text": "今天的课，董平老师讲阳明先生。\n"}, {"year": 2022, "month": 8, "day": 28, "text": "成立班委，酝酿半年，一切美好，写在脸上，耐看。\n不要紧张，生活是好玩的。\n#浙江大学生命哲学高级研修班1期\n"}, {"year": 2022, "month": 8, "day": 28, "text": "两天课，记两个关键词。\n如何成为自己？知行同一。要点，知就是行。\n如何避免痛苦？心脑如一。要点，心不是脑。\n浙大中国思想文化研究所专场所长董平老师副所长何善蒙老师\n#浙江大学生命哲学高级研修班1期\n"}, {"year": 2022, "month": 8, "day": 29, "text": "朱海就：俄乌冲突的一个重要原因，可以归结为“经济学的贫困”。\n你怎么看？见面聊。\n讲者：朱海就浙江工商大学社济学程教理\n「1奥派经济学的价值奥源经济学7其特点是什么？\n反经济学有部登重要的研究方法？\n十么每个人都应读下奥派经济学？\n经济学的代表：米塞斯和哈耶克2哈耶克思想的精髓水覆念：一般性规则、开放社会、自发秩序力一般性规则？其价值何在？\n开放社会7其特征是什么？\nh自发铁序？虚向自发投序的因难在率量？\n"}, {"year": 2022, "month": 8, "day": 31, "text": "徜祥一下。最近藏区疫情防控折腾的紧，好多奔赴城市文明的藏族新青年都从大城市回到田园牧场，品味幸福。看看会唱歌的仁增兄弟，环视着自家院子，收拾完毕的青稞架，滑溜结实，院子里有鸡也有牛，正一个个闲庭又信步。。。想必那看不见的酥油茶也正冒着气呢，真是个令人向往的收获季。\n· · ·\n"}, {"year": 2022, "month": 9, "day": 1, "text": "就这会儿，北京大三环的办公室里已率先迎来一大批“爱岗敬业”的资深搬砖人。不论起多早却总比师傅晚到的新员工小王表示太难了。得感谢还有下一代。\n"}, {"year": 2022, "month": 9, "day": 3, "text": "乡村小画匠侥幸被冠以“艺术家”称号，每日郊游的爹娘难得跟着进趟城，\n猝不及防被一波艺术成功学深深打动了。。。沦陷在幻灯投影技术的包围下，简直挪不动腿，差点要错过墙背后的梵高和毕加索。\n"}, {"year": 2022, "month": 9, "day": 4, "text": "秋风不拘，小儿问鱼。\n"}, {"year": 2022, "month": 9, "day": 5, "text": "十分感念敦煌，油然升起一种继续为美好事业而奔走的使命感。\n正巧手机上俞敏洪老师在直播798的敦煌展览，敦煌研究院特别派考古所的张小刚所长飞来北京参与直播。于是，一场商人与学者、好奇者与当事人、话语权与失语者的交流与碰撞就被460万人撞见了。。。\n如果你没看，无需遗憾错过，所谓百闻不如一见，有兴趣的同学应该直接去798看展，但以我浅显的符号学经验，当然应该直接去敦煌看现场。事实上，学者如张所长就没怎么说过令人动听的话，说的那些“文不对题”的千言万语汇成一个潜台词大概就是：你说得对。\n那么，究竟俞老师说对了什么？坦白讲，以俞老师的口才，又赶上“敦煌”主题，用“口吐莲花”来形容也不为过，但他那些精彩纷呈的敦煌演绎和诸如“敦煌那么苦，您怎么坚持下来的”的循循善诱，时隔30分钟后，\n我也不记得了。\n唯有，评论区精彩。非常精彩。\nGreatArtofDun-hoang!!!!!\n"}, {"year": 2022, "month": 9, "day": 7, "text": "虽然不吃甜食，但路过正当季的巴黎贝甜，很自然就进去扫了一圈。你看，人真是个奇怪的物种。\n朱老师上周课上说，米塞斯本想把他的理论命名为社会学，却发现已经有人在搞了，干脆直接叫“人的行为”学（不知道怎么又被搞成“经济学”了，真是令人伤感）。\n这真是个迷人的学问。毕竟，人的行为是鲜活的充满奇迹的，至少“谁也不能决定什么事物会使另一个人快乐。\nSUETTE\n"}, {"year": 2022, "month": 9, "day": 8, "text": "大妈已退休，大爷七十六；金风吹玉露，幽阳走高秋。\n"}, {"year": 2022, "month": 9, "day": 15, "text": "很多人看过这本书，也有很多人和我一样听过很多人无数次提起这本书的名字，但就是没看过也不知道书里写了什么，这没什么。因为大部分书看过了也就忘了，那种一干二净的忘。而，这真是个好故事。\n"}, {"year": 2022, "month": 9, "day": 16, "text": "从瓜州到亳州，沽酒各半各。\n游学工作之乐。\n曹操宗族嘉爵文字砖拓片全国巡展物博州老曹频宗旗基群文字砖展厅\n"}, {"year": 2022, "month": 9, "day": 18, "text": "游学探路小记。看了几处纪念老子的地方，听了很多“一生二二生三脑子里一直惦记着《道德经》有一句“圣人之道，为而不争。”1-2道德中宫“老子讲学处”（毫州问礼巷·涡河附近）\n3-4太清宫“老子诞生地”（周口鹿邑·涡河附近）\n5涡河“老子母亲河”6-7明道宫“老子升仙台”日军弹孔及炮手道歉碑（周口鹿邑·涡河附近）\n8-9天静宫·老子庙（毫州涡阳县·涡河附近）\n很遗憾，这几个关于老子的纪念场所都是汉代及以后建造乃至重修，都不是老子本人生命过程中直接相关痕迹。老子是鹿邑人，还是毫州人？老人家肯定没想到这事曾让他身后2500年的子弟乡党们伤了脑筋。争了几十年，虽说没有完全达成共识，但也算是握手言和了。正如两边的朋友们都说，俺们也就隔30公里，要不是后来行政分离，1000年前还是一家人这几个纪念老子的地方其实有个共同点，都紧邻着一条共同的母亲河一涡河。那可真是条美丽的河流，碧水蓝天，草木丰饶，缓缓地流着。真是“上善若水，水善利万物而不争。”所以，老子应该会很愿意被记为“涡河人”吧。\n"}, {"year": 2022, "month": 9, "day": 19, "text": "我谢谢您。\n温馨提示3吉大春宾安庆市·安庆师范大学（北校区)\n"}, {"year": 2022, "month": 9, "day": 23, "text": "明天早起，参加课前班级活动：大运河亚运公园6:00集合&拉神6:15出发\n"}, {"year": 2022, "month": 9, "day": 24, "text": "首跑，花开在眼前。\n"}, {"year": 2022, "month": 9, "day": 25, "text": "盛老师：没错，是我今天讲康德，重思生命与理性。\n#浙江大学·生命哲学高研班\n"}, {"year": 2022, "month": 9, "day": 27, "text": "陈嘉映、孙周兴，赵林、刘擎、杨立华、周濂、傅杰、董平、王俊、程乐松、姜宇辉、雷思温、何欢欢、何善蒙、吴冠军、曾劲恺16位教授出任哲学班2期教席。另有1期班王德峰、陈亚军两位教授课程同时举行。\n感恩「生命哲学」发起人孙周兴教授和浙大哲学院王俊院长一一敦聘。\n#浙江大学「生命哲学」高级研修班生命哲学级研修班。二哲学靠近生活让哲学回归心暂学安顿自我用哲学指引生杭州市·杭州萧山国际机场T3航站楼-国内出发\n"}, {"year": 2022, "month": 9, "day": 29, "text": "从校博到国博，看《中国历代绘画大系》成果展，成果之大，大的惊人；\n成果之多，多的骇人。偶遇艺术学院金晓明老师现场讲解，被围。转了三个小时，腿软。稍息。\n推荐：一次性看全中国散落全球的历代名画，高清印刷，资料详实。个人审美精神乐园，家庭亲子艺术高地。\nZUNANLAPASM\n"}, {"year": 2022, "month": 9, "day": 29, "text": "驻足良久，意外之喜。\n· · ·\n"}, {"year": 2022, "month": 10, "day": 2, "text": "重读季羡林《留德十年》，几年前对这篇“青年找路”的故事印象不深，今天算是品到了。大人物谈小时事，往往最要紧。这残破和遗失的封面就像永逝的青春，十年光阴，所幸尚有只言片语，之所以隽永，大概是因为活得认真，写得真实吧。\n"}, {"year": 2022, "month": 10, "day": 6, "text": "推荐诗人俞心樵，《要死就一定要死在你手里》作者。曾和俞老师有一面之缘，远看热血，中观正气，近闻谦卑。可叹当今世面，文人有种。俞老师身心同一，诗、书、画俱奇。可惜，没有简体汉字出版机构能与他肝胆相照，思想食堂亦不能礼聘开讲，期待有机会组织同学一同拜会。\n独家书讯|瑞典出版俞心樵诗集《生活，美好得几乎想报警》\n"}, {"year": 2022, "month": 10, "day": 6, "text": "霓虹，拉萨。\n大昭寺僧人拍摄，转发此视频的央吉仍在居家封控中，明天将满60天。\n"}, {"year": 2022, "month": 10, "day": 6, "text": "理塘，拉波镇。吃足松茸后埋头养牛的黄老三，剃了胡子之后应该不会挨妈妈骂了。\n"}, {"year": 2022, "month": 10, "day": 7, "text": "给远在青藏高原的三叔推荐了一位画中人，心情大好的豆哥表示：这里还是有些自己喜欢的画儿，只要别让他像那些孩子一样做“任务”，吃过饭可以再来看看。\n全国优秀美术作品展览\n"}, {"year": 2022, "month": 10, "day": 12, "text": "赵林教授谈哲学与往事，时代、教育、自由、老师、学生、未来一赵林：我总觉得哲学是在最后，就是黑格尔那句名言，“密涅瓦(Minerva)\n的猫头鹰只在黄昏时飞行”，密涅瓦就是雅典娜，智慧女神，智慧女神的猫头鹰就是智慧的象征，猫头鹰总是在黄昏才起飞，所以人到中年以后，\n可能哲学才可以真正地高高飞翔起来，而此前的哲学都隐蔽在艺术、文学、历史这些具体的知识背景后边。\n所以本身艺术里边就有哲学，文学里边也有哲学，历史里边更有哲学，但无论是一个时代、一个人，还是一种文明，都要到了黄昏的时候，哲学才能真正高高飞翔。\n对话赵林老俞闲话一往讲台上一站，我就能找到自己\n"}, {"year": 2022, "month": 10, "day": 16, "text": "花落秋风美，\n举杯莼鲈香。\n梦里金桂过江，\n天涯路茫茫。\n上山英雄气短，\n下海儿女情长。\n天地有精神，\n青年不可躺，\n遥想太公姜。\n西风烈，\n白日青，\n鱼歌唱。\n旌旗十万转头，\n斩多少豪情。\n惯看南国封烟，\n闲钧北国风光。\n子在河东日：\n小人跟风，\n君子向阳。\n"}, {"year": 2022, "month": 10, "day": 17, "text": "刮了一天的风，今夜2℃，冬天到了。\n"}, {"year": 2022, "month": 10, "day": 17, "text": "新疆克孜尔石窟遗落在德国，一位“龟兹的女儿”的故事，十指连心，令人这时候我们家先生就不愿意了，说：赵莉，我们自觉一点，我是你的家属，我能进到这个文物库房，人家已经很不错了，差不多就行了，不要让人家把我们撑出去。那会儿，我已经急红了眼，我大声说：你少管我！这是我们家的东西，我就要拍，我说拍什么你就给我拍就行了。\n我每次进到这个洞窟，全身都起鸡皮疙瘩，好像全身的皮肤都被扒光了|赵莉一席第927位讲者\n"}, {"year": 2022, "month": 10, "day": 18, "text": "哲学班纳新和续费人数已过30，招募仍在“双向选择”中。感谢朋友们的支持和宣传，一点观察分享给诸位一二期发布两周，已收到过百人咨询，环比多了一倍。很多人直接填了详细的履历信息，一看就很有诚意，但一谈到学费，一些优秀的候选人表示“有压力”。这很意外，因为一期班同学在交流晚宴时，普遍向孙教授和王院长反馈学费“超低”。。。探问之下，一个回答可做典型：“不是学费贵，是钱更难挣了”。这样的话，你是不是也越来越耳熟？\n相比较，一期班3月中旬发布，候选人很少对学费有疑虑，最大的困难是当时北京、上海、深圳的朋友对能否来杭州上课充满担忧。即便如此，在那个并不温暖的春天，仍有80人报名，虽然最终仅录取了半数40来人。\n"}, {"year": 2022, "month": 10, "day": 22, "text": "嘉映老师今天课程有三高兴：\n1，好友孙周兴教授挺身“分担”明日课程。\n2，可算与首师大博士生见到面了。\n3，项老师携众学生在台下听课。\n"}, {"year": 2022, "month": 10, "day": 23, "text": "尼采猜想。被忽略的世纪之谜，今天似乎有了答案。\n中国人是典型“末\n"}, {"year": 2022, "month": 10, "day": 31, "text": "“如果你也被这个问题困扰，那么你不孤独。人类历史上有一些最了不起的头脑思考过这个问题。...但我必须坦诚相告一个真相：没有任何人能给出确定无疑的可靠出路，告诉我们如何走出这种困境。尼采说：一个人能承受多少真相，是对他精神强度的考验。\n这也是一个高能预警：我们这场思想的旅程将要进入一段险峻的路途，将是一场历险，你要准备接受精神的考验。”刘擎：心灵无家可归是现代人最大的精神危机\n· · ·\n"}, {"year": 2022, "month": 11, "day": 2, "text": "上海有迪士尼，北京有环球影城。小朋友次密接，被动小团圆，诸事不宜，不知不觉就混掉一个星期。再熬一夜，天亮就出门。\n"}, {"year": 2022, "month": 11, "day": 5, "text": "豆哥表示：只要别老提考试成绩，20年后他还是愿意带我们出去玩的。\n"}, {"year": 2022, "month": 11, "day": 8, "text": "最近一直惦记着不得行的高原。终于在桌子底下猫了几分钟，找出十年前就拥有的这套书。擦掉老灰，还没看两页，心中连骂何不早读？何不早读！庆幸搬家五六次没弄丢，临时想到还能马上上手。正所谓读一本书最好的时间如果不是十年前，那一定是现在。\n摘一句译序：“我跟随作者走进那片令人放松的原野，享受大自然给予的抚慰。翻译这套丛书使我亲身感受到词语的魔力，文学好比月光，看似无用，但又不可或缺。\n"}, {"year": 2022, "month": 11, "day": 11, "text": "出行并不方便，报名哲学班是怎么考虑的？——接咨询电话或回访新同学时，照例先答疑，然后我会以开头的提问来开启下一个话题。于是，“尝键词。。。\n虽然大家对于美好的定义不同，但追求美好的心意相通。为了继续和好的事、好的人“纠缠”，2期课程依然会坚持线下举行。\n招募录取工作业即将进入尾声，十分感谢朋友们的转发、关注和支持。已定于12月31日上午举行视频开班会议，希望能全班聚齐，届时将发布新的课表和书单。期待在今年的最后一天，一起为命中注定的2023透透气，预设新纠缠。\n生命哲学高。级。研修班暂学近生活让哲学回归心暂学安顿自我用哲学指引生\n"}, {"year": 2022, "month": 11, "day": 12, "text": "哲学班程乐松老师一道教不仅是一种过时的知识结构，不是上来就说风水、算命、择吉，更重要的是一种独特的生命理解。\n我们中国人的生命理解中，高度自然主义的这种随性地、从容不迫地面对自己生命的精神，实际上是以道家为底色的。因为我们相信天地之道，会认为生就是从天地之间来，死就是回到天地之间去。这样一种恬淡的从容的生命态度，在任何时候，都是重要的思想资源和精神资源。\n程乐松：耽玄尘居，道教的超越与日常\n"}, {"year": 2022, "month": 11, "day": 17, "text": "“我们看到今天这个社会上，很多成年人缺乏一种人文关怀。所谓缺乏人文关怀，就是缺乏发现美的眼睛，缺乏一颗善良的心灵，没有在真、善、美之间求得一个平衡。这是我们人文学科，是历史学、文学、艺术着重要带给大家的。希望大家以后能够在求真知、求善良、求美好的道路上，取得一种平衡。”姜鹏：司马光砸缸是假的，但为何这个故事值得讲？|纪念司马光诞辰1003年\n"}, {"year": 2022, "month": 11, "day": 25, "text": "据说当代好厨娘不洗碗的主要原因是厨房里缺一扇飘窗。\n"}, {"year": 2022, "month": 11, "day": 25, "text": "仿佛走在波士顿的街头，又仿佛看到瓦尔登湖的小木屋，乃至海德格尔的黑森林。记德胜洋楼，买不到的楼。\n"}, {"year": 2022, "month": 11, "day": 27, "text": "“铁嘴”赵林教授发声跟很多同学介绍过赵林老师，再正式认识一下一北京人在武汉，78年入武大历史系读书即成风云人物，在那个思想解放的年代，青年学生赵林有经典名言“我就是历史”。\n青年酷爱哲思，考研却因“政治不合格”被武大哲学系pass，刘道玉校长出手留他在历史系，校长伟大，青年有幸，武大辉煌。3年后，历史学硕士再读哲学博士，并留校执教哲学至今，课上座无虚席，曾带武大辩论队得全国冠军，是武大最受学生欢迎的10大名师、四大名嘴教授，能上百家讲坛，也能当B站UP主。早已著作等身，名满天下的赵林老师最得意之事：永远是给学生上课获得掌声。\n教育名言：想要成为一个真正受到学生热爱的老师，不仅需要渊博的知识和深邃的睿智，还需要高尚的道德情操和高超的授课艺术。\n哲学名言：我们生活在一个哲学没落的时代。\n赵林教授此番发声，令人肃然起敬。感恩孙周兴教授力邀，致敬。\n武汉大学哲学院赵林教授最新新冠体验报告：比轻微感冒还要轻！！！\n"}, {"year": 2022, "month": 11, "day": 28, "text": "此刻，诗人说：\n大冬天的杭州天雷滚滚震耳欲聋...紧接着倾盆大雨...莫非是无数量的冤魂要复仇...如此反常的现象把我这么伟大的天体物理学家和气象学家都给搞糊涂了…..\n诗人是俞心樵先生。\n"}, {"year": 2022, "month": 11, "day": 29, "text": "“在涉及到确定为全人类提供指引的伦理原则方面，哲学发挥着不可或缺的作用，过去我们制定《世界人类基因组与人权宣言》是这样，新近教科文组织193个会员国在我们上届大会上通过《人工智能伦理问题建议书》\n也是这样。\n联合国呼吁：重思人类未来，质疑世界的隙所在1世界哲学\n"}, {"year": 2022, "month": 11, "day": 29, "text": "为啥马克思本人不是马克思主义者？因为不在现场，特别回访了好几位“久学成师”的同学听课感。无不盛赞包老师的课程讲得精彩，统一收获是终于在误读马克思的歧途上掉过头来。\n坐在隔离酒店里翻PPT，金句迭出，信息量极大，比如这几天少不了会出现“以人民的名义”社论文章诱人上头，不妨冷静一点，在落实自己是否属于“人民”这个历史悠久却内涵不稳定的共同体之前，先对照审视一下自己首先还算不算一个全乎的“人”。西哲老师引用《说文解字》，不愧是孙教授和王院长都力推的优秀青年教授。又比如“思想一旦脱离利益，就一定会使自己出丑。”马克思一百多年前的大实话，简直迷人至极。\n忍不住期待，二期课再现场聆听。\n生命哲学命首学高级研修班制与人的异化\n"}, {"year": 2022, "month": 11, "day": 30, "text": "解禁，感谢朋友们的关心。离开前发张近几日的精神状态照，以示姿态。\n窗外风雨交加，换上出北京时穿的羽绒服。回家。\n· · ·\n"}, {"year": 2022, "month": 12, "day": 16, "text": "在楼下等风雨兼程的姜宇辉教授。班级群里正讨论着Tobeornottobe这课，上，还是不上，是一个问题，吗？+同学说，阳了没的选，肯定不能来（嘘嘘大家），－同学说，随缘就份，心安都好。姜老师风尘仆仆，\n在口罩里笑着说，这不是老师的选择题。帅。\n肉眼可见朋友圈的阴性正在清零，真不知道，明天和病毒哪一个会先来。\n生命哲学，不抗毒，抗纠结。\n明后两天的课程关键词：从笛卡尔到黑格尔、现代自我意识的生长，到大数据时代的数字亲密和精神症候，乃至元宇宙中的脆弱主体。很符合今时今日的情境，期待两天的口罩课。\n"}, {"year": 2022, "month": 12, "day": 17, "text": "两年后再见，迷人的姜老师依然有着谜一样的年龄，和迷人的哲思。还有迷人的同学，迷人的课堂。\n"}, {"year": 2022, "month": 12, "day": 17, "text": "课间大家保持科学距离，研讨抗毒经验，无敌的班长给老师和同学们发了杭州亚运会茶息口罩。迫不及待换上，一瞬间，呼吸都是龙井茶山的味看姜老师，绿了后，是不是更迷人了是时候重温一下哲学班slogan不要紧张，生活是好玩的\n"}, {"year": 2022, "month": 12, "day": 18, "text": "#生命中的身份。今天的课程主题，一个字：我。\n请生于台湾、家住上海的加拿大籍牛津博士、浙大哲学院博导曾劲恺老师讲这一课，跟着曾老师让“我”穿梭在中与西，汉与英，历史与未来，自然与精神，笛卡尔到黑格尔之间穿梭。有幸聆听。\n比之于世间万象和身边众人，我们对“我”的身份由来对关注和审视其实并不多，也缺少好的方法，尤其需要引导和参考。\n现代自我意识的生长\n"}, {"year": 2022, "month": 12, "day": 26, "text": "二期，周末开班。一年的最后一天，将有幸与《生命哲学》发起人孙周兴教授、王俊院长一起，以视频会议的方式，打开40位新同学的观念世界，聆听他们的生命故事。\n这一年，下一年。凝视，期待。\n开班读书生命督学高级研修班开班议程主特点名我学助理全体同学\n"}, {"year": 2022, "month": 12, "day": 30, "text": "推荐哲学班一期班长的专访文章，宁翘市长的班，也不愿缺一次课，几乎颠覆了我对官员的全部印象。\n大江东蝶变美丽云城她是“最美”招商人\n—— 2022年 · 共154篇 ——\n2023\n"}, {"year": 2023, "month": 1, "day": 21, "text": "乌伴玉兔，跨步旧岁除一日一思进，一岁一福图癸卯寄语\n"}, {"year": 2023, "month": 1, "day": 22, "text": "假如文明令你失望不要心急，不要悲伤去那梦想开始的地方生命正在纵情卯春行记安庆·Wuyi Village\n· · ·\n"}, {"year": 2023, "month": 2, "day": 14, "text": "“去年11月的一天，罗新开车进北大，学校进出要刷脸，在校门口，一位看起来只有20岁出头、长得很精神的保安过来扫他的脸，屏幕上出现了名字，保安的表情变得很不一样，「是罗老师啊」，他说，自己刚读完了\n《漫长的余生》，「我上周日用了四小时一口气读完的，读完立刻觉得心静下来了」，罗新觉得有些感动，对方又补了一句，「就像看了杨德昌的\n《一一》」。\n关于「2023年会不会变得更好」，罗新也是这样回答我们的：「未来会不会变好，我们不知道，但是这也取决于我们想要什么，我们做什么，我们为自己想要的东西做多少努力。」”罗新：一个历史学家，不想再对帝王热情\n"}, {"year": 2023, "month": 2, "day": 18, "text": "【当代生命的痛痒：忙】新年首课，摘一段贡老师书中文字分享：“每个时代的水不一，每个时代的风各异，每个时代饮水吸风者皆有自己的痛痒。。。呼吸当代的风，啜饮当代的水，就有了当代的痛痒。\n忙，及其衍生的精神困境是我所感受到的痛痒，也是当代大多数人的痛痒。。在哲学层面上触及自己的痛痒—拣择问题、化解问题，这是哲学家的本职。”华东师范大学教授中国智慧研究院院长生命价学浙江大学生命售学高线轴心文明的生命沉思任真与平淡道家的生命\n"}, {"year": 2023, "month": 2, "day": 23, "text": "人生已有如此成就，为什么还要辛苦学哲学？\n很多南来北往的新杭州人，对办理存档、落户、领补贴等等“公事”的窗口效率赞叹不已，很大程度都因为与公务员打交道很愉快。没有对比很难体会，综合自己和身边各城市同学的直接经验，我可以说杭州应该拥有一批全国相对最有平民精神的一线官员队伍。\n例如视频中的陈静同学，她在系统里被表彰为杭州十佳、杭州最美公务员，她的在职岗位充满挑战，全年无休的工作可以说毫不轻松，但她仍然坚持到教室上课，在课间用视频记录了参加生命哲学班的美好时光。这个视频回答了很多人问她的问题一为什么学哲学。\n"}, {"year": 2023, "month": 2, "day": 26, "text": "傅杰老师讲孔子几十载，在复旦授课受各时代同学们爱戴，桃李无数，经久不衰。5年前也曾有幸请到老师授课，而今次格外不同。一则浙大即傅老师开讲《论语》之地；二则自沪返杭数年，这是第一次在校园的教室里给同学们正式授课。不亦乐乎。\n几子与猫家生学湘江大婆\n"}, {"year": 2023, "month": 2, "day": 27, "text": "飞来峰上理公塔闻说王子弃东宫不畏浮生历万险自缘身空心也空二月初八释迦牟尼佛出家日登飞来峰遇月真法师书法有感仿王安石《登飞来峰》\n· · ·\n"}, {"year": 2023, "month": 3, "day": 8, "text": "摘要：何香凝在《回忆中国的第一个三八节》中说：散会以后，我们挺起胸膛、踏着大步在大街上游行示威，数百名妇女成群结队地喊出了“打倒封建主义、打倒帝国主义”“保护童工孕妇，革除童养媳、革除多妻制，禁止蓄婢纳妾，废除妓制度”“争取妇女解放”等响亮口号。\n祝你来到这个人间，迎接你的是来自大家衷心的祝福，而不是被差别选择之后的无奈。\n祝你在少女阶段能自由选择爱好，不被强迫接受弹钢琴/刺绣/绘画等被世俗认为具有女性特征的兴趣。\n祝你上班时不用藏起你心爱的超短裙，也不必在男上司的酒局里担胸露乳，被迫听那些不堪入耳的黄段子。\n祝你享受每一次约会，即使是AA制，也丝毫不影响对面那个男孩的魅力祝你好好感受每一场恋爱，在其中获得来自人类本能最美妙的体验，而不仅仅依靠获赠口红包包豪车别墅时的快感。\n祝你能够完全听从自己的内心，选择成为一个孩子的母亲，或决定做一个生育的旁观者。无论做怎样的选择，大家都会对你说：“挺好的。”祝你作为女性，感受到一种真正的平等，这种平等，并不因为我们的性别而获得更多照顾，也不因为性别而承受更多苦难。\n普通妇女节快乐\n"}, {"year": 2023, "month": 3, "day": 8, "text": "晚安，女神zz2伦勃朗画的雅典娜，文艺复兴大师笔下最传神的女神，集智慧、艺术与力量与一身。\nallasAth\n"}, {"year": 2023, "month": 3, "day": 16, "text": "一个具有独立人格的人，如何与另一个精神自由的他者和平相处？来哲学班上课的“人生赢家”们将如何构建一个共同学习的组织？这正是《生命哲学》的实践课题之一。哲学班发起人孙周兴教授说：作为研究共同体，哲学必须首先捍卫个体，生命才能抵抗愚蠢。王俊院长说：每个共同体的观念都需要被建构，哲学最特别之处就在于不断为生命观念构建意义。\n二期班的【建组计划】源于优秀的同学们对班委计划的“冷”反馈和“热”建议。我想，这正是哲学研究者作为独立个体的自由精神之体现，\n也是同学彼此间对“他者”的尊重与善意之保护。\n如果生命哲学终将带领我们超越虚无，构建意义，那么就从构建一个小组开始，共同开启一段“同哲学，共生命”学习之旅。\n同哲学共生命建/组/计/划建组步骤\n3月18日08:00-09:00签到台拍签获组10:20-10:40网选定组代表11:30-11:35提间前组内讨论11:35-12:05维代表依次发言12:20-13:20小组助牛餐会\n"}, {"year": 2023, "month": 3, "day": 17, "text": "日本游学，5月中旬出发，筹备三年，打磨半年，市面上绝无仅有的心灵之旅，值得你的8天生命。\n高野山金刚峰寺和奥之院，\n大师行迹\n"}, {"year": 2023, "month": 3, "day": 18, "text": "为今天的维摩诘课，何欢欢老师特意将国家博物馆的《画佛有形化法无相》历代绘画大系讲座提前到上周。\n《维摩诘经》又名《不可思议解脱经》，迄今讨论最热烈的课。\n不可思议。心无挂碍。\n不可思议。不二法门。\n"}, {"year": 2023, "month": 3, "day": 19, "text": "一口气讲了150分钟《近道以离尘》，全程无尿点。上周在直播上看了程乐松老师主持庄子五人谈，略闻才思与雄辩，今日现场感受，纵横阖，\n令人无限叹服。有同学说，不愧为北大哲学系主任。\n"}, {"year": 2023, "month": 3, "day": 21, "text": "又一年。\n天地有大美而不放\n"}, {"year": 2023, "month": 3, "day": 22, "text": "携雅君子访永福寺忘机禅师半日，体味一首唐诗：\n终日昏昏醉梦间，忽闻春尽强登山。\n因过竹院逢僧话，偷得浮生半日闲。\n唐李涉《题鹤林寺僧舍》\n"}, {"year": 2023, "month": 3, "day": 22, "text": "没有一种思想可以脱离时代，没有一种哲学可以忽略生命，没有一种美好可以遗世独立。受邀走访「生命哲学」班长同学工作现场有感。\n一期同学结业在即，有近一半的同学续学二期课程。哲学班的同学们大多上过名校MBA或EMBA，也不乏长江或中欧校友，他们不在乎logo或者标签，但在意生命里那些共度成长的时光，他们说班委的意义始于课程的尽头。我信，且期待。\n热烈欢迎\n"}, {"year": 2023, "month": 3, "day": 24, "text": "想起先生的话，真想和他喝一壶啊一好读书，不求甚解；每有会意，便欣然忘食。性嗜酒，家贫不能常得。。。《五柳先生传》\n"}, {"year": 2023, "month": 3, "day": 25, "text": "回望生命哲学1期班的学习之旅，我们从轴心时代出发，溯源古代先贤朴素而本源的生命观，穿过中世纪的迷雾重获启蒙和理性，再进入技术文明时代的哲学反思，同学们仍免不了有个现实的疑惑：“为什么美国人没那么多历史传统，却以“有用即真理”的实用主义哲学成为世界上最先进的共同体？”终于等到陈亚军老师的课，应该是目前国内最好的实用主义哲学研究者，\n今天为大家开宗明义《作为一种生命哲学的“实用主义”》。\n为了这一课，陈老师反复备课一周，了解了生命哲学班同学们的哲思氛围，最后选择放弃PPT和讲义，决定以对话的态度全新构建课堂关系，\n希望以“学以致用”的实用主义课堂实验，来实践“实用主义”。\n实用主义的杭州市·浙江大学（华家池校区）\n"}, {"year": 2023, "month": 3, "day": 25, "text": "冷风中的思想徜祥，仿佛那年波士顿的校园里。\n"}, {"year": 2023, "month": 3, "day": 26, "text": "1期班压轴课程《艺术哲学》。有幸玲听南京大学文科资深教授、长江学者周宪老师一天授课。周老师是国内美学和视觉艺术研究举足轻重的大家，深入浅出地探讨一个根本性的哲学问题：艺术，对人之为人的不可或缺。美，对生命教育的不可或缺。\n推荐他的经典著作《美学是什么》，还有他的导师北大叶朗先生的《中国美学史大纲》和《美学原理》。当然还有叶先生的老师朱光潜先生和宗白华先生《谈美》、《西方美学史》、《美学散步》。\n"}, {"year": 2023, "month": 3, "day": 28, "text": "比起自然，文明永远令人困惑。所以，老三又上山了。恭喜他回到那个可以自己说了算的地盘。在那里，他挥霍的每一滴汗水都将直接流进大地，\n滋润一草一木，开出生命的意义之花。那里的空气是如此清凉稀薄，却又无比透彻高远。\n·回高原，看看我的牛儿们一2023.3\n"}, {"year": 2023, "month": 3, "day": 28, "text": "雪中的鲁朗扎西岗村高山牧场，两年前的西藏游学或曾路过，只未见这般摄影制作：会唱歌的其加\n· · ·\n"}, {"year": 2023, "month": 4, "day": 1, "text": "“十九世纪蒸汽机车问世时，黑格尔坚信他已经掌握了世界历史的精神，\n但是福楼拜却在大谈人类的愚昧。我认为那是十九世纪思想界最伟大的创他认为科技昌明，社会进步并没有消灭愚昧，愚昧反而跟随社会进步一起福楼拜着意收集一些流行用语，一般人常用来炫耀自己的醒目和跟得上潮流。他把这些流行用语编成一本辞典。我们可以从这本辞典里领悟到：\n现代化的愚蠢并不是无知，而是对各种思潮生吞活剥。”福楼拜的独到之见对未来世界的影响，比弗洛伊德的学说还要深远。我们可以想象，这个世界可以没有弗洛伊德的心理分析学说。但是不能没有抗拒各种泛滥思潮的能力。”米兰·昆德拉：哲学的智慧是理性，小说的智慧是幽默\n"}, {"year": 2023, "month": 4, "day": 1, "text": "半小时前拍的，此刻天还没黑，北国的白天越来越长了。\n"}, {"year": 2023, "month": 4, "day": 6, "text": "兄弟来趟北京，必须吃顿炉火，必须从东六环打个车到北四环吃撑了\n"}, {"year": 2023, "month": 4, "day": 6, "text": "据说，当您的人生之路陷入仿徨之际，最不会出错的选择是走进一家书店。其次是坐在书店门口，点颗烟。\n"}, {"year": 2023, "month": 4, "day": 7, "text": "－（昨天迟到）老师有批评吗-没有（嘴硬）就被罚站了一堂课-站着听进去课了吗\".….（点点头）\n-那相当于对你没有造成什么影响-谁说没影响-哦？造成什么影响-造成了我今天早起的影响\n【好的教育，不解释】\n"}, {"year": 2023, "month": 4, "day": 8, "text": "蒙大拿的日与柯尼斯堡的夜\n"}, {"year": 2023, "month": 4, "day": 10, "text": "何老师的国家博物馆授课自述，当天人民大会堂正在办大事，无疑是一次难忘的饺子馆之旅摘：我很好奇现场的观众们为何会如此认真对待一场免费讲座，所以冒着或“冷场”或“过火”的风险留下了20分钟的观众提问与交流时间—不同于校内学术讲座时的“知己知彼”，我完全不知道40分钟内抢到这100张票的国博观众们来自何方、有何知识背景、会不会刁难问些不着边际的问题...\n何欢欢|记一次难忘的国博讲座\n"}, {"year": 2023, "month": 4, "day": 12, "text": "午间窗BA二楼vip包厢体验，很下饭。想起那句老话，生命还得运动，\n又想起前阵子火爆了的贵州村BA，突然有点明白为啥从没听说有体育老师担忧或者反对ChatGPT。\n"}, {"year": 2023, "month": 4, "day": 12, "text": "我问他：不当和尚了吗？....他问我要不要这些书...全是德国哲学的书籍，包括海德格尔的《存在与时间》在内，还有哈贝马斯《交往行为理论》\n以及日译首版的马克思《自然辩证法》。其中没有一本跟佛教有关系的书籍，就跟他从一开始就是一个拉面店的店主一样。\n再推荐日本游学导师毛丹青教授的公号和文章。\n寺院的钟声与拉面馆\n"}, {"year": 2023, "month": 4, "day": 17, "text": "起起老师用三年写了一首诗，印成了一本没有书号的书，创作时间很长，\n诗也很长，甚至比看到的更长。《结束》，是关于过去三年，制作最精良的中文手册。\n历史模糊地表明，每个时代最好的中文，断不会在当代大行其道。而所谓文明的两张面孔，正面是语言的腐败史，背面即思想的游击史。\n每一个心怀美好的中国人，都应收一册这样的中文，以存下过去的三年。\n天上下过的雨，历久弥新人间烧过的纸，第二天就不见了50.00\n"}, {"year": 2023, "month": 4, "day": 17, "text": "“万一那思想变暖了呢”上海开始穿半袖了。\n于过去三年，制作最精良的中文手册。\n历业接提地表的，每个时代是好的中文，\n正图是语的房变，有图的患¥50.00\n"}, {"year": 2023, "month": 4, "day": 18, "text": "首期班结业课《生命的未来：生命科学对话生命哲学》，欢迎二期同学和三期预备同学列席。\n孙老师为哲学班同学们邀请到西湖大学副校长许田教授，许老师是享誉世界的遗传学专家，曾任美国耶鲁大学终身教授、遗传学系副系主任，霍华德休斯医学研究院研究员。\n结业论坛生命管学高级研修班2023/04:22P14:00-16:008·\n"}, {"year": 2023, "month": 4, "day": 18, "text": "Gavin兄弟在此留了点村上春树喜欢的威士忌，过来扫荡。不经意被酒馆老板惊到了，居然知道王德峰老师刚去给我们上过课，还预告了接下来的刘擎老师和赵林老师\n"}, {"year": 2023, "month": 4, "day": 19, "text": "重逢三年未见的波士顿老友，又见到在这里有存酒的哲学班同学。“活着”哲学酒馆主理人兼唯一的酒保及清洁工—可文谈起他的喝酒哲学：\n吃是为了肉体，喝是为了灵魂，而灵魂最怕人，人一多，灵魂就不出来还好今夜我们包场了，人不多。可文有好酒，更有好故事。2017-2018年，在思想食堂如日中天的时候，何曾想到一个酒馆老板以哲学之名克服万难在大洋彼岸出版了一本简体中文书，叫《思想的狂欢：活着酒馆里的哲学会饮》，这本书记下了一个那个再也回不去的年份，和至今依然鲜活的时代命题。三年后，刘擎老师邀许知远老师和《十三邀》来到这里，以满墙的哲学家带火了酒馆里的火腿，很自然而然地实践了哲学酒馆成功学，却又很自然而然地不再令酒馆老板激动。可文说，做哲学酒馆是百战归来再读书，而读书，是为了再战。他的上一战是折腾一通世界，然后全身而退。下一战是加勒比海，不急着出发，却随时可能动身。祝福活着，\n祝福可文。\n如果说哲学在于行动，生命在于灵魂；那么一切生命哲学的探索都会导向一个回声：让灵魂行动。除此，别无他途。\n思考的狂欢\n"}, {"year": 2023, "month": 4, "day": 19, "text": "街头奇遇傅杰老师，忍不住厚着脸皮上前叻扰，大快师心。据说，在喧嚣的城市，最美的风景是低头看书的人。今日突然体会：更美的风景，是低头看书的老师\n2023年10:52\n"}, {"year": 2023, "month": 4, "day": 22, "text": "老三说：放生，是养牛人放弃了对耗牛的生杀控制权。这意味着这些小耗牛将永远被养育，直到自然赋予它天命尽头的那一天。这几位“参与放生”的小朋友将看着他们的小耗牛实践宇宙的生命规则，唯独不用担心他们的小耗牛朋友会被屠宰。放生，并非简单地将生命放归自然于不顾，而是以行动保护生命自由的古老传统，是人类对大地的敬畏，与应许。其实，放生在人类社会还有另一个说法，即：领养。\n2023年4月在横断山脉放生五头牛\n"}, {"year": 2023, "month": 4, "day": 22, "text": "哲学班1期结业2022.4.23~2023.4.22距离大家相识整整一年四十不等压十做分\n"}, {"year": 2023, "month": 4, "day": 22, "text": "生命的风采，哲学的行动。\n不要紧张，生活是好玩的。\n虽然只有7位首期同学参与“答辩”，也没留下多少时间给二期班代表补充发言。图5是德国游学钢琴家吉达布塔老师的助理能达兄，他临时从柏林回来，和老朋友重逢，发表观礼感言：看见情真意切的个体。\n"}, {"year": 2023, "month": 4, "day": 22, "text": "生命直播：科学数据表明，人类能活200岁了。问题是，你准备好了吗？\n显然，这是个哲学问题。\n生命科学生命的未生命的术米\n"}, {"year": 2023, "month": 4, "day": 22, "text": "再喝一杯。\nMACALLAN2020\n"}, {"year": 2023, "month": 4, "day": 24, "text": "昨天下午和同學們告别後，整理手機内存，想修一下结业前导视频，发现一年太长，视频太短，终于难以为继。想起很多很多因为时间安排没能来到现场的老师、同学，很遗憾，很想念。还有很多关心、帮助过宣传哲学班项目招生的朋友。补发一组少见的现场照片，感谢你们，让好事发生。\n11月26日00:28:41\n"}, {"year": 2023, "month": 4, "day": 26, "text": "周末有课，提前住校，刷脸失败被保安大爷拦住施展了哲学三问，一通操作省略300字。教室对面的咖啡馆是个好地方，天暖，可以在室外坐了。\n"}, {"year": 2023, "month": 4, "day": 27, "text": "杨子过了江，回馈母校。先给众师弟师妹送上首发学术报告福利《用礼成俗与义理养心：北宋道学建构的路向》。\n杨立华简介：北京大学哲学系教授，博士生导师，北京大学研究生院副院长。主要研究领域是中国哲学史、儒学、道家与道教，近年来主要着力于宋明哲学及魏晋哲学的研究。出版著作九部：《思诚与见独之间：中国哲学论集》（北京大学出版社，2022年）《庄子哲学研究》（北京大学出版社，2020年）《中国哲学十五讲》（北京大学出版社，2019年）《一本与生生：理一元论纲要》（北京三联书店，2018年3月）《宋明理学十五讲》\n（北京大学出版社，2015年）《中国儒学史》（宋元卷，北京大学出版社，\n2011年）《郭象（庄子注）研究》（北京大学出版社，2010年）《气本与神化：张载哲学述论》（北京大学出版社，2008年）和《匿名的拼接：内丹观念下道教长生技术的开展》（北京大学出版社，2002年)，译著五部：\n《王弼《老子注》研究》《近代中国之种族观念》《宋代思想史论》《章学诚的生平与思想》《帝国的话语政治》等，发表学术论文四十余篇。\n2011年被评为“北京大学十佳教师”。2017年入选首届“北京市青年教学名师”。\n用礼成络与义理养心\n"}, {"year": 2023, "month": 4, "day": 28, "text": "放假了，得吃一顿好饭。\n"}, {"year": 2023, "month": 4, "day": 29, "text": "排个队，节日氛围在线。今天的课，杨立华老师讲授庄子的生命哲学《真知之路》。\n#浙江大学「生命哲学」高研班2期\n"}, {"year": 2023, "month": 4, "day": 30, "text": "早起赶来继续上课的同学说，昨天是1位男神，今天2位才子。天色上好，继续论庄。\n· · ·\n"}, {"year": 2023, "month": 5, "day": 3, "text": "“等到我们开始吃东西，一看后面等候的客人，还有633桌。我开玩笑说这种对吃的执着，只有用宗教精神才能解释。”孙立平：烧烤，我觉得挺好，人们吃着高兴就好，不用赋予太\n"}, {"year": 2023, "month": 5, "day": 6, "text": "去京都之前，杭州同事先访天台。要鸣谢思想食堂老学员企业，汝窑品牌\n「雅瓷」委托定制的游学，说起来思想食堂和天台的缘分真是很奇妙。\n那年，思想食堂两次造访京都比山访奇僧名士，正是受天台恩泽。皆因张老师引荐永福寺的复建领袖月真法师和当家住持念顺法师都来自天台山，而比山开山祖最澄大师学自天台，延历诸寺皆奉天台为祖庭，其僧众待月考引路的思想食堂自然尤为亲切。\n随后三年大疫，一直没能再去京都，却有幸三上天台。后天开始的高野山之旅原以空海大师（与最澄大师不同，空海大师在长安青龙寺学习）为主线，没想前两天临时知道回国不用做核酸了，于是最后一天有时间在京都为朋友们增加一项特别安排：探访最澄大师创建的三千院。\n自19年春参访钱塘第一福地（永福寺）以来，思想食堂的寺院游学越来越受欢迎。仔细思考，原本供出家人修行的寺院，成为在家人学习东方美学和生活智慧的修心静地和灵感源泉，大概是因为出家在家上山下山，犹如生命的一呼一吸吧。\n钱塘-天台-京都-钱塘...往还循环，既是缘起，也是性空。\n以上行前所思，是为记。\n"}, {"year": 2023, "month": 5, "day": 8, "text": "在大阪混迹机场的两天，与曾在德国、香格里拉、台北、伊犁、杭州分开的朋友们重逢于东洋。雨过天晴，上山。今早很多都是4点5点出的门，\n这两个小时车程，主要用来补觉，发一组掠影。礼貌寡言的日本老司机悄悄和朋友说：这群人不去大阪，下了飞机就直奔高野山，很高级。到底怎么高级？我也很好奇\n"}, {"year": 2023, "month": 5, "day": 8, "text": "奔波一天，吃过饭都不想出去逛了。在大师身旁舍不得走，收拾好碗筷，\n接着坐下。谈山川异域，感风月同天。\n#思想食堂·日本京都游学\n"}, {"year": 2023, "month": 5, "day": 9, "text": "早课听经，坐着。像音乐会。\n"}, {"year": 2023, "month": 5, "day": 9, "text": "早上听了美妙的古日语《理趣经》，我的半个老乡（庆安人）大庆（留学僧）说一千多年前空海大师从长安背回此经，不但没有借给最澄大师，还归化了最澄大师派来学习的弟子，从此两师凉凉。。。此经在大小和尚的和声中十分悦耳，听不懂却莫名感动。消化一下。\n"}, {"year": 2023, "month": 5, "day": 9, "text": "午休一下。上午跟着和尚给空海大师送饭。在很多日本人看来，空海大师只是睡着了，每天6点和10点半，给大师送两顿饭，送了一千多年了。\n从我们住的地方无量光院，到空海大师住的地方奥之院有2.5公里，会走过一片巨大的杉树林，树林里全是墓地，看到不少我们熟悉的名字，可以说正是这些同在一个山头的家族决定了日本的今天，他们的子子孙孙因为这一片共同的家族福地，应该很自豪且有所承担。而这些大大小小的家族和团体“抬头不见低头见”，也很容易团结吧，突然对这个民族有了更深的这里的杉树让我想起两年前的5月，我们在西藏走过的岗云杉林，和川端康成在《古都》里写的：“这里的杉树笔直而美丽，我总是想，要是人的心也是那样就好了”。\n"}, {"year": 2023, "month": 5, "day": 9, "text": "【过年了】抄经后奇遇空海大师入定日。晚上参观空海大师住所，一年仅开放一天，举行特别法会。高野山117座寺院，唯独一座寺，即金刚峰寺，是空海大师从长安学成归来创建，有日本最大的枯山水蟠龙庭，是日本真言宗（密宗）总部，其他诸庙也由弟子们按大师规划所建。为了这场盛事，金刚峰寺门口街上突然出了大排档，高野山今晚不夜城，食堂同学们必须加个餐，可算是赶上过年了。\n#思想食堂日本京都游学·高野山\n"}, {"year": 2023, "month": 5, "day": 9, "text": "密宗奉大日如来佛，阳光遍照除一切邪恶，空海大师法号“遍照金刚”。大师诞辰1250年，入定1188年。有很多人是四国遍路1300公里来到这里，盛大而法喜的集体晚会让人兴奋，充满力量。阳光遍照，见者同福。\n南无大师遍照金刚。\n"}, {"year": 2023, "month": 5, "day": 10, "text": "吉达·布塔老师回信了。能达兄微信发来老师读信的照片，和一个视频，\n看到伟大的艺术家用笑容满面的英语邀请我们去她的故乡，令人感动。从高野山下来，刚泡了文明世界的有马温泉，收到这样的喜讯，忍不住和大家分享。\n自从魏玛一别，《海上钢琴师》音乐的经典重现就一直让德国游学的同学们魂牵梦蒙，期待再召集思想食堂的老朋友们，在秋日里漫步罗马的街头，跟随吉达老师的艺术足迹，在西西里的海风中，聆听她和天才电影配乐大师莫里康内先生合作的另一部经典《天堂电影院》。\n"}, {"year": 2023, "month": 5, "day": 11, "text": "难忘高野山，难以忘怀的美。。。24小时以来，就感觉心已经被掏空。\n正御影供\n"}, {"year": 2023, "month": 5, "day": 11, "text": "终于上正课了，由北大毕业来日本卖鱼、后突然被聘为教授的毛丹青老师给大家讲《日本文化与美学》。今天的课堂设在神户国际大学的教堂，教堂里有个巨大的管风琴。提供场地的村西牧师介绍学校和基督教的渊源。\n学校由北海道的相扑手受牧师点化创建，故事很多。。。期待。\n"}, {"year": 2023, "month": 5, "day": 11, "text": "举大杯，开大怀\n"}, {"year": 2023, "month": 5, "day": 12, "text": "继续亲身研究日本文化，先来菊正宗老酒厂混一口，等会儿再去个老字号茶室，下午去内田树老师的武馆，听他和毛老师PK讲故事。算得上是有菊又有刀。神户有山可逛，有海可钓，有汤可泡，还有好酒好茶和好故事，真是个迷人的小地方～内田裤：\n"}, {"year": 2023, "month": 5, "day": 12, "text": "从《日本人的国民性》聊家恨国仇，说起美帝在日本馨竹难书的暴行，和日本国民对美国文化的崇拜，把同学都笑哭了。。。很荣幸在日本著名的伦理学、哲学、翻译学、社会学者、合气道武者内田树教的武馆密集风暴半日。气氛热烈，情绪感染毫无障碍。\n特别感恩毛老师的实力对谈和他登峰造极的双边神翻译，同学们也过了把与大师国际学术交流的瘾。\n"}, {"year": 2023, "month": 5, "day": 13, "text": "刚吃完饭就看到有同学已经拖着行李，在大堂还很空旷的时候，选个靠边的沙发，坐下。不操心任何事，也不赶时间，只是安安静静等待，等待下一个注定美丽的地方。\n启程京都，去看川端康成。今天是属于文学的一天，始于海面温柔的早\n#思想食堂·日本文化与美学之旅\n"}, {"year": 2023, "month": 5, "day": 13, "text": "“春天正在可怜我悲戚的心情。”—毛老师现场如此翻译川端康成生前最后一封信。但凡熟悉作家生平故事的人都知道，这本是一个让悲伤逆流成河的一生，这本就是一个没有高科技互动和多媒体演绎手段的作家纪念馆参观项目，一不小心弄得这么欢乐，恐非毛老师恐不能得也。。。这次参观由现任馆长高桥女士讲解，在她特别允许下，拍摄了伟大作家的创作书\n"}, {"year": 2023, "month": 5, "day": 13, "text": "大佬们克制了温泉诱惑，带着开了光的“般若汤”，特来庆祝食堂升级一连续三晚试营业，思想酒馆正式开张了雪虎精心准备了第三课《日本美学》，继毛老师第一课《日本文化》和内田树老师第二课《日本国民性》之后，从川端康成、三岛由纪夫的文学作品和作家自身的生命哲学谈起，逐项细解日本文化和日本人精神内在的来龙去脉，也将诠释本次游学安排意义所在。\n为了上好这一课，白天特别先带队打卡闻名遐迩的金阁寺、琉璃光院。领略摄人心魄之美，感悟日本最后一代茶道宗师千利休所言：“唯有美丽之物，才能让我低头。”\n#日本文化与美学之旅\n#思想食堂|思想酒馆|思想澡堂荣誉出品\n"}, {"year": 2023, "month": 5, "day": 14, "text": "出门见喜，今天一定是个好日子。祝妈妈们节日快乐。\n"}, {"year": 2023, "month": 5, "day": 14, "text": "开心到模糊。在京都140多年历史建筑里吃上了怀石料理，思想告白。\n"}, {"year": 2023, "month": 5, "day": 15, "text": "告别朝夕相处的同学们，晚上来大阪和神户交界处的甲子园，和毛老师、师母共进晚餐。没想到今天是师母生日，更没想到今天还是他们夫妻结婚36周年纪念日，真是又一不期而遇的奇遇。\n两位老师相识于80年代的中国社科院哲学所，被问及甜蜜的秘诀。追忆似水年华，谈及36年前在婚礼现场的都是李泽厚、刘再复这样的思想学者。。。和再也回不去的黄金时代。那真是个群星闪耀的年代，那还是个仅凭“思想”就能迎娶佳人的年代。。。\n风采让同学们无不交口称赞。今夜两位老师都很开心，他们对食堂的学员印象深刻，也很敬佩诸位成功人士的好学精神。唱过生日歌，师母特别寄语思想食堂（不但要有澡堂和酒馆）成为思想大厦\n"}, {"year": 2023, "month": 5, "day": 19, "text": "【今天是个好日子】按商历，今天该是准备礼物的日子，因为明天520啦。按农历，今天四月初一，是进庙上香的大日子。按藏历，今天是三月三十，是萨嘎达瓦月开始的日子，相传这个月汇集了释迦牟尼诞生、成佛、涅的日子，是榜样彰显智慧、力量和福德的纪念日。去年受曹蕴老师感召，与8位同学一同相聚于圣城，追随莲花生大师的足迹，参访了桑耶寺、昌珠寺和大昭寺。。。现在翻照片，似乎过了很多年，在那个无常的年景，真是一段极为难得的特别经历。\n"}, {"year": 2023, "month": 5, "day": 19, "text": "才下高野山，又见空海师。起师问，日本收获如何？答：两岸对比，中文传统错位。大疫三年，中文失信，失格，失魂。今日聆听起师诗歌朗诵，\n赏书法印刻，品佳酿美食，可算《中文先生》暑期游学预备课堂。起师家学源远流长，传承熊十力先生，正宗童子功，书法、哲学、写作、饮酒、品茶、美食，样样精通，再观其公子读书成绩，其教育观点和实践成效卓然。让起师出山不易，太期待暑期亲子游学之旅～\n"}, {"year": 2023, "month": 5, "day": 21, "text": "中午大约应该可以吃鱼。\n"}, {"year": 2023, "month": 5, "day": 24, "text": "【谁说拔智齿不疼，我。。。】拖着行李箱进了诊室，一躺下就呼吸不畅，大夫让我半坐着，自己从凳子上站起来，一通操作，20分钟就把两颗牙拔了，遇到好医师了。吐了棉球，嘴像被泥石流封了印。。。在小院门口的素餐馆，努了几句话，居然混到多少年没听说的米汤一碗。遇到好店家了。算算时间，还没到能吃东西的时候，把晚餐放房间，下楼走一走，杭州比北京还是凉爽不少，一个人坐在北高峰下，听着雨后的山泉声，回味着素餐馆里的字句，想到好多人，好多事。还得多做好事，多遇好人，多生好心。\n"}, {"year": 2023, "month": 5, "day": 25, "text": "事能知足心常惬人到无求品自高山中禅语\n"}, {"year": 2023, "month": 5, "day": 26, "text": "今天四月初八，纪念佛教创始人释迦牟尼诞辰的日子。凌晨四点的杭城，\n山路明亮。很多人早到了一个多小时，来听音乐会，正心诚意。相传佛陀曾总结生命的智慧一世事无常，切勿依赖他人，唯有点亮自己的灯火，做自己的引路人。不管你是否拥有财富，也不管是否获得地位，只要内心平静，你将获得幸福。\n"}, {"year": 2023, "month": 5, "day": 27, "text": "生命哲学二期班的第4个月课，终于回到西哲的起点：古希腊。楼巍老师专攻西哲领域公认最难的维特根斯坦研究，请他讲古希腊，格外值得期待。同学们到的很早，早早准备了书来找老师签名，甚至有同学认真地开始学习古希腊语和拉丁文。。。一期班也有很多同学从世界各地专程来补课。仿佛很久未见，课前的交流很热烈，初夏的校园里，洋溢着久别重逢的喜悦。\n版驾板！\n生命哲学浙江大学生命售学高现代性的生命管学古希腊的生命杭州市·浙江大学（华家池校区）\n"}, {"year": 2023, "month": 5, "day": 27, "text": "最美的风景永远是生命的笑容。\n"}, {"year": 2023, "month": 5, "day": 28, "text": "今天的课，赵林老师讲基督教的历史源流和智慧体系。不知道赵老师？别着急找他的书和视频，太多。必须先看看疫情解封前他写的《新冠体验报告》，再看看他发声的时间。可爱可敬的硬核教授，值得早早在桌上排队的4杯咖啡主我在医院最大的问避就是要防止患上抑部有信号，而且不准出门（好像病毒被此间有约每个病房里住两个阳性患者，有一台电视都同房间的阳性不会相互感染，只跨房间感立老师好好保重，但是这一次案势活游，急第八、能逐免最好不过，不能退免就算是被上作非果题中西自然免反了。\n内泉身感受是，这个病毒一点都不可怕，但是令人性。\n"}, {"year": 2023, "month": 5, "day": 30, "text": "邂逅中捷宝藏伉俪，布拉格计划ing\n· · ·\n"}, {"year": 2023, "month": 6, "day": 1, "text": "席勒：“大哥，套圈不？”歌德：“！半个月亮归我了”\n—论《哥得》\n家住魏玛的画家杜老师自拍自导，分享有趣的人儿。今天儿童节，昨天和朋友相约9月游学德国柏林艺术节，有哲学、艺术、文学安排。或许能有幸见到写《芳华》《金陵十三钗》《陆犯焉识》《妈阁是座城》的严歌苓老师，希望能早日完成筹备，方便大家报名。严老师有一本写儿时观察动物的书《穗子的动物园》，她曾接受采访时说：因为外公外婆喜欢小猫小狗，自己的童年就是住在一个小小的动物园。\n"}, {"year": 2023, "month": 6, "day": 1, "text": "答应好的礼物，周末要陪他去取。\n"}, {"year": 2023, "month": 6, "day": 2, "text": "下周末有机会当面请教吴思老师：这一件件大事小情，您怎么看？血与汗，还能换算吗？现今的汇率如何？\n要格外珍惜三年来朋友圈、微博上坚持抱怨、吐槽甚至骂街的盆友，因为他们是属于少数心还没死的人。俗话说哀莫大于“心死”，其实他们体会更深的是：哀莫大于“心不死”。心不死，天也没亮，而很多人就再也见不着了。前几天无意中在起起老师的书房看到一本已经绝迹的书，叫《理想不死》，书里有他十几年前采访吴思老师的问题，这些问题今天还在，不知道老师又作何解？\n欢迎有兴趣的朋友一起，亲同学务必不能错过吴思老师！\n著名历业学者理想不死\n"}, {"year": 2023, "month": 6, "day": 4, "text": "午饭后就开始收收捡捡，洗洗擦擦，不知不觉地上全是长长的树影了。歇会儿，只剩下天幕和桌椅了。我不着急，只要再开仁小时就可以回到温馨的家里嘞，哦耶\n"}, {"year": 2023, "month": 6, "day": 6, "text": "暑假快到了，“老家”南方来人了，就地操练。今年主打一个互相督促\n(shanghai)共同进步(nejuan)。\n#暑期亲子游学·序曲\n"}, {"year": 2023, "month": 6, "day": 7, "text": "第二十个年头，认真回忆了自己的高考。搞笑的是不但记不起任意一道题目甚至作文，最终居然连自己的考场在哪个学校也很模糊。唯独能确信的是下午考试前打了篮球。因为那天有点不一样，母校的两个篮球筐平时总有一堆人在下面，打球要轮拨，那天很罕见一个人也没有。我看着空旷的球场犹疑了一下，就那种是不是“做大事前一切小事都该放放，以防万一”的莫名自我规训，比如打球崴了脚？出汗着了凉。。。最后还是去拍了会球，浑身大汗，回宿舍水房，开水倒脸盆里兑上冷水，冲个澡，换上干衣服。南方夏天的午后，自然很热，但我走出宿舍区大铁门时，身上很痛快，和往常一样的痛快，就像在自己熟悉的校园里参加过无数次的模拟考一样。\n这点儿回忆提醒我想起去年“阳”了的时候读到的一句话：一个健康的乞弓的确比一个染病的君王幸福。\n无论事先被如何定义和灌输，事后又被如何解读和重构，高考终归就是我们长长的生命大河里无数个湾子中的某一个。这两天时间有如静静流淌的河水，临时飞溅的浪花又或转弯，其实改变不了大河的任何方向，因为大河滚滚向前，自有方向。\n"}, {"year": 2023, "month": 6, "day": 12, "text": "三年没见，特别请吴思老师在杭州和朋友们聊聊天。安排两天的促膝长谈，谈谈大家都关心但还没看清楚、没想明白的事。\n吴思老师难得出京，第二天下午著名教授高全喜老师还会专程来老友对谈。由于大家都知道的404原因，吴老师课程不能发公号，这次相聚不易，期待老朋友和信得过的新朋友参加。\n苏格兰道征现代文明的\n"}, {"year": 2023, "month": 6, "day": 13, "text": "余世存：您还写过《萨特传》？\n雷颐：当然了。。。萨特再复杂，实际他几句话年轻人就理解了。比如他说“存在先于本质”，人也是存在先于本质。那什么叫“存在先于本质”？\n看起来很玄，实际很容易理解。比如这本书，它是一本书，但是你用它打苍蝇，它就成了苍蝇拍，你要用它打仗，它就是武器，没有规定它必须是书。一个砖头，你可以用它砌墙，也可以用它打架，没有规定只能砌墙，\n完全在你自己的选择。这个理论对于经过十年非常年代的年轻人，具有震撼性，他从哲学上论证了一些东西，颠覆了一些东西。\n余世存&雷颐：历史学者的阅读与人生\n"}, {"year": 2023, "month": 6, "day": 14, "text": "儿子最近进了学校跳绳队，正在努力享受自我超越的成就感，就是有一点不好，跳完绳说脖子偶尔会有点疼。来查一查，可把大夫难倒了，一通望闻问捏，最后以一支嗓子喷雾剂结束了治疗。从人山人海的医院出来，距离下午上课还有点时间，要求去公园逛逛。\n#也是街拍\n"}, {"year": 2023, "month": 6, "day": 14, "text": "起师说，会写字的人不挑纸。1-2是硬纸板书壳子。4-5是瓷器包装盒。\n6-8-9是包装纸，7是包装泡沫。感觉是赏了半响当代艺术，字都认识，\n唯一露怯的地方就是不知道“花药栏”是什么。\n"}, {"year": 2023, "month": 6, "day": 14, "text": "水还没煮开，饿。\n"}, {"year": 2023, "month": 6, "day": 15, "text": "每个周六，黄永玉搭公共汽车进城先找汪曾祺，两人一起到中兴轮船公司找黄裳，黄永玉说，黄裳当时很有高级职员的派头，看见他们就关了抽屉昂然而出，“曾祺几次背后和我讲，上海滩要混到这份功力，绝不是你我三年两年练得出来。我看也是。\n你想我时，就看看云\n"}, {"year": 2023, "month": 6, "day": 16, "text": "仿佛是前天在日坛看到的荷叶（图2）在灵隐（图1）开了花。又一年，\n毕竟西湖六月中。\n"}, {"year": 2023, "month": 6, "day": 17, "text": "敖同学来了。\n"}, {"year": 2023, "month": 6, "day": 18, "text": "7月，带孩子一起去丽江、香格里拉骑马，野餐，采蘑菇，造纸。。。体验纳西+藏族一周生活。有马帮故事，牧场生活，耗牛火锅，篝火烧烤，\n还有能歌善舞的当地师友和独享的民族文化安排。6次经验打磨，最舒适的吃住行方案，全程90%没有高反。\n暑期游学：寻梦香巴拉，去见两个人\n"}, {"year": 2023, "month": 6, "day": 18, "text": "【思想的分量】路上全是龟速移动的车和人，刚才还是“心爱的小摩托”驮着老师，居然趴地上一动不动了，大家都在等，雪虎在旁边也有点着急了，高老师在耳后安慰说，我可能有点重，多少年没坐过这小摩托了。。。我一边使劲握着冒着热气的羽绒龙头感受着背上“思想的分量”，一边大致在心里盘算着，至少也有七八九十年没骑过这玩意儿啦。\n这可不能告诉老师啊，好在小车终于给力了，阿弥陀佛。\n高老师答应带思想食堂安排苏格兰游学。何曾想过，影响整个现代世界的启蒙文化之旅就这么，就从这辆小电动开始了。\n"}, {"year": 2023, "month": 6, "day": 19, "text": "天公作美，上山。喝茶听心，感凡尘法喜，悟一念三千。四年前，能诚法师曾带吴思老师游观永福。\n"}, {"year": 2023, "month": 6, "day": 20, "text": "两个周末都有课，趁周中有空，回老家看望两边爷爷奶奶。一个人代表我两个弟弟和爱人及两个妹妹、妹夫，装满一车思念和礼物，再次开上这条读书、娶亲、回家的路。心情很振奋，来看看老钓位，停车休息一下。这条路就在皖河河堤上，并不十分宽且承重有限常年要维修，却无比美丽并让人依恋，它承载着无数个离开家乡的孩子和家庭的成长史。\n"}, {"year": 2023, "month": 6, "day": 20, "text": "【告诉你一个秘密】生命的光，只亮在好事发生的时候。所以，若摊上好事，请千金不换。\n"}, {"year": 2023, "month": 6, "day": 22, "text": "【过节，要听妈妈的话】坐高铁去南京二弟家看望老娘，有日子没见了，\n不知道今天会不会“驮骂”。毕竟，谁不是被妈妈“骂”大的呢（至少对我们三兄弟而言）刚收到北京快照，儿子正跟着妈妈去草原徒步露营。\n他驮着的是我55L的旅行包，去雨崩徒步的时候买的，但我自己都是能不背就尽量不背。看他逞能的样子，估摸着我爱人能“骂”儿子的年头不多在我的老家，好男儿的标准大抵是“出门能驮包，回家能驮骂”。慢慢的，\n他一定能驮得起行囊，却未必能驮得起骂。要他明白我嘱咐他的那句话，\n也许得20年后吧一过节，要听妈妈的话。\n"}, {"year": 2023, "month": 6, "day": 24, "text": "时隔一年，再听西湖大学盛晓明教授讲康德，实在太太太。。。难啦。王院长说“盛老师是南中国讲康德最好的老师”，孙老师说“盛老师是我的老师”盛老师说“我曾在德国读康德读到快要昏厥”。看看同学们埋头苦思的样子，真是艰难的一上午。\n午休时看到同学发来食堂现场的欢乐照，想起日本游学时，有同学红光满面地高声祝酒一食堂办的好，思想永不倒\n"}, {"year": 2023, "month": 6, "day": 25, "text": "刘擎老师开讲。为凌晨3点出门，从深圳打飞的来上课的同学点赞。\n启能运动的价值生命哲学\n"}, {"year": 2023, "month": 6, "day": 25, "text": "今天刘擎老师滔滔不绝讲了6个小时课，其中有3个小时的内容是由同学现场自由定制（提问无禁区，敢问敢答，敢这么做的老师不多）印象最深的是，听到他像老朋友一样喊出每个向他提问的同学的名字，这些名字的然发出，真是令人动容。\n#生命哲学研究共同体\n"}, {"year": 2023, "month": 6, "day": 28, "text": "【不想半途而废，降价招募】意料之外，香格里拉游学报名人数很少。我爱人说，香格里拉旅游市场很卷，你们虽然是定制游学，价格不亲民，能降吗？这可算是灵魂拷问了看到一条明路，打开策划文档，仔细算算成本，这些专享的定制活动一样也不能删，扎巴老师、尊追活佛、雪虎三课、全天骑马....似乎也没有什么下降的空间了。那么，问题出在哪里呢？问题肯定在自己身上嘛，对，\n一定是我们自己太贵了虽然这几年游学不能成行是常态，但去香格里拉见老朋友，不想半途而废，难以面对山中父老，再发一下，有时间同行就一起出发吧，只要能凑10个人，朋友圈看到的同学统一优惠1000元/人。北京降雨，清凉降温\n"}, {"year": 2023, "month": 6, "day": 30, "text": "看到扎巴老师近日的徒步照片，想起去年他带我们观礼松赞林寺尊追堪布升座仪式，其殊胜其壮美其感动，真是令人无尽回味。于是，对香格里拉的思念已达到顶峰。第7次香格里拉寻梦之旅，还差3人即成行\n· · ·\n"}, {"year": 2023, "month": 7, "day": 5, "text": "有位改变世界的名人曾说，他从禅中学到的真理就是：如果我们愿意跋山涉水去见一位菩萨的话，往往我们身边就会出现一位。\n"}, {"year": 2023, "month": 7, "day": 10, "text": "早晨，在跑马山下的情歌小城，看到几个面容姣好、身材健壮的李家大姐。中午在雅江休整，据说那里有个做鱼特别好吃的雅女饭店。如果儿子没有高反，晚上将抵达理塘牧场，那里有他三叔送他的一头小耗牛。\n#理塘探亲之旅\n"}, {"year": 2023, "month": 7, "day": 10, "text": "到雅江，不能错过雅女饭店的雅江雅鱼，雪山冷水无鳞鱼，据说是一种素食鱼，与藏地的水葬习俗无冲突，所以少数藏族同胞也会偶尔与远方的的朋友一起随缘享用。\n此去理塘，将沿着雅江溯源而上，直到其主要支流—理塘河畔的松茸之乡拉波镇。老三专程开着他的特斯拉小三千里下成都，接上他同样飞几千里而来的大侄子和北京的老友。因为还有一个座位，在川大上学的堂妹也趁暑假来凑个穷游之旅，因为她的加入，路上的关注度和回头率都很高。拍几张照片发群里，稳坐家中云游高原的长辈们也很兴奋，再次研讨起基因科学与人文地理甘孜藏族自治州·雅女饭店（雅江店）\n"}, {"year": 2023, "month": 7, "day": 11, "text": "连夜翻过4100米的天空之城，下榻3500的古村委会（现在是三弟牧场的办公室兼招待所）。在白塔旁醒来，全体满血复活。吃饱喝足，下雨了。围坐院下，喝着南京二弟寄来的好茶，吃着安庆小婶送的糕点，墙上突然有村里小朋友扒在墙上和老三打招呼。亲眼看到单身汉黄老三能把离家5000里外的日子过成这样，心里还是很骄傲。\n"}, {"year": 2023, "month": 7, "day": 11, "text": "儿子说：这都是三叔的地，三叔的房，三叔的大棚，三叔的草场，三叔的牛牛牛，我三叔可太牛啦YITTT\n"}, {"year": 2023, "month": 7, "day": 12, "text": "7点钟（相当于北京时间6点），来到一座规模不大，但对三弟意义非凡的寺院，因为这里有一位青年活佛是他的老朋友，也是他游历天南海北终于驻扎理塘的引路人，更是他在此地构建、实践生命价值的守护神。\n活佛早上有法会，我简要代表大家庭向他致意，感谢他过去两年对三弟的护持。他也很高兴，邀请我们后天下午再去寺里参访，届时他会带着我们冥想。这本是活佛个人的私人功课，轻易并不示人。十分期待\n"}, {"year": 2023, "month": 7, "day": 14, "text": "除了睡觉，每天总有十几个小时不想看电脑和手机。。。老三的“麦尼海塘”主营耗牛和羊肚菌，为当地村民提供自家的新鲜耗牛肉，也为他城里的朋友们提供一种远方的眺望和遐想，间或会有人委托他购买村里的土特产品（虫草，松茸），他主要提供“保真”服务。这些搬运工的事他也没当回事，他真正惦记的还是他的人工培养羊肚菌和科学养耗牛技术的升级大他用博士论文写作方法研究的的羊肚菌技术，已经用大半年时间实验成功，据说他和村里的合伙人们为此大吃了一顿，现已正式在大棚里扩大播种，算算日子，秋天的时候该有收成。秋天，同时是藏民们的农闲时节，\n也是他们享受当年虫草、松茸丰收后的欢庆时节，家家户户轮流坐庄、门庭若市、欢歌笑语，相当于开始过年了，那时候也正是耗牛肉需求的旺季。最近几天他主要和农牧局派来的老牧民一起忙着给200多头耗牛打疫苗、为下一块草场选址，为他的诸多不同用途的地块种上用以标记界限的这些事都用不着我，他大哥在这里除了享受牧民们亲人般的吃喝招待，只用当一个快乐的皮卡司机，哪怕只是去牧场喝一口刚挤出来的耗牛奶，或去小卖铺买两箱可乐，又或者去倒一下昨夜笙歌的垃圾。至于“暑假带娃”的重任，不存在的，入乡随俗就好\n"}, {"year": 2023, "month": 7, "day": 15, "text": "雨天，整理内务。\n·修心之旅游中扎村麦尼润省甘收州理塘县拉波麦尼\n"}, {"year": 2023, "month": 7, "day": 15, "text": "【小村庄里来了大学生】在没有拿到一分钱政府补贴的情况下，一个985、211的研究生为什么要放弃北京杭州的年薪，跑这么远来养牛？\n观老三做的事，照例要招呼一下吃吃喝喝。对于学生们来讲，这种饭局照例很热闹却也难免乏味。\n上面的问题是其中一位教授提出来的，老三没有回答，却引发了一众同学们的好奇，他们不愿意旁听领导们吹牛，纷纷跑出来要加青年企业主的微信，不会抽烟也不知道怎么当“乡镇企业家”的黄老三终于借机在餐厅外和他们打成一片。\n"}, {"year": 2023, "month": 7, "day": 16, "text": "晴天，劳动光荣。\n"}, {"year": 2023, "month": 7, "day": 17, "text": "早上7点出门，晚上7点到家。陪儿子顶着牙痛（正在换牙）转遍县城，\n终于用外婆给的红包，转得满意而归。此刻，正把幸福握在手上。\n"}, {"year": 2023, "month": 7, "day": 19, "text": "【下班发福利】院子里的一天，为麦尼海塘筹备理塘“八一赛马节”展会准备物料，试新装。\n前两天去县城，山路上看到几处密密麻麻的帐篷营地，这样的一个营地里大约同时快乐着成百上千人，在藏族，这种近几年风靡北上广的自然生活方式叫“过林卡”，本地人更愿意叫“要坝子”。坝子就是草原，“要坝子”就是全家一起去草原上要，大概就是城市人最向往的远方生活吧。\n作为马背上的民族，赛马节是真正的高原盛会，已有400多年历史。据说今年康巴美男的代表“丁真”将率马队巡游理塘。相请不如偶遇，为此，\n我打算继续村里办公一周。\n"}, {"year": 2023, "month": 7, "day": 20, "text": "看他们要坝子，赛马节倒计时3天。\n"}, {"year": 2023, "month": 7, "day": 21, "text": "山上下来的第一捧松茸，因为量太少，没有批发商愿意来，距此地最快两个小时车程的松茸顺丰点也还没开业。牧民舍不得吃，便宜卖给“不差钱”的憨老三。行，我们吃了\n"}, {"year": 2023, "month": 7, "day": 22, "text": "8点就动身，半小时前终于把kt板送到高城西门外的坝子上，结结实实补充碳水。在天空之城做事，成本加倍，效率减半，饭量也翻番\n"}, {"year": 2023, "month": 7, "day": 22, "text": "我在远方。\n"}, {"year": 2023, "month": 7, "day": 23, "text": "爆堵的城里没遇到丁真，辽阔的马场上个个赛丁真\n"}, {"year": 2023, "month": 7, "day": 24, "text": "“当文明进入下降通道，我们怎么活？是个问题。”孙老师发起生命哲学班时如是说。\n我看到的是，自然人类文明时区的人们，正在大胆地大步迈向技术时代，\n正不加思考地热烈拥抱那些扑面而来的问题。\n这几天，坝子上手机比马和帐篷多太多，手机上的信号形同虚设，回复可能不及时，听课可扫码联系班务。\n大学生的有学马克思的生命哲学尼采的生命哲学\n"}, {"year": 2023, "month": 7, "day": 25, "text": "【鼓舞人心的缘分】三弟的朋友告诉我香格里拉的“扎巴老爷”正握着手机，照着朋友圈里的照片，在坝子上千顶的帐篷里到处找“麦尼海塘”，并说一定要找到不可。。。万没想到会在理塘会见到扎巴格丹老师。他是香格里拉的传奇，是我今夏未能做成香巴拉游学愧为面对的人，今天他是理塘的贵宾，这样的的缘份真是鼓舞人心。惟愿做更多好事，见更多好人，\n敬永远的香巴拉。\n"}, {"year": 2023, "month": 7, "day": 25, "text": "鲜衣怒马，无与伦比。\n"}, {"year": 2023, "month": 7, "day": 28, "text": "【奇妙的生命·高反可以燃脂】上称一算，不出意外又瘦了，居然有8斤那些炊烟下大快朵颐的耗牛肉、耗牛舌、耗牛蹄、耗牛尾巴还有耗牛臊子面，乃至松茸、虫草、高原人生果、耗牛奶。。。统统不算数。\n鉴于下周还要继续上林芝、拉萨过“苦日子”，回来这几天已经默默提前贴了两顿秋膘。\n771.05\n· · ·\n"}, {"year": 2023, "month": 8, "day": 1, "text": "【中文先生暑期亲子游学】行前动员会，以诗酒敬田园。所谓思想未动，\n食堂先行感恩起起老师，思想食堂在北京也算有了一个小小的栖息\n"}, {"year": 2023, "month": 8, "day": 5, "text": "装箱，启程【中文先生】暑期游学，林芝～拉萨全程8天7晚。明天在西昌转机，有一夜逗留，期待解锁西昌卫星发射基地，不知道有没有机会提前感受一下大凉州的东方狂欢节——火把节。\n思总长士\n"}, {"year": 2023, "month": 8, "day": 5, "text": "今天九月十九，相传是观世音菩萨成道日。首都机场日出前朝霞惊艳，令人心生赞叹。想到此行将由川入藏，自林芝沿着雅鲁藏布江溯源而上，抵达布达拉宫。布达拉一词，来自梵语音译，即普陀。所以，布达拉宫也是观音菩萨的人间居所。菩萨得道，不离人间，是故凡尘亦有法喜，当颂\n《心经》。\n观自在菩萨行深般若波罗蜜多时，照见五蕴皆空，度一切苦厄。舍利子，\n色不异空空不异色色即是空空即是色，受想行识亦复如是。\n舍利子是诸法空相，不生不灭不垢不净不增不减。是故空中无色，无受想行识，无眼耳鼻舌身意，无色声香味触法，无眼界乃至无意识界，无无明，亦无无明尽；乃至无老死，亦无老死尽，无苦集灭道，无智亦无得。\n以无所得故，菩提萨埋，依般若波罗蜜多故，心无挂碍，无挂碍故，无有恐怖，远离颠倒梦想究竟涅盘。三世诸佛，依般若波罗蜜多故，得阿诺多罗三藐三菩提。\n故知般若波罗蜜多是大神咒是大明咒是无上咒是无等等咒，能除一切苦真实不虚。\n故说般若波罗蜜多咒，即说咒日-揭谛揭谛，波罗揭谛波罗僧揭谛，菩提萨婆诃\n"}, {"year": 2023, "month": 8, "day": 6, "text": "在西昌有大半天空档，家住攀枝花的表姐夫开车200多公里，来实施特供表弟的一条龙照顾。一起逛了可以体验“登月”的卫星发射基地，在菩萨得道日拜了400多岁的“娘娘庙”，还吃到无比鲜美的邛海鱼和嫩牛肉。能量爆护。多年后突然看到一转眼就长大了的侄子侄女，他们安安静静不张望、不仿徨的样子，让人忍不住相信未来。抵达林芝。\n"}, {"year": 2023, "month": 8, "day": 6, "text": "谈起咱们摩拳擦掌的“挖松茸”，他们只是轻描淡写地叫作“捡菌子”。天上掉，地上捡？这活儿到底有多难？反正去年我们十来号闯入者，在2位当地向导的专门带领下，弓着背在山里被刺了一下午，基本没有机会让向导示范“挖”的动作。\n理塘县首个研究生农牧养殖自主创业机构\n"}, {"year": 2023, "month": 8, "day": 6, "text": "等车，去县里取物料。开始搬砖。\n"}, {"year": 2023, "month": 8, "day": 7, "text": "天好，不用做核酸。\n"}, {"year": 2023, "month": 8, "day": 7, "text": "丰盛的一天，晚宴后，享片刻无言。愿与君读一首仓央嘉措一需要隐藏多少秘密才能巧妙地度过一生这佛光闪闪的高原三步两步便是天堂却仍有那么多人因心事过重而走不动\n"}, {"year": 2023, "month": 8, "day": 8, "text": "喝一口姜茶，就会想一次香格里拉。\n"}, {"year": 2023, "month": 8, "day": 8, "text": "【生命的镜子】此刻，她一定想不到我有多羡慕这个工位，正如我也猜不出她有多少烦恼。\n"}, {"year": 2023, "month": 8, "day": 8, "text": "徒步南迦巴瓦。\n感谢松赞团队，帮我们邀请到南迦巴瓦穿越第一人—西绕老师。他是南迦巴瓦的传奇人物，曾担任中日联合登山队（人类唯一一次登顶南迦巴瓦峰）的向导。这里是他的家乡，他数十年如一日在山下挂起无数经幡，曾在山中背出一位摔断大腿的青年登山者，整整背了64天。\n"}, {"year": 2023, "month": 8, "day": 8, "text": "记当代中国人文家庭，与中文先生同行。第一课，思想食堂在雪山下的彩\n《习字·书法》\n"}, {"year": 2023, "month": 8, "day": 8, "text": "还在写只有一个孩子上过课外书法班，但全体大小同学沦陷在白纸黑字里，不知疲倦。\n不知道什么时候，可爱的同学们能放4点在北京起床的起师，回他的南迦巴瓦豪华房。\n"}, {"year": 2023, "month": 8, "day": 9, "text": "离开南迦巴瓦，起起老师留下两首诗。\n#与中文先生同行南迎色瓦当我遇上你容颜百云轻拂百雪\n"}, {"year": 2023, "month": 8, "day": 9, "text": "雅鲁藏布江沿途风光无限，遇沙丘，玩一把。下午进山骑马，夜宿帐篷。\n#与中文先生同行\n"}, {"year": 2023, "month": 8, "day": 9, "text": "晚安。又是充满劳绩的一天。\n"}, {"year": 2023, "month": 8, "day": 11, "text": "行走的中文先生。\nwandexingkong晚的星空望者从不失望baibahudngye百巴荒野\n"}, {"year": 2023, "month": 8, "day": 11, "text": "幸运的少年，在天堂的湖畔。\n林芝市·巴松措风景区-遗忘码头\n"}, {"year": 2023, "month": 8, "day": 11, "text": "【神性弥漫的行走】坐船登岛，钻进1500年的原始森林，看满天松萝，\n满地青苔，行至林深处，青白色的雪水流过身旁，泉声雷动，心情澎湃。\n大家拜过莲花生大师行迹，同行的小姑娘居然在青冈树下发现了一颗松茸，引来一众赞叹。美妙巴松是三座山的意思，巴松措就是三山环抱的湖。这三座山顶终年积雪，\n是当地人敬奉的神山：分别被誉为燃烧的火焰、国王的宝座，紫色的佛珠。此行得益于松赞巴松措酒店试营业，可以在巴松措盘桓2日，幸运的有文章记，巴松措也叫三岩湖。三岩，第一岩即拉札，藏语意为永恒不变的神岩：此地是观世音菩萨在人间的道场。早在一千多年前，莲花生大师在征服藏北群魔时，有一个魔力无边的恶鬼热嘎逃往工布方向，当他追寻到今日拉巴雪山跟前时，便被一座冰川挡住去路。于是莲花生使符念咒，\n把三节藤杖抛向天空。不一会儿天崩地裂，冰雪融化，发现观世音菩萨在拉巴神宫岩修行，就这样打开了第一岩之门。\n第二岩即多吉札。传说当年莲花生大师从拉札骑着一只全身雪白不戴缰绳的老虎，从空中缓缓降落到多吉札山根草坪上，发现金刚手在此修行。于是莲花生大师就在此修行了六年，自此该地便叫作漫当立龙多吉札。\n巴松措第三岩即赞给札。传说莲花生到此发现文殊菩萨在修行，受文殊指点后，莲花生大师将之改名为巴松措。\n#与中文先生同行·暑期亲子游学\n"}, {"year": 2023, "month": 8, "day": 11, "text": "【继续上课】“学中文先学字。读书就是做人。写作是克服爬虫脑和哺乳脑的自我实现。生命的秘密就是不怕死，提前思考死亡。。。”在赵师的中文世界，通识教育不仅仅要教知识，还要教礼仪、教“洒扫庭除”，教认识自然、认识自己，以及如何做一个善良的人，做一个完善的人。做一个，人。\n#与中文先生同行\n"}, {"year": 2023, "month": 8, "day": 12, "text": "离开美丽的巴松措，出发前看到巴松三座雪山之一“燃烧的火焰”。此时海拔4400，再两个小时抵达圣城。\n"}, {"year": 2023, "month": 8, "day": 12, "text": "【骑马】这次游学的户外项目十分惊艳，从林芝到拉萨，松赞提供的营地体验项目每个都是精品，比顺义的马术俱乐部有过之无不及，堪称自然人类文明生活方式现代体验的绝佳范本。朋友们若有时间带孩子来玩，不能\n"}, {"year": 2023, "month": 8, "day": 12, "text": "【丛林冒险】这个项目比骑马令少年们上头，主要是海拔高，3300体力大消耗，最后一关是滑索，下来后都要求再虐自己一把。一通操作，多干两碗饭。\n"}, {"year": 2023, "month": 8, "day": 12, "text": "林芝藏民有个特别的称呼，工布人。穿的和其他藏人不同，尤其擅长射箭。他们有一项传承1500多年传统的比武项目“工布响箭”，藏语称“毕秀”，非物质文化遗产。箭头有个哨子，飞箭哨声亮，划破山谷。\n林芝地区很特别，不属于传统三大藏区划分：法域·卫藏有拉萨日喀则\n（寺院最盛）；人域·康巴有香格里拉甘孜昌都（康巴汉子）；马域·安多有青海甘南（藏马故乡）。\n"}, {"year": 2023, "month": 8, "day": 13, "text": "吃过早饭就出门啦，呼嘿儿哟\n"}, {"year": 2023, "month": 8, "day": 13, "text": "【尾声】此行从观音菩萨成道日自北京出发，经西昌拜灵鹰寺，过林芝米林、工布江达，一路饱览神山南迦巴瓦、圣湖巴松措、雅鲁藏布江壮丽风光。听中文先生字课漫谈，看少年书法减压，默《心经》。终于，再登观音菩萨道场布达拉宫，下山又见大昭寺。\n再见觉沃佛，祈福，亲人的面孔浮现眼前。想起去年萨噶达瓦节，跟随曹蕴老师、小小老师和一行人的福德之旅，大家一起念诵的释迦牟尼佛心咒一直记在心里，充满法喜。感恩拉萨大昭寺之所以是全世界朝圣者的中心，就是因为主殿供奉着觉沃佛，\n即佛陀12岁等身像。此像为释迦牟尼佛在人间时所造，并由佛陀亲自开光加持。几百年后由印度送来中国，又过了几百年，由文成公主带来拉萨，是藏地最殊胜的佛像，也是全世界佛学智慧研究者和佛教信仰者视为释迦牟尼本尊的佛像。独一无二，永恒之光。\n"}, {"year": 2023, "month": 8, "day": 14, "text": "【神的孩子来西藏·奇异哉】昨天结业，起师顶着高反满城找宣纸，为同行家庭书写旅途句。在赵师的感召下，旅藏作家、前西藏人文地理主笔李初初老师也携书前来襄赞。我和松赞管家其加兄弟，在现场为每个家庭布置了游学相册和旅行视频。唱过敬酒歌，大家围坐书吧，一起回顾这一路走来的诸多“奇异哉”。殊胜之旅，很自然地开心扉，各自讲述了很多不为人知的故事，这些故事既传奇也温情，闪耀着人性的光辉。最后，以啤酒为竞价筹码，举行了起师书法作品和初师出版作品的拍卖会，竞拍气氛热烈，欢笑感动久久不愿散去，直至子夜。初初老师说：神的孩子才会来西藏！精彩的游学结束，而追忆，才是最远的旅程。\n起师在回北京的飞机上发朋友圈，如是道：“思想食堂·与中文先生同行”雪域高原松赞之旅圆满结业。五组家庭，八天私垫。一路随机应答，\n遇缘施教。胜景密意，颅内高潮。所遇异人异象，亦不可不称神奇。待少年拨云见日，开慧有时。便知高高山冈立，深深波底行，此人生不虚之\n"}, {"year": 2023, "month": 8, "day": 14, "text": "小昭寺的门把街头游荡的灵魂关进圣城\n"}, {"year": 2023, "month": 8, "day": 15, "text": "为了这口菇子，必须包顿饺子\n"}, {"year": 2023, "month": 8, "day": 16, "text": "9周岁，带他学佛自以为灯，自以为靠，自以为岛屿。\n"}, {"year": 2023, "month": 8, "day": 20, "text": "三弟的松茸，我自己去山上找过，3800的海拔爬山过河，真有高反。这里的松茸品质很好，政府背书，属于松茸里的尖货。在他做toC直销之前，没有快递愿意来，村民们在3800多米的深山里挖到的优质松茸，只能等做出口的批发商来上门收购，顶好的东西，咱们有钱也吃不上，都送去日、韩的餐桌了。\n现在不一样了，他弄了一辆皮卡，每天往返4-5小时，在村里装好冰袋，\n当晚就能到稻城的顺丰点。有了这样一条直通城市餐桌的路线，村里的卓玛们在青冈树下都笑开了花儿。\n最近是松茸出品最好最稳定的时期，感谢朋友们支持、品鉴，合作、批金色拉酒松茸之乡予行政许可决定书\n"}, {"year": 2023, "month": 8, "day": 21, "text": "刚过两点，保尔冲出钢琴教室，飞奔到楼下。他心爱的脚踏车被蹬地左右晃悠。这是去往游泳馆的方向，不出意外的话，冬妮娅半小时后会在那里上游泳课。首都的夏天似乎格外漫长，那么厚的暑假作业都写完了，风却还是热的，浓密的树荫下有干草晒焦的味道。真是个阳光灿烂的日子啊。\n"}, {"year": 2023, "month": 8, "day": 23, "text": "“遥想十九世纪开初的那些日子，徽商们行走在白墙黑瓦、牌坊林立的村落，他们的心境是宁静而自足的。这是中国商人们“完美”的一生。他们少贫而有志，壮富而好善，家足而子贵，在官府和同道中均受尊重，而最后的名声则留在了生兹葬兹的家乡。\n吴晓波：徽商的起源\n"}, {"year": 2023, "month": 8, "day": 23, "text": "凡字写得好的人，绝不会只是字写得好。\n颜真卿：人如其字，字如其人，我用一生做了最好的注解一颜真卿逝世1239周年\n"}, {"year": 2023, "month": 8, "day": 25, "text": "【我醉故我在】拿破仑说，思想比刀剑更有力量。马克思一拍大腿，对极了，所以，我先喝一杯王俊老师会喝酒，也会说酒，他把喝酒视为人类精神活动实践，醉的过程是生命意义展开的过程，更是当代个体的生活艺术和生命哲学的一部分。读完之后一句话：喝的是意义，醉的是幸福。我醉故我在。真是一本善解人意的好书。\n"}, {"year": 2023, "month": 8, "day": 26, "text": "【哲学是行动】当一位资深大书记决定押上前半生出生入死积累的一切声名，冲向当代前线；当一位上有领导下有团队的公务员干部依然在为构建生命的意义而坚持奋斗。。。星星之火，警如浪花，不用犹豫，点赞就对了。支持这样的体制内的“出头鸟”，就是支持你身边的好人，就是支持那些实实在在改变残酷现实的勇敢者。\n5次转型从女工到22家加盟酒庄女老板\n"}, {"year": 2023, "month": 8, "day": 27, "text": "今天的课，法国哲学两大关键词：生命、概念。很贴合70后逆生长的姜老师生命哲学观：姜人生哲学到底\n#生命哲学二期班LOSOPHY\n"}, {"year": 2023, "month": 8, "day": 27, "text": "课堂彩蛋：也曾坐在巨人的肩膀上。不知是哪位可爱的哲学班同学。\n"}, {"year": 2023, "month": 8, "day": 28, "text": "回京之前，来办公室合计工作。看到雪虎的书桌上有大概300万字的文本，合起来就仁字：以色列。感谢思想食堂和生命哲学班诸位朋友们支持，游学已成团，略剩几个空位，期待11月初相聚特拉维夫。\n· · ·\n"}, {"year": 2023, "month": 9, "day": 1, "text": "喝了半响茶，大家随机朗读起师的诗集《玄的弦》，恩泰老师现场写了一首诗，名副其实武林中的“秀才”。青年歌手杨沐和起爷在书架下正在用乌克兰威士忌调制一杯《漫长的告别》，据说这杯酒的配方源自钱德勒的同名小说。恩泰老师新诗第一句取自起师23年前写下的一句诗：在空虚的部位放上心脏。那首诗叫《北京·首篇诗》。趁茅台喝完之前，记下这个艺术的下午。\n"}, {"year": 2023, "month": 9, "day": 4, "text": "以色列游学11月6日出发，招募工作接近尾声，感恩从台北、波士顿、魏玛、京都一路走来的诸位老朋友和几位哲学班同学，大家终于要相聚在信仰之城。期待重逢。\n.UALEMTHE'CITYBEYONDBELIEF耶路撒冷信仰之城\n"}, {"year": 2023, "month": 9, "day": 7, "text": "回家看戏。安庆不能没有黄梅戏，黄梅戏不能没有韩再芬老师，和圣哲先生。期待Banpaag\n"}, {"year": 2023, "month": 9, "day": 7, "text": "一转眼就满座了，NB闪闪圣哲先生给我弄到他前面两排vvvip雅座。转圣哲先生朋友圈一\n【由土朕（民间伟人）编剧、导演的】黄梅剧《公司》曾于2003年12月16日-23日在北京长安大戏院首演八场，取得了意想不到的成功。\n时光过去了20年，我们原版复排该剧，供当下的观众欣赏、回顾的同时，也以此感谢当年为该剧顺利推出，作出努力和提供热情帮助的各位朋6、7、8、9、10日，每晚19:40在安庆黄梅戏艺术中心大剧院连演四场\n（10月21、22日在国家大剧院纪念演出两场）\n"}, {"year": 2023, "month": 9, "day": 8, "text": "微斯摩耶梭哈\n"}, {"year": 2023, "month": 9, "day": 8, "text": "又见北大孟繁之老师。\n妙不可言第三届九中山论坛地藏精神与中华文化学术研讨会\n"}, {"year": 2023, "month": 9, "day": 9, "text": "【早课】是各大宗教都有的仪式，也是修行人每天必修的功课，是新一天的开始。身为在家人，偶尔参与，往往会有神奇感受。因为这些年随缘在各地寺院体验，我依着个人经验把参加早课的全过程总结为六个步骤，每个步骤都有个神字，简称“早课六神论”，请诸君检阅殿宝雄大\n"}, {"year": 2023, "month": 9, "day": 9, "text": "山中有感：下山后，要努力，要努力在人间做个快乐的“社会人士”\n"}, {"year": 2023, "month": 9, "day": 9, "text": "飞机晚点一个小时。身为土生土长的安庆人，正好可以搞两个地道的小菜，替父老兄弟们，为来不及见亲友的远方游子，饯个行。祝他在外头好好混，有空常回家看看安庆市·真味鱼馆(市府路店)\n"}, {"year": 2023, "month": 9, "day": 10, "text": "再见，我的安庆，我的故乡。\n赵撑初故居慧秀伟地方园义为心天至大\n"}, {"year": 2023, "month": 9, "day": 10, "text": "【有时候，一位老师突然在你眼前出现，恰如东天上高升的太阳】今天在朋友圈看到很多人回忆自己的老师，这些老师或专业而严厉，或睿智而温暖，他们能让学生真情追忆，无不是因为他们都像一盏灯，点亮过一段生命旅程，他们的学生很幸运。\n思想食堂7年来请过上百位老师，他们令成功的企业家学员们尊敬和爱戴，因为他们都有个共同点，这也是我们选择老师最重要的标准：知行同一。他们从来不只是在教书，他们甚至拒绝教“书”，但他们从不拒绝传道、授业、解惑，他们都是拥有生命智慧的人。\n有时候，一位老师突然在你眼前出现，恰如东天上高升的太阳。那一刻，\n天是天，云是云，山川在灿烂，大地在发光。\n谨以此图，感谢为我们点亮生命之光的老师。\n"}, {"year": 2023, "month": 9, "day": 13, "text": "就地充饥，带儿子去听余老师讲座。我说，今天不用去托班写作业了，再送你一本漫画书，是在日本的著名作家毛老师翻译的，你今天算是过节了。儿子表示不服，节不节的不知道，我作业还得我晚上回来做，下次这种事提前约一下。。。\n"}, {"year": 2023, "month": 9, "day": 15, "text": "在上帝给犹太人的应许之地，有一条河流，每周六天奔流不息，在安息日停下脚步。一—这是书上的说法。对此，我更喜欢赵师的说法：明天是你们家的【法定钓鱼日】\n"}, {"year": 2023, "month": 9, "day": 17, "text": "官厅一日风雨雷电顾盼生姿寂寞圣贤\n"}, {"year": 2023, "month": 9, "day": 18, "text": "和菜头：一本50万字的《马斯克传》大概可以卖百万本，我读完写一篇2000字的读后感，2000字的读后感被人摘抄其中的200字。最后，网上流行的就是这几百字，获得几百万乃至上千万次的浏览。这说明什么问说明网友现在基本不读书。\n早在王朔发表《起初·纪元》的时候，我就已经发现了端倪。当我去看书评的时候，从书评里就能知道大多数人根本就没有读完，只不过自己觉得不能错过这次文化盛事，所以再怎么难也得写上几句。我也问过朋友圈里首批晒书的朋友，绝大部分在晒完之后就把书放在了书柜上。\n网友原来不读书\n"}, {"year": 2023, "month": 9, "day": 18, "text": "网友去了趟楼下的快递站。收成可观，乃至产生了富可敌国的幻觉。\n"}, {"year": 2023, "month": 9, "day": 19, "text": "【游学安庆】第一站远选在独秀园，俞敏洪先生不愧是北大的学生。安庆人陈独秀在创办共产党之前早已是风云人物，他一生影响最大、最深远之壮举莫过于在北大担任文科长时期发动的新文化运动。在安庆人看来，陈的政治功绩不被鼓吹是无所谓的，因为陈的才华、热血和气节无需渲染，\n那是安庆人骨子里的东西。\n虽然去过多次独秀园，今天也是第一次在手机上听现场讲解，抖音弹幕上对讲解老师赞不绝口。俞老师中午要吃鸡汤泡炒米，晚上还有黄梅戏。有兴趣的朋友可以在抖音上看直播。\n走进安庆\n"}, {"year": 2023, "month": 9, "day": 21, "text": "推荐一本【绝妙好书】为什么《碧岩录》如此重要却被忽视？为什么日本茶道界无比崇拜此书作者圆悟克勤大师？\n从山下看山上。《碧岩录》与《六祖坛经》并称“禅林双壁”，甚至在某种意义上是独一无二，被誉为“禅门第一宗”。\n克勤禅师少年开悟，为追求智慧究竟，穿草鞋着杖遍访崇山峻岭之禅门行迹，曾在禅门以一句“少年一段风流事，只许佳人独自知”证悟，成为一段佳话。南宋徽宗御赐“圆悟禅师”法号，东洋一休禅师前来问道，大师手书“茶禅一味\"赠之，现存京都大德寺，是日本茶道的精神之源。\n所谓“言不可言说之事，悟不可言传之道”。禅宗讲究“不立文字”，但禅师又必引公案以诗偈语录传法，遂又称“不离文字”。圆悟克勤大师汇评禅僧雪窦重显百则公案，著成《碧岩录》一卷，一时轰动丛林，名震海外。\n但该书行文极简且古，意蕴广博，既有佛经警喻，又广用经史典故，非深学博识的中文大家难以贯通。从去年敦煌之行前开始翘首以待，祝贺【中文先生】起师和诗人赵野大作付梓，亦贺佛学智慧的研究和爱好者即将有好书可读。\n关干100则公案禅宗奥义书首度诗文诠解文字行者胡赵赵赵野四手联弹“不立文字，不真文字”之心徒\n"}, {"year": 2023, "month": 9, "day": 22, "text": "前些天看的《公司》在【国家大剧院】开票了，中国最好的戏曲舞台，前排还有座位可抢。《公司》唱的是创业，讲的却是生命和生活的“道理”。\n由当今黄梅戏第一名角、两次梅花奖得主韩再芬老师和她的再芬黄梅班底\n《公司》有别于严凤英、马兰时代的黄梅戏传统经典，故事美好意义隽永，唱词贴近当代生活，曲调优美节奏欢快，程式简洁动作干脆，舞美灯光设计20年前一流，20年后再看依然令人惊艳。\n《公司》的编剧是位奇才，20年前就预判了昨天的恒大、今天的碧桂园们。作为舞台艺术，在我心目中可比人艺的《小井胡同》，甚至《茶将艺术明院·脱代黄梅24-25/2023\n"}, {"year": 2023, "month": 9, "day": 22, "text": "一直想看的黄梅戏《倾宁夫人》也终于来北京了。去年已经在合肥、苏州大获成功。这部戏讲述的是安庆地区桐城市“六尺巷”的故事，圣哲先生和韩再芬老师联手创作，是《徽州女人》、《徽州往事》之后的“徽州三部曲”之第三部。\n韩老师是老省府安庆人，圣哲先生是老徽州休宁人，这一安一徽，用真切细腻的家庭小历史和人物冲突演绎大安徽的商与官，背后的文化底蕴、时代命运，令人赞叹。徽州三部曲所表达的，何尝不是闻名世界的安庆同乡余英时先生所说的“士商”传统。\n《倾宁夫人》又是一次创新，把一个政治叙事视角的故事个人化、生活化，这样的家乡三部曲对于皖人的意义，与京人的《四世同堂》无异。六尺巷和张英张廷玉父子宰相的故事，很多人都耳熟能详了，尤其是大学士张英在家书中说的那句“一纸家书只为墙，让他三尺又何妨”。但作为安庆人和半个桐城人，我更喜欢张英在他晚年从庙堂之高归隐龙眠山，在双溪草堂写给子孙的家训一富贵贫贱，总难称意，知足即为称意；\n山水花竹，无恒主人，得闲便是主人。\n10.27-29/\n"}, {"year": 2023, "month": 9, "day": 22, "text": "10.14-15【犹太学·专题课】为表达对报名以色列游学同学的感谢，特别礼聘中国犹太学研究的领头人一徐新老师出山，系统讲授2天犹太和以色列专题课。这个课虽然不在以色列执行计划之列，却是可遇不可求的好课。行前加餐，是为壮行，希望盆友们不要错过。\n能得到徐新老师认可，思想食堂倍感鼓舞。30多年前，徐新老师在南京大学创建了犹太文化研究所，并在研究所自筹了亚洲最大的犹太文化藏书馆，徐老师那里主编了首部中文版《犹太百科全书》，也为国内一众著名高校培养、输送了十多位优秀的犹太文化学者。所以，南大是国内犹太学高地，而徐新老师就是这片高地的旗帜。\n徐老师对犹太和以色列文化的研究是立体的，也是具体的，他访问以色列数十次，既有学术研究，又有涉及经济创新的社会、文化政治研究，以至于以色列总统也按耐不住要看看他是谁。他被国际学术界公认为中国犹太学研究的领头人和最具影响力的学者，没有之一。\n徐老师与共和国同岁，出门不多，这次在上海连讲两天，机会难得。也开放给对以色列感兴趣但因种种原因不能同行的朋友报名。欢迎同窗共学，\n感谢襄赞支持。\n的文化机制犹太文化与中国的教育理念中国人应该向就徐新老师：\n现任南京大学哲学宗教南京大学犹太文化研究中国扰太文化研究会\n"}, {"year": 2023, "month": 9, "day": 22, "text": "现代黄梅剧《公司》这部戏很传奇。这部戏和韩老师的再芬黄梅是典型的传统艺术事业转型【文化产业】发展的成功案例。\n韩再芬老师少年成名，按说20多年前正是她在戏、歌、影视多栖绽放的黄金年代。谁也没想到她会突然从钱途闪耀的影视圈激流勇退，回到家乡带头实践起文化体制改革。当年的她一腔热血，自筹资金创办再芬黄梅，\n在国内戏曲界可谓勇立潮头，一时万众瞩目。\n然而，在那个“文化产业”一词是褒是贬尚需论证的年代，从没听说过传统文化事业单位注册成公司就能自己养活自己。和后来大部分全国各地文改办经手的单位一样，再芬黄梅剧团毫无悬念迎来了青黄不接的年关时节；\n和大部分折戟沉沙的文改实验田不同的是，韩老师的再芬黄梅挺住了，凭借《公司》这部戏，改革后的再芬黄梅剧团得到了戏迷的认可和回馈，那个春节，正是热爱家乡戏、喜爱艺术家韩再芬的企业家们以一次又一次的定制包场和商演赞助帮助再芬黄梅挺过寒冬。\n20年前，还没有国家大剧院，《公司》在北京长安大戏院首演，8场爆满。20年后，前两周在安庆连演4天，每天也是座无虚席一票难求。如今班师回朝，再次回到《公司》的起点，真是意义非凡。\n20年可谓整整一个时代，韩老师单挑黄梅戏大梁，拉扯着几经沉浮的一个地方戏曲走南北、闯世界，身份不断变幻，亦艺亦士亦商；台上台下，\n戏里戏外，她和她的再芬黄梅团队共同度过了中国文艺界最跌宕起伏的20年，坚持到今时今刻，想必她甘美的唱腔背后一定会有数不清的往事回味。而这回味，应该是20年后《公司》最值得品味的部分。\n"}, {"year": 2023, "month": 9, "day": 23, "text": "【如果人生是一场大梦，请君不哭】现象级的歌曲，曲子上头，词写得更好，引人共鸣，也发人深思一如果君有幸，在人生中途就明白：这一切终是一场大梦，那么多的错误，\n还会重复吗？\n也许你会说，答案不知道，但就是好听，想哭。为什么？对啊，为什么。\n与其说是歌唱，不如说是哭诉。她哭的样子很美，他诉的样子很静，他们歌唱了一种普遍的具体的苦，让人忍不住会跟着在心里为自己也哭一场。\n但哭完请君也别忘了这是一场《大梦》。\n如果君看见—\n花儿在绽放鸟儿在歌唱云朵在天上小河在流淌如果君看见天行正健，地势也坤君，还要继续哭下去吗鲁迅说：人生最苦痛的是梦醒了无路可以走。做梦的人是幸福的；倘没有看出可走的路，最要紧的是不要去惊醒他。\n鲁迅还说：梦是好的，否则，钱是要紧的。\n瓦依那X任素汐@摇滚现场Live\n"}, {"year": 2023, "month": 9, "day": 24, "text": "“上都城是现在在位的忽必烈汗所建，城内有一座美轮美奂的大理石宫殿，整个殷堂全部描金涂彩，金碧辉煌；殿内房舍绘有成千上万种花草树木、鸟兽鱼虫，做工精细，技艺精湛，观之赏心悦目，心旷神怡。”一1275年，马可·波罗随同其父亲、叔叔，从意大利威尼斯来到中国。\n在上都的宫殿里，他们觐见了忽必烈。马可·波罗在中国侨居17年，他多次去上都，对这座草原都城十分熟悉。他的《马可·波罗游记》专门有《上都城》一章。\n地理|元上都：忽必烈的龙兴之地，为何被西方称为“仙境”？\n"}, {"year": 2023, "month": 9, "day": 24, "text": "也就800年前吧，这片土地是世界的中心。成吉思汗的铁骑震颤了宇宙，被称为上帝之鞭。忽必烈被马可波罗和中亚中东乃至欧洲人视为世上最强大君主。\n这对爷孙家业版图相当于以下之和：中国、韩国、朝鲜、缅甸、老挝、泰国、不丹、尼泊尔、印度、孟加拉国；吉尔吉斯斯坦、巴基斯坦、塔吉克斯坦、土库曼斯坦、乌兹别克斯坦、阿富汗、伊朗、伊拉克、约旦、叙利亚、黎巴嫩、巴勒斯坦；以色列、沙特阿拉伯、巴林、科威特、卡塔尔、阿拉伯联合酋长国、也门、阿曼、亚美尼亚、格鲁吉亚、土耳其、阿塞拜疆、塞浦路斯；瑞典、芬兰、挪威、法罗群岛、丹麦、爱沙尼亚、立陶宛、拉脱维亚、白俄罗斯、俄罗斯、摩尔多瓦、乌克兰、波兰、斯洛伐克、捷克；匈牙利、荷兰、奥地利、罗马尼亚、塞尔维亚、保加利亚、阿尔巴尼亚、马其顿、克罗地亚、斯洛文尼亚。。。\n"}, {"year": 2023, "month": 9, "day": 24, "text": "800年后，从遗址博物馆辞职干个体户的小魏说，这铁疙瘩动一下赚2块，劳动让人快乐。\n"}, {"year": 2023, "month": 9, "day": 25, "text": "“你们知道，只要人一辈子钓过一次鲈鱼，或者在秋天见过一次鸟南飞，瞧着它们在晴朗而凉快的日子里怎样成群飞过村庄，那他就再也不能做一个城里人，他会一直到死都苦苦地盼望自由的生活。”—契科夫他们一开口，全网都哭了\n"}, {"year": 2023, "month": 9, "day": 26, "text": "【生命哲学·生活的道理】10月24日晚在北京国家大剧院。不知道会遇到我为什么极力推崇黄梅戏《公司》？并不仅仅是因为自己的故乡情节，更多是因为这部戏的剧本作者是《生命哲学》班一期班特别课堂的导师-聂圣哲先生。\n圣哲先生何许人也？\n很难一句话定义他。他既是员工报销不贴发票的老板、也是没有办公室获奖无数的学校创始人；他既是讲课不玩概念的教授、也是写书从不啰嗦充字的诗人、作家，他还有很多闪光的社会身份，由于涉猎太广且太有成就，有人把他誉为中国民间第一伟人，身边的青年人则敬他为圣哲先生。\n很多中国企业家都想学习圣哲先生的企业经营哲学，以至于他公司的内部管理文档《德胜员工守则》一出版就卖断。年年加印，已累计加印30多次。正版渠道就有50多万册售出，证明至少有几万家企业在学习德胜的管理秘籍，可问题来了，为什么你我身边鲜有第二家“员工报销不用贴发票”“老板没有私人办公室”的公司？\n带着这个问题，一年前孙教授带哲学班同学们前往德胜访学。当时身在彼山中，我虽然两次前往，对此仍若有所思却不得；两周前我在安庆黄梅戏艺术中心看《公司》的时候，恍然若有所悟。\n答案，就在《公司》的主题曲里，主题曲的名字叫《生活的道理》。\n18.2425/日\n"}, {"year": 2023, "month": 9, "day": 29, "text": "【慢速快乐】20个小时，两个人开了700公里，效率有点低，安全第一。眯了一觉又加了鸡腿，下个服务区换把手接着走。这一路虽然走的慢，有爱人和儿子在一一起唱着歌儿聊着天，没觉得太难熬。前二十个小时讨论了一堆难以想象的话题，更新了很多滞后的家庭成长信息，不禁对生活的未来也充满了信心。一路不停地吃吃喝喝，速度很慢，却也过得很快乐。时间预留的提前量比较大，昨天出发的目标就是能在今天月圆的时候到家就行。还剩500公里。下半程的路，快或者慢，已经不重要了祝朋友们中秋快乐！\n"}, {"year": 2023, "month": 9, "day": 29, "text": "院里桂花香，游子缓缓归。\n安庆市·腊树收费站(出口方向)\n· · ·\n"}, {"year": 2023, "month": 10, "day": 6, "text": "11月初，思想食堂将走进以色列，去近距离地感受犹太人的历史与文化。\n启程在即，围绕着历史、文化、商业、文学、军事等几个维度，小编精挑细选了十本关于以色列的书籍，温热此次以色列的寻迹之旅，启发我们的以色列游学荐书|6个维度，10本书，带你全方位了解犹太人和以色列\n"}, {"year": 2023, "month": 10, "day": 8, "text": "以前我们有一个朋友说，我活到现在了，已经一无所求。他觉得他自己已经明白了，然后他旁边的和尚跟他说了一句话，你现在最大的求就是让别人知道你一无所求。要把它破掉，你以为你活明白了，其实你还不明白。\n胡起起&赵野：每一段公案都是一幕戏\n"}, {"year": 2023, "month": 10, "day": 8, "text": "随手翻一则，学个骂人的雅词。\n关于100则公\n"}, {"year": 2023, "month": 10, "day": 13, "text": "一下午，在这里擦肩的国际友人比我整个今年在国内看到的都多。纪念馆非常值得来看，走一圈，给我最直接的启发：战争来自政党，苦难击倒家庭；幸福若存人间，恩情只在个体。\n了一个永语.\n三代中护图书70年等待主人的手袋来自上海的出生证上海市·上海犹太难民纪念馆-摩西会堂\n"}, {"year": 2023, "month": 10, "day": 14, "text": "【犹太和以色列课】今明两天时间，系统学习徐新教授30多年的犹太研究。这个课本是以色列游学行前动员课，现在一时不会启程，但来的同学还是不少。\n对于发生在远方同类身上的悲剧，我们心生怜悯。但对于事情的前因后果，是非曲直，很难理解或讨论，是因为基础信息储备不够，赖以讨论的概念共识也不足以支撑理性地探讨。也很难判断后续还会如何发展乃至对彼此的影响。相信听完老师的系统授课，至少大家关于正在发生的悲剧和争论，会有更平静的认识。\n这次课的场地非常好，空间美好，交通方便，从虹桥高铁站走过来也就20分钟。\n"}, {"year": 2023, "month": 10, "day": 15, "text": "【塔木德】犹太人至少1500年前业已成文的“如何过好这一生”的操作指南。不看不知道，一看吓一跳，同时期从未有如此尊重个体生命的智慧文本。从实践来看，至少是领先世界2000年的生命哲学。\n"}, {"year": 2023, "month": 10, "day": 15, "text": "此刻，与共和国同岁的“70后”徐新老师，坚持要自己从教室带着课程宣传板，大步迈向1号京沪线检票口。两天的课程结束，这次以色列游学的延宕未必不是一件好事，至少在行程安排上又得到徐老师的很多帮助，如能重新出发一定会更加精彩。期待冬去春来，和徐老师重逢迦南。\n"}, {"year": 2023, "month": 10, "day": 16, "text": "叶件伙风不，叮产小可是我心头，不灭的是热情每时每刻追寻梦中的憧憬啊...璀璨的群星纵然无名，也要闪晶莹不沉寂，从来不放弃进出华彩，点燃生命我亦启程，\n照着心的指引去远行我亦启程，\n再见吧，命运之星....什么时候啊有谁也曾来到这路上啊...什么时候啊有谁也会循着这去向我将启程脸上映着银色的星光我将启程再会吧，命运之星.\n昂--村新司（)\n"}, {"year": 2023, "month": 10, "day": 25, "text": "周日的安排再升级，下午在大报告厅，王院长来为孙老师和嘉映老师主持对谈，二期班一转眼也快进入尾声了。\n总恰小时授理孙周兴：对谈孙周兴×陈嘉映\n"}, {"year": 2023, "month": 10, "day": 28, "text": "今天的课，周濂老师从政治哲学入手讲《公平与正义》，这是个古老到让人忘却乃至怀疑存在的课题，显然这不可能是一两句简单的金句就能这背后的基础和逻辑需要展开来慢慢授。9点上课，有同学提前40分钟就来占座，有同学一夜未睡，此时刚下飞机。\n杭州市·浙江大学（紫金港校区）哲学学院\n"}, {"year": 2023, "month": 10, "day": 28, "text": "课堂实录计么叫做真正的服队？\n兑真话还是努力说真话？\n改塘大间题，青定企所刚才看了既生的服，你我心心看了版生的核为，你已时信你美数起费气，保险责性，有车开这个做界。\n今天我们如何才有小孩在争一支黄子，每个人都说自妮是三个人中唯一会演奏留子的人：\n家境最贫寒，从来就没有属于自己\n"}, {"year": 2023, "month": 10, "day": 29, "text": "【哲学是行动·以爱之名】上午的课，孙老师突然宣布选班长。这个消息我也只比同学们早20分钟得知，简单安排之后，大家在没有候选人的情况下自由地不记名投票，全体同学都毫无准备，但无不兴高采烈地填票、唱票，20分钟后，成功喜提一位女班长和两位男班副。\n有意思的是，为营造独立与自由的学术交流氛围，二期班同学们自主决定在开班后一直尝试一种“去中心化”的组织，大家都在享受非常纯粹地的学术交流，有时候甚至会为一个概念或一段文本的理解或者当下发生的事实究竟争的不可开交，自始至终，这个班几乎没有什么线下的“江湖”氛围。\n而这位获得过半票数的女班长平时其实很少在群里发表高论，她参加哲学班学习的契机还是受闺女要在美国学习哲学的触动，她说要和孩子共同进步。我印象深刻的是她在去年12月31日视频开班时，和素未谋面的同学们讲述了她和四个子女的生命故事，故事的内容记得并不清晰了，但她讲述的感情就像每个深爱自己孩子的妈妈一样，充满了爱和能量。\n学是行动\n"}, {"year": 2023, "month": 10, "day": 30, "text": "已经吃完，特别好吃。如果在杭州有半天以上的空，可以来韬光寺吃碗\n· · ·\n"}, {"year": 2023, "month": 11, "day": 1, "text": "【看日本，想中国】穿城去见日本三部曲《启蒙》《歧路》《重生》作者马国川老师，和他相约东渡，用一场硬核游学勘破霓虹，汲取理性，探寻现代文明共同体的商业与政治的另一种可能。\n此行将跟着马老师一起，在东京深度游学一周，聚焦福泽谕吉、大限重信、涩泽荣一、吉田茂等思想家的理念和实践，访谈东京的大学、纪念馆、博物馆，市政厅等，一边看一边想。除了会见到日本的学者，还会看到在国内不太方便畅谈的老师。找十多个硬核同学一起，预计1月10日出发，有兴趣的同学可以告诉我。\n马老师经典总结：当西洋人来到日本时，日本为什么选择坐下来谈判签订条约，而不是武装对抗？而反观中国无论是国内统治权的更替，还是处理与国外的矛盾冲突，几乎都是采取战争的形式，不是你死就是我活，很少有通过谈判去解决的。但谈判其实是一种比战争更文明、更高明的解决问题的方式。主动用枪去解决问题的民族，不可能是一个文明的民族。坚决反对一切形式的战争，应该成为全人类的共识。主动发动战争的国家，从来都不值得被原谅。\n家的启蒙国家的歧路国家的重注传兄惠存我与八十年代\n"}, {"year": 2023, "month": 11, "day": 2, "text": "红旗迫降，青天留白壮志未酬，同志犹在长江不改，黄河入海一人先去，万万人来2023.11.2\n"}, {"year": 2023, "month": 11, "day": 8, "text": "二期班压轴课程，中国美术学院院长高世名教授给同学们讲【艺术哲学】\n这个主题和师资，估计现场要抢座位了。硅基智能正在不断警告碳基人类：生命不能没有创造，生活不能没有艺术。\n主命哲学\n"}, {"year": 2023, "month": 11, "day": 9, "text": "本月另一课【实用主义哲学】网上有一种论调说漂亮国历史短，没什么了不起。这么说的人自然是对美国历史没有正确的认识。在人类思想史领域，实用主义哲学是美国思想家贡献给世界的一大发明，这一原创思想至今影响着现代文明的方方面面。其实，从几百年前的欧洲人远渡重洋开辟自由新世界，到脱离英国控制国家独立、创制世界最稳定的宪法体系，再到在经济、技术长期领先世界，成为时刻吸引着全世界人才趋之若鹭的热土，这些美国现象背后的深层原因，太值得认真探究。而实用主义哲学就是理解这一切的钥匙。\n陈亚军老师是国内最好的实用主义哲学研究者之一，曾担任复旦大学杜威中心主任。他回忆几十年前从德国到美国哈佛大学的情景：“那时我对德国哲学的理解比较狭窄，对其压抑的一面感触颇深。乍一接触实用主义，\n顿觉自由和解放。”\n3月给1期班同学讲这一课的情景似乎还在眼前。瑟瑟春寒，听完一课，\n很多同学都有恍然大悟之感。\n功学，即功利的实用至上主义。陈老师在课上介绍，英文Pragmatism\n（实用主义哲学）单词源自希腊单词πpavua（行动、实践），所以皮尔士的实用主义哲学有别于以往的形而上学传统，强调行动。因此，从某种程度上讲，实用主义也可以叫“行动哲学”。\n这正是生命哲学班【哲学即行动】理念的源泉。\n买用土文时生命哲学\n"}, {"year": 2023, "month": 11, "day": 15, "text": "1月，硬核东京马国川老师×秦晖/沈志华老师福泽谕吉x大限重信x涩泽荣一x吉田茂庆应大学×早稻田大学×东京国立博物馆帝国饭店x东京新大谷×镰仓王子酒店人均餐标10000日元/天教育、改治与商业精神4位关键人物\n"}, {"year": 2023, "month": 11, "day": 22, "text": "人满为患，不同演讲者的个人风格和研究立场对比鲜明，从个人感受和听众面色反馈，口号式的“好消息”不再让人振奋；屏幕上的数字无声，犹如滚滚而来的天雷。财经年会2024，由马国川老师曾担任主笔的《财经》\n杂志主办，主题里有个永恒缺座的关键词“理性”。\n《财经》年会2024：预测与\n"}, {"year": 2023, "month": 11, "day": 22, "text": "下午《财经》年会地产分论坛很有看点，围绕【症结】与【施策】的主题1，香港中文大学陶然教授直接给答案：①住房应该永久产权②延迟房产税③解困部分民营房企4取消限购，住房应该继续市场化，保障房已经让地方财政破产（图1-3）\n2，长江证券首席经济学家伍戈博土用国际数据尤其是日本的地产恢复历程直接揭底：中国家庭和企业经济实力持续受伤，伤情还在恶化。（图4-6)\n3，原中国房改课题组组长、原中房集团董事长、享国务院津贴孟晓苏教授讲了一些革命家史段子，提出“由政府拨款给央企国企大兴保障性住房，建多少呢，至少50%，房价参考商品房三分之一”同时保留保障房旁边的高价商品房的“双轨\"建议。（图7)\n4，原住建部副部长、国际欧亚科学院仇保兴院士对政策和预测只字不提，大谈在城里的房子里布置花园有益减少少年抑郁和老年痴呆。（图\n"}, {"year": 2023, "month": 11, "day": 24, "text": "二期班同学们有福，后天的课临时请到了清华的汪民安教授。有些朋友可能关注到思想食堂很久前就在推广他的书，他是国内福柯研究第一人，专注“影响了整个当代世界的法国哲学”研究。汪老师的影音资料很多，属于那种绝对艺术家气质的创造型学者，灵感恣意，才华横溢。因为喜太欢福柯，他就自己导了一部纪录片《米歇尔·福柯》，又因为太懂福柯，他这部片子简直比他的课和书烧脑至少100倍。前新周刊主笔胡起起老师赞他是“哲学界最会写书的人”，这里的“书”显然不是指那种枯燥的学术文本，而那部实现了本雅明式创作理想的福柯纪录片，本质上是一部再学术不过的论文了。\n与生命哲学家用电器\n"}, {"year": 2023, "month": 11, "day": 28, "text": "马老师写一个书生作为日本一万元钞票头像的意义。一个多月后，“谕吉”头像将换成与他同时代的实干家涩泽荣一，一个开创日本近代商业繁荣的企业家，届时将一段时间出现两种万元钞票的“士商”并流，如同涩泽荣一的名著《论语与算盘》。\n马国川：一个国家的启蒙老师|1.11-17日本历史与文化之旅\n"}, {"year": 2023, "month": 11, "day": 30, "text": "为什么大家都羡慕巴菲特，但更尊敬芒格？大概是因为中国的“巴菲特”们都“在寻找自己的芒格。”本文作者1月份将在东京为思想食堂游学授课，\n刘军宁|芒格更稀缺：从君臣主仆到伙伴共和\n· · ·\n"}, {"year": 2023, "month": 12, "day": 4, "text": "转一张东京帝国饭店的2024新年海报，1月的游学将有一天下榻这里。\n建筑大师赖特设计的经典作品，甲方是日本新年新版1万元上的头像人物涩泽荣一，一个在100多年前办了500多家公司的人，东京证券，川崎重工，东京电力，第一国立银行（瑞穗）..帝国饭店是他的杰作之一，反而很少被人提起。他写了一本著名的书《论语和算盘》，影响之深远，传播力之大，堪称是日本企业家和商人的圣经。\n有意思的是他和孙中山先生的交往。辛亥革命被袁大大总统渔利之后，孙先生以发展民生、兴办实业为名到东洋募资，找到涩泽荣一，合办了一个公司叫“中国兴业”，资金应该是输送过去了，可惜这个兴业公司后来可见的资料信息不多。马老师在文章里曾指出涩泽荣一借着输送资本金，也输出了一下他对的观察和观念：孙先生不宜从政，还是实业救国靠谱。\n当时，国父东渡，住在著名的八芳园里的小别墅里，这个小别墅战后改成了一个料理店，去年接待美国总统的的时候闹得动静很大。实际上，八芳园曾是涩泽荣一堂兄的物业，后来他年纪大了嫌附近闹，就卖了。接手的人是日本另一个风云实业家久原，他比较出名的公司是日立集团和日产汽车，当年正是他把那个小别墅给孙先生住了，并且还十分贴心地在后面开通了一条暗道。\n所以，结业晚宴的选址将有两个选择，帝国饭店宴会厅和八芳园都会是非常值得期待的体验，晚一些根据实际招募情况再确定。\n国の正月4位关键大物Day2R上:8步部\n"}, {"year": 2023, "month": 12, "day": 5, "text": "【中国企业家如何不做牢】东京私董晚宴的主题这样写，会不会比《国家大商人如何穿透政治迷局》更解渴？主持人的名字是让很多民营企业家如雷贯耳的“伍雷”。马国川老师跟我说，可以带大家去见一下伍雷律师，理由是他人特别好，这片土地上这样的正义之声不多。\n关于伍雷律师，我想引用网上的一段描述：这个在中国刑辩圈赫赫有名的名字，被北理工法学院的徐昕教授赞为“中国平反冤狱贡献最大的律师”，\n中国政法的何兵教授更是评价说：“自十八大以来，中国平反的重大刑事冤案中，几乎有一半都得益于伍雷的直接或间接参与。”他因帮人洗冤奔走呼喊而喜提“言论不当”罪名，被吊销律师证，堪称中国司法界奇闻，但他的正义之声还在东京的上空持续呐喊，并未显消失。\n神秘嘉宾是不是刘老师）在东京都有过从，非常期待他的分享，他有句话让我印象深刻，叫一东京改变中国。\n媒頭界律4位关键大物Day2:\n1月1211 (5\n"}, {"year": 2023, "month": 12, "day": 7, "text": "又一年。重温一句诗江雪召唤我垂钓一种风景我茫然地钓起天地精神-世存老师余世存：“大雪”君子以寒江独钓\n"}, {"year": 2023, "month": 12, "day": 7, "text": "为何他人之财不可擅取，而其思想却能任意采摘？—刘军宁老师此问真是字字珠玑，大震江河，有劈山盖世之姿。期待东京之行，聆听刘老师高刘军宁|思想的价签\n"}, {"year": 2023, "month": 12, "day": 10, "text": "2024首课，复旦王雷泉教授讲《了凡四训》。在著名的嘉兴香海禅寺，\n环境极雅，寺里有个安静整洁的图书馆。嘉兴古迹很多，几年前还曾去袁了凡墓看过。\n明土街朵老神讲\n（了凡四脚\n"}, {"year": 2023, "month": 12, "day": 11, "text": "1月日本游学，计划外又新增了几位对话嘉宾，一路走一路看“东京改变中改状宋么行程安排闭门讨论课：\n果：马国川《看日本，想中国：重\n《、政治家与实干家》\nn/mm\n"}, {"year": 2023, "month": 12, "day": 12, "text": "今天在深圳偶遇张卜天教授，一位活着的、才40多岁就翻译出版了近2000万字科学哲学著作的天才（闻所未闻）。举个例子，没有他的翻译，\n谁会知道科学家爱因斯坦还写过一本哲学专著《我的世界观》。畅谈半日，被张老师的幽默和率真折服。张老师已从清华南下西湖大学，期待有机会请他授课。\n张卜天：让生命有意义的事才最现实\n"}, {"year": 2023, "month": 12, "day": 13, "text": "深圳终于降温到出门可以穿外套了，坐船去珠海，广播提醒今天是国家公祭日，想起8年前在南京大屠杀纪念馆看到的影像资料。86年前的今天，日本军人打败了中国军人，在南京城对市民犯下的罪行馨竹难书，令人胆寒。昨天收到东京游学吉田茂纪念馆确认授课场地的回复函，真诚友好，严谨有礼。虽然是两件完全搭不上边的事，但此刻同时想起，仍然五味杂陈。\n何为人性？何为政治？何为战争？对于希望“时刻关心政治、永远远离战争”的中国企业家而言，《麦克阿瑟与吉田茂》的故事并不陌生，能坐在昔日战败国首相家中，听中国的学者讲授其重新崛起的历史动因，也是意义非凡吧。\n"}, {"year": 2023, "month": 12, "day": 13, "text": "彩排现场，这是卢卡·佩奇里&吉达·布塔伉俪奥斯卡电影原声亚洲巡演音乐会的第一站，策划人是台湾的刘波女士，担任全程翻译的是视频里逗他们开怀的琴童，他们的中国经纪人余能达。很荣幸在深圳能顺道来重温经典，期待两位老师圣诞节抵达杭州。\n"}, {"year": 2023, "month": 12, "day": 17, "text": "二期班结业前安排了一天课【人气冠军】吴冠军教授（华东师范大学政治与国际关系学院院长），为大家讲授他最新研究成果《从元宇宙到量子现吴教授不仅学术圈里著书颇丰，而且擅长用接地气的语言讨论哲学概念，\n所以在市面上也是广受欢迎，在b站上的哲学课更是吸引了大量90后00后粉丝，被称为“人气冠军”。\n他有一本专著是孙周兴老师主持的《未来哲学》丛书中的一本，叫《陷入奇点》。关于未来，孙老师有个总体观点叫“生活是好玩的”，吴教授在这部书里大量讨论了康德、牛顿和量子、游戏、工厂这些看似不相关的命题，他说“世界兴亡，玩家有责”。\n吴老师是第一次在哲学班授课，机会难得，租了大场地，也欢迎一期班同学和三期班同学来。\n元宇宙和量子现实\n"}, {"year": 2023, "month": 12, "day": 17, "text": "二期结业暨第二届生命哲学论坛，阵容强大，主题是《未来人的生活世高世名 （中国美术学院院长)\n陈小平（中国科技大学机器人实验室主任）\n孙周兴（浙江大学未来哲学研究院院长）\n王俊 (浙江大学哲学学院院长)\n欢迎一期同学和三期同学参加结业论坛生命哲学高级研修班\n"}, {"year": 2023, "month": 12, "day": 18, "text": "理论指导【吃瓜吃透】先遥敬东京游学宝藏刘老师，推荐他大量著作中为数不多还能买到的《投资哲学》。书中有一篇文章谈到投资哲学实践的伙伴关系，以巴菲特和芒格举例，他写到“自古以来，人与人之间的关系只有两种基本的格局：人与人之间的平等的伙伴关系，人与人之间的上下的君臣关系。我喜欢人人平等的伙伴关系，厌恶法老之下的君臣关所以，董、孙、俞的事虽然发生在今天，从刘老师这个角度看，就问是伙伴还是君臣？一目了然。农耕时代，总强调三个皮匠（神将，副手）顶个诸葛亮，归根结底还是君臣佐使观念作崇；现代文明，自我与他者泾渭分明，却又互为依存的前提。翻译过来，巴菲特有才，芒格也无可替代。如果芒格缺位，再来三个巴菲特也抵不上一个芒格。\n这一点，我半年前组织哲学班二期班委选举改为去中心化建组时已有所触及，如今想来，很多人际关系困扰和纠纷的本质盖源于此，《投资哲学》\n真该早点读。\n"}, {"year": 2023, "month": 12, "day": 19, "text": "北大彩排现场，祝贺卢卡和吉达这对奥斯卡传奇音乐伉俪。期待与他们在杭州共度圣诞泰\n"}, {"year": 2023, "month": 12, "day": 22, "text": "明天结业，看到很多同学们自发寄来的毕业礼品，意外地精美。上午的仪式最令我期待的是几位同学代表会做结业发言。不知道明天会听到怎样的声音，一年多以来的经验表明，这是一个既注重“文本”又尊重“个体”的去中心化的班，所以，明天应该是极具创造性的一天，一切皆有可能。\n"}, {"year": 2023, "month": 12, "day": 24, "text": "昨天下午和今天上午，听华东师范大学政治与国际关系学院院长吴冠军教授两场课，感觉是沉浸在一场量子物理学与元宇宙哲学、PPT美学、和哲学教授舞台艺术的盛典里，同学们无不洋溢着身心愉悦的笑容。【人气冠军】名不虚传。感谢冠军老师，同学要求三期班一定还要请到冠军老师。\n听吴老师一节课脑洞大开\n"}, {"year": 2023, "month": 12, "day": 24, "text": "哲学论坛《未来人的生活世界》|中科大x中国美院x生命哲学现场除了一期二期和三期班的同学，还有很多大学老师和博士、研究生，\n坐满了。\n"}, {"year": 2023, "month": 12, "day": 25, "text": "带以均撤权，布人儿灿儿时劣火大过十。\n然而，看到二期班同学们在教室楼下这样的笑容，我突然想起“取钥匙”本是一件再日常不过的事。\n人生海海，无时无刻不可“爱且期待”。心锁之钥，若能携侣同游俯仰即得，又何必亲赴漫漫西天万里之遥。\n雨崩在心里，三墩在脚下。\n（三墩，是生命哲学班在浙大紫金港校区上课时所在的地名）\n以上，致谢所有参与和关心生命哲学班的老师、同学以及帮助我们传播和招生的朋友们。让我们共同期待、见证、参与好事发生。\n"}, {"year": 2023, "month": 12, "day": 28, "text": "1月11日东京游学进入出发倒计时，种草著名的【松本楼】餐厅，希望能在这里为大家安排上一次晚宴。倘若能在孙中山先生和宋庆龄女士的婚礼举办地，重温那段沧桑又传奇的历史，未尝不是一大值得期待的幸事。\n早在1903年，西洋风格的建筑松本楼就是东京最早也是最受文人墨客最爱的西餐厅。120年来，这座餐厅见证了明治时代上流社会的文艺活动，\n留下了画家和诗人、甚至大文豪夏目漱石的足迹，尤其见证了中国革命的重要历史。\n其主人梅屋庄吉，是国父孙中山先生的结拜义弟。1895年，孙先生与梅屋在香港相遇，当即义结金兰（不知道有没有现场磕一个）。倒是老弟梅屋豪爽承诺“君举兵，我以财政相助”，据说后来这个承诺“支持义兄干革命”竟成了梅屋兄弟赚钱最大的动力，硬是把梅屋逼成一代巨商。这两位壮志凌云的好兄弟，相必在松本楼畅谈过不少美好的未来与梦想。孙中山和宋庆龄惊世骇俗的婚礼也是在此举办，当年若非东京义弟和弟妹体贴入微的张罗和操持，这段佳话可谓困难重重，恐难流传。松本楼里有座宋庆龄弹过的钢琴现在还在供食客参观。\n为表谢意，国父曾在兄弟的和服上写下“贤母”二字，赞颂之情可谓溢于言表，相信是既有公义有有私恩。\n可以说，梅屋是举万贯家财在经济上无条件支持伟大的辛亥革命，并在孙先生逝世后斥资打造并捐献了4尊国父铜像，去过南京中山陵、广州的黄埔军校旧址和中山大学、以及澳门国父纪念馆的朋友应该都见过。\n所以【东京改变中国】不是一句空话，希望订到松本楼，一睹百年前的绝代风华。\n线上闭门讨论课：\n"}, {"year": 2023, "month": 12, "day": 31, "text": "今年因为「生命哲学」班、「思想食堂」课和「修心之旅」游学，认识了上百个新的老师和朋友，我们共同经历的一些事让我印象深刻，可能我们彼此构成了各自2023的一小部分。还有一些老朋友又经历了更多共同的旅程，这些朋友和我共同游历的地方甚至超过了我的家人。也有些老朋友很久没见，但还能在手机上相望于江湖，也未尝不是一种好事。分享今天傍晚，一家人在湖上欣赏日落，这一年就算过去了。只能说不是所有“微信好友”都能看到这张照片，感谢你们的支持。2024一起加油\n—— 2023年 · 共241篇 ——\n2024\n"}, {"year": 2024, "month": 1, "day": 5, "text": "新年已经计划好的几趟游学，行程安排非常好，老师也确定，最大的不确定因素还是筛选后能同行的人数。如果你能提前模糊预定，就是帮助游学成行，我们感谢你，也会实实在在给足诚意。预定通道https://j.youzan.com/3157vd一哥本哈根生艺术节；\n生与克尔凯郭尔故居；\n维的教育思想；\n民众学院体验公民教育；\n名的克伦堡、乐高世界参观。\n"}, {"year": 2024, "month": 1, "day": 6, "text": "今晚。东京游学【看日本，想中国】之前，请马国川老师给散落在美国、新加坡，深圳、上海的同学们线上授课，讲述他的日本三部曲和这次游学之宗旨要义。\n马老师非常慷慨地给每个同学签字并盖章了【国家的】《启蒙》《歧路》\n《重生》三本书。这套日本三部曲只是马老师十多本人文著作的一小部分，但却不容置疑地成了他的代表作。从启蒙到重生，写了5年。\n5年前，马老师在杭州（图4-6）雷颐老师的课上就提出了主题“看日本，想中国”。只是没想到，这趟游学竟等了5年。\n陈是草无遮觉\n"}, {"year": 2024, "month": 1, "day": 7, "text": "今天，哲学班王雷泉教授提前开讲《了凡四训》。去年有食堂的老同学得知生命哲学班以后，极力向我推荐她喜欢的王雷泉教授，说王老师的笑特别治愈，其声如雷，其甘如泉。坐在讲台上就是个“弥勒”。\n遗憾没能参加，分享杭州同事现场照片，有1期班同学和思想食堂老学员从上海、山东、广东和其他城市赶来参加。\n了凡这本小册子是每个中国人应该读的一本“名人自传”。白话版2个小时就能读完，但其中关于“知命”和“改命”的生命道理和君子哲学，值得老师半生研究，也值得同学们千里超迢来求索。\n这堂课今年还会在浙大校园里给3期班专门讲，2期班同学也可以来补\n"}, {"year": 2024, "month": 1, "day": 10, "text": "排队值机。为期一周的【东京游学】即将开启。这是一趟非“风花雪月岁月静好”的硬核游学。这次游学最值得期待的，是与中日两国的多位学者一起，走近历史现场，感悟福泽谕吉、大限重信、涩泽荣一和吉田茂这几位日本近现代关键人物的历史抉择。游学旅程不能没有书，因马国川老师的日本三部曲大部头已经提前发到家，另在孔夫子网搜罗了一批刘军宁老师的书，分9个店下的单，还有两本没到，但人手1本是够了。\n北京市·北京大兴国际机场-4F值机大厅\n"}, {"year": 2024, "month": 1, "day": 12, "text": "【三艘船的故事】从日本人为美国“侵略者”佩里登陆纪念公园重新上车，\n沿着海岸公路穿行，又一次在山海之外远远地看到富士山。脑子里却突然浮现出一个没听说过的故事，姑且就叫三艘船的故事吧一第1艘是英国的五月花号，这艘船上诞生了美国，开启了整个人类寻求精神自由的伟大征程。\n第2艘是美国的佩里黑船，这艘船敲开了日本的国门，催生了明治维新，\n开启了日本的现代崛起之旅。\n第3艘是中国的定远号，这艘船载满沉重的苦难与无知，撞在前两艘船孕育出来的技术、文明与武力之礁，沉沉坠入大海。\n"}, {"year": 2024, "month": 1, "day": 12, "text": "此刻，吉田茂故居里的思想食堂。这可能是【第一次】由中国老师在日本前首相家里授课。能得到这样的机构信任和支持，首先是有赖于刘老师的学术声誉，和本地诸位老师的指点和引荐，也离不开思想食堂8年来的所办的课程和游学事迹，为此也略感自豪。\n刘军宁老师在国内是政治学界领军人物，可惜他个人因为很奇特的原因不能在高校担任老师。可能他也没想到，在这个阳光明媚的冬日，和世界各地赶来的故乡人，一起坐在这个窗外有富士山的房子里。\n《麦克阿瑟与吉田茂：美国对日本的改造&日本政治家的智慧》\n#思想食堂2024东京游学\n#看日本想中国旧吉田茂邸\n"}, {"year": 2024, "month": 1, "day": 13, "text": "【痛苦不可避免，磨难可以选择】6点下楼，在日本天皇住所外陪马拉松选手春光大哥和他的儿子晓东兄跑步，也借此机会看看东京核心的清晨。\n春光大哥的海外跑步生涯始于哈佛游学，在麻省的剑桥，查尔斯河畔，那也是村上春树曾经跑步的地方。\n后来我们一起在德国波恩、弗莱堡、魏玛也跑，在浙江大学国内的杭州、曲阜也跑，还有一次在杭州北高峰跑山到南高峰。从波恩开始，他的爱人彩霞姐也会一起跑，而且也成了马拉松选手。于是，跑步成了游学和哲学班的早班课。\n每次跑步都会想起春光大哥喜欢的村上的跑步名篇《当我跑步时，我在谈什么》，村上说他跑步的时候就是跑步，其实什么都不想，又什么都想一下。他还有句名言：痛苦不可避免，磨难可以选择。\n"}, {"year": 2024, "month": 1, "day": 13, "text": "citywalk\n"}, {"year": 2024, "month": 1, "day": 13, "text": "在大【儒商】涩泽荣一故居纪念馆楼上的会议室里上课，请日本著名经济研究员津上俊哉先生也给大家讲讲日本学者如何“看日本，想中国”。\n津上老师现在是日本国际问题研究所的客座研究员，曾是日本经济产业部门官员，也是前驻中国大使馆经济参赞，所以他算是中国的老朋友了。老北京，中文非常好，他很多年前写了一本畅销书叫《中国崛起：日本该做些什么》。自疫情开始，他也好多年没回中国了，看到来自中国这些好学的企业家，特别开心，从中午和大家一直不停地交流。\n这次课在涩泽荣一纪念馆上，也是别有一番意义。涩泽荣一即将替代福泽谕吉，成为一万日元纸币上的新头像人物。他是日本近代史上最著名的实业家，19世纪末20世纪初创办了500多家企业和600多个社会组织，被誉为“日本近代资本主义之父”。他提出的“经济道德合一说”源自于他对中国传统儒家文化的热爱和实践，他的著名经营哲学著作《论语与算盘》\n是稻盛和夫和松下幸之助的精神之源。\n"}, {"year": 2024, "month": 1, "day": 14, "text": "昨天和津上俊哉老师晚宴，拔草孙中山和宋庆龄结婚的地方【松本楼】。\n这栋楼的主人梅屋庄吉，马老师课上说他其实是辛亥革命最大的赞助人，\n是个被国内严重忽略的国际朋友。\n他是日本影视大亨，创办了著名的日活公司。他也是孙中山先生的结拜兄弟，一生为他的中国哥哥募资无数。\n梅屋的人生轨迹跌宕起伏，生在明治维新元年，从小被富商领养，5岁钓鱼落水差点淹死，10岁独自携巨款坐船旅游，14岁率领黑套袖对抗白套组，15岁独自上海流浪，19岁逃出海上火灾。\n梅屋从小家境殷实，仗义疏财，好打抱不平，乐善好施，替穷人立墓碑。\n20多岁血气方刚经商失败，背井离乡，辗转到香港开设照相馆谋生，一边赚钱一边继续资助身边人，他夫妻收养了许多孩子，有文章说他们还曾孙中山秘书戴季陶和日本女友的孩子，后来那个孩子由蒋介石给取名，叫蒋纬国。\n"}, {"year": 2024, "month": 1, "day": 15, "text": "镰仓真是个让人舒服的日本古城，有山有海有大佛，离东京足够近，又有着足够的历史痕迹，同时还有《灌篮高手》《海街日记》《镰仓物语》这样刻入无数人青春记忆的流行文化。\n镰仓大佛的大殿地基和屋顶被地震震坏，又被大风吹走，就这么露天端坐着，远望很庄严，近观有微喜，在蓝天绿树下让人自然亲近。\n雪虎在大佛前和同学们分享了日本佛教和中国的源流，以及各个时代的佛教和政治的关系。时间足够，天也足够好，午饭前顺道又去长谷寺去拜了观音，大殿供了一尊日本最大的木雕观音像。\n在山上透过树林眺望著名的江之电火车穿越在山海之间。念诵一句《心依波若菠萝蜜多故，心无挂碍无挂碍故，无有恐怖日本·詹·嫌食大么(高德院)\n"}, {"year": 2024, "month": 1, "day": 16, "text": "经过一个多月的回访和答疑，生命哲学三期班招募工作【即将关门】。和前两期同学构成一样，这次筛选出的同学也以企业家为主，同时有艺术家、教授、投资人和公职人员，90%本科学历，50%研究生学历，有30%左右拥有长江、中欧和北大清华复旦等名校总裁班、国学班学习经历。平均年龄40～45岁，无疑又是值得期待的一场相遇，大家的职业、资产、年龄各不相同，但有三点一定相同一1，拥有阅读经典哲学文本的的基础2，确认来杭州浙大的校园现场上课3，愿意分享、交流自己的生命思考以上3条也是我电话中委婉劝退部分同学的主要门槛。今天再推送一篇刘擎老师的文章，很感谢刘老师去年在哲学班上过课后向他身边的哲学爱好者朋友生命哲学班。\n向刘老师致谢刘擎：我内心有个很强的意愿，要过自己喜欢的生活\n"}, {"year": 2024, "month": 1, "day": 23, "text": "五一小长假【中亚游学】继3年前的伊犁游学和2年前的敦煌游学，继续跟随于哲老师，正式挺进乌兹别克斯坦，开启中亚游学。本次游学最大看点是于老师口若悬河、史诗般的历史脱口秀，可以预见的必然的十分欢乐，价格友好，尤其适合亲子同学。\n晚上：在艺术假生用候，体验民\n"}, {"year": 2024, "month": 1, "day": 24, "text": "今天在家附近新开的图书馆办公。主要任务是给【生命哲学】3期班的同学做电话回访和答疑，也有有课程和游学的联络、对接工作，不论是和新学员还是老朋友的交流，无不令人愉快。中间随手在书架上抽到一本《生命是什么》，作者竟是大名鼎鼎的薛定谔，就是那只猫的发明者，得了诺贝尔奖的量子力学奠基人，和爱因斯坦一起被誉为20世纪最伟大的两位科学家。\n至于大物理学家如何解释“生命是什么”我还没摸到门，刚读到染色体部分，要读完，似乎要费些脑筋；要读懂，可能是无望了。书末有个他自己写的《个人小传》令我着迷，行文简明扼要、幽默十足，尽显大家风范。\n他的自传开端也别出心裁，直接回忆他和挚友的生命沉思经历，他写道“多少个夜晚，我们来回漫步在格鲁克街和施利塞尔街上，在哲学的思辨中流连忘返。当时我们并不知道，我们自以为独出心裁的观点，早已在那些伟大的头脑中盘桓了千百年。”后面又有一句回忆另一些朋友，他如此感叹—“很遗憾，我们现在因为世界观不合而在这个世界失去了联络。”有趣至极。\n· · ·\n"}, {"year": 2024, "month": 2, "day": 4, "text": "京都游学，第5期。这一次终于赶在樱花盛开的时候。请中文先生《碧岩录今释》作者胡起起老师全程授课。4.4-10日，用一周时间将集中体验僧人酒吧、方丈茶席山崎原厂、祗园艺使花下徘句、古都温泉一次学透“禅茶一味”源流：荣西、一休宗纯、村田珠光、千利休、隐元隆一次遍览日本禅门三宗：\n临济、曹洞、黄檗樱花翩跃，禅韵悠悠春和景明，一期一会学之旅（樱花季）\n"}, {"year": 2024, "month": 2, "day": 9, "text": "去放开门炮正式进入龍年时间，祝朋友们开门红。\n"}, {"year": 2024, "month": 2, "day": 14, "text": "生命哲学祝福你，新年多多爱智慧，多多与“爱智慧”的人相聚，因为鲜为人知的毕达哥拉斯第二定理表明：爱智者，即财神。\n"}, {"year": 2024, "month": 2, "day": 14, "text": "观自在菩萨行深般若波罗蜜多时，照见五蕴皆空，度一切苦厄。。。\n"}, {"year": 2024, "month": 2, "day": 21, "text": "【3期班开学】排在二月底的这个周末开学，恰好是正月十五。意外的是，请假的同学并不多，很多同学提前定好了酒店，从四面八方赶来一起过元宵。哲学班办了3年，终于可以第一次安排线下开学活动，早春的杭州是美丽的，醒目的，第二天将避开人流，带同学们体验班务组团队最喜欢的那部分杭州，也是这座城市最具“生命哲学”的部分。\n"}, {"year": 2024, "month": 2, "day": 22, "text": "起师：禅是不可言说的，也是大可言说的。当你说禅是不可言说的，便已为禅设置了一个束缚，而禅是不受任何束缚的。死守不立文字的教条，决非禅的本意。同样，死守南禅北禅之别，认为顿悟比渐修更高级的人，也同样会陷入法执自缚而不知的境地。\n胡起起：禅是自由的、活泼泼的、惺惺然的|京都游学（樱花\n"}, {"year": 2024, "month": 2, "day": 24, "text": "3期班开学。下着点小雨，甚好。\n杭州市·浙江大学（紫金港校区）哲学学院\n"}, {"year": 2024, "month": 2, "day": 25, "text": "今天在人迹罕至的大慈山（虎跑公园）举行三期班【开学特别安排】仅邀请和接收了20位左右同学和朋友参加。上午参访弘一法师纪念馆，献花舍利塔。山里很冷，公园里有个古色古香的宋宴餐厅，温暖雅致的饭后，\n移步梦泉茶堂，哲学班执行负责人雪虎老师正在分享他准备了三年的【弘一法师的生命提醒】课。\n这一课融合了思想食堂·修心之旅人文课程8年实践的生命感悟，也算是生命哲学班三年课程的行动指南之一。\n一个世纪前，民国世家子弟、文艺顶流李叔同在杭州定慧寺（也叫虎跑寺，现在的虎跑公园）出家。从那一刻起，世间博学多艺的才子李叔同就死去了，弘一法师获得新生，成为学生丰子恺所言一个“做得十分像人的中年李叔同为何走出家门，永不再回？他的“中年转身”以及生命境界又给世俗中你我有何启示？又如何做一个“十分像人”的人。\n杭州市·虎跑公园-弘一法师舍利塔\n"}, {"year": 2024, "month": 2, "day": 26, "text": "吃一碗好面，要花一顿面的功夫。但吃一碗“心里想的”好面，要花一晚上准备，再花一天功夫爬山。韬光寺的面，吃完再推一次，来杭州的朋友有时间又不想见人的时候不妨来试试。\n杭州市·韬光寺-观海楼\n"}, {"year": 2024, "month": 2, "day": 28, "text": "半个多世纪以来，全世界的青年都爱黑塞。中国青年接触的晚一些，但也正是时候。他是一位揭示生命意义、为追寻自我引路的文字魔术师。遗憾的是他的識言总是在商业驱动下被掐头去尾，像一群来历不明的幽灵弥漫在芜杂的闹市里。\n黑塞：对于人来说，最大的职责就是找到自己\n· · ·\n"}, {"year": 2024, "month": 3, "day": 2, "text": "【阳明先生小游学】本月中为二期班同学补办阳明先生的生命哲学课。请到董平老师授课，董老师早在十几年前的《百家讲坛》讲阳明心学，那时候的先生之学还是一股“为己之学”的清风。\n值得一提的是这次课的场地——稽山书院。这个鲜有人知的千年书院太有故事了，先由北宋名臣范仲淹（副总理）创办，鸿儒必至，相传朱熹就来过，传到阳明先生，成为他主要的讲学之地。阳明先生推崇书院文化“匡翼夫学校之不逮”，是补救官学的核心课堂。\n话说回来，其实哲学班的班风颇像阳明先生为稽山书院立下《稽山会约》：“立真志、用实功、涤旧习”。关于哲学班，我记得他老人家应是遥遥有段嘱咐一“为学，不可离群索居，不可一曝十寒，不可独学无友。”所以，这场特别安排机会难得，也欢迎1期和3期同学参与。\n稽山书院求师，咸亨酒店会友。\n生命观照\n"}, {"year": 2024, "month": 3, "day": 7, "text": "据永恒的青年导师王小波考证野史：《射雕英雄传》中的敌国之一【花刺子模】有一古怪的风俗，凡是给君王带来好消息的信使，就会得到提升，\n给君王带来坏消息的人则会被送去喂老虎。\n于是将帅出征在外，凡磨下将士有功，就派他们给君王送好消息，以使他们得到提升；有罪，则派去送坏消息，顺便给国王的老虎送去食物。\n花刺子模的君王有一种近似天真的品行，以为奖励带来好消息的人，就能鼓励好消息的到来，处死带来坏消息的人，就能根绝坏消息。\n千年遗迹花刺子模：希瓦|4.30-5.7，乌兹别克斯坦历史文化\n"}, {"year": 2024, "month": 3, "day": 13, "text": "推荐一篇时代好文：组织里来了眼睛明亮的年轻人，看到了潜规则，却没学会，也不想学-“有几个处长说我瞎出风头，还有个人打来电话说我的文章有问题：第一，其他区县不高兴。碑林区图书馆书目被吹嘘得那么好，反衬之下，其他区县图书馆难道都是烂书目？第二，专家不高兴。不该在文中指出评审条例的问题。第三，文章没有感谢各级领导，过于个人英雄主义。第四，不该指出馆配潜规则。后来，全局还禁止大家在朋友圈转发这篇文章，我要去给一些领导道歉。”我，建了一座没有烂书的公共图书馆\n"}, {"year": 2024, "month": 3, "day": 16, "text": "应是尔心光明的一天课。\n"}, {"year": 2024, "month": 3, "day": 17, "text": "从肃穆之地转身，路过一片早樱，登山入林。空野之地，澄明入心。\n#生命哲学班走进王阳明故里\n"}, {"year": 2024, "month": 3, "day": 20, "text": "1922年，黑塞给茨威格的信中说：“我的圣者穿着印度式的外衣，但他的智慧更接近老子而非乔答摩。.我常常在这一源泉中畅饮。\n李雪涛：黑塞的《悉达多》一证悟中的佛教和中国智慧\n"}, {"year": 2024, "month": 3, "day": 21, "text": "【做清明】为什么叫「扫」墓？小时候不懂。因为那时候先祖们的墓前总是被大人们在一片欢声笑语中弄的平平整整，我们一群族中的小孩主要负责扛个鞭炮，拿袋纸钱漫山跑，到了坟前通常也不认真听讲，只记得是一边磕头，一边听着大人们在背后高声念叨保佑读书聪明、考上大学云云。\n长大后就很难凑上大部队了，一个人来，每次也总要盘桓半天，坐在黄土上，脑子里想一想先人们白手起家的事迹，还有他们生前常常对未来的念叨。比起他们还在的时候，日子过的比原来好多了，可似乎也并没有比原来更快乐多少。\n反倒是这山上，空气好，风光也好。真是个好地方。\n"}, {"year": 2024, "month": 3, "day": 23, "text": "此刻，杭州同事在西溪湿地举办许志强老师的文学课【个体觉醒与自我追寻】。文学线下课的市场尚在开发培养中。为节省成本，这堂极具「理想主义」色彩的课原计划是要在许老师的浙大研究所里上，仰仗思想食堂老朋友的空间支持，得此春色如许。场地的名字叫“儒可墨可轩”，典雅又清文学经典赏析课\n"}, {"year": 2024, "month": 3, "day": 29, "text": "明天哲学班3期【杨立华老师的儒家精神】课调整到大报告厅，座位充足，去年有遗憾的同学有福了。我一直以为杨老师是无需介绍的，但也确实有部分过去专攻西哲的同学不是很了解他，特发一张我个人最满意的杨老师照片，这是他去年给二期班讲《庄子》时，我在座位上仰拍的，藉此也重温杨子逍遥磅礴之气。\n杨立华老师简介：现任北京大学哲学系教授、博士生导师、人文社会科学研究院院长，北京大学研究生院副院长。是中国哲学史、儒学、道家与道教、宋明哲学及魏晋哲学研究领域公认的大家。\n杨老师专著一\n《思诚与见独之间：中国哲学论集》\n《庄子哲学研究》\n《中国哲学十五讲》\n《一本与生生：理一元论纲要》\n《宋明理学十五讲》\n《中国儒学史》\n《郭象《庄子注》研究》\n《气本与神化：张载哲学述论》\n《匿名的拼接：内丹观念下道教长生技术的开展》\n杨老师译著一\n《王弼《老子注》研究》\n《近代中国之种族观念》\n《宋代思想史论》\n《章学诚的生平与思想》\n《帝国的话语政治》\n2011年被评为“北京大学十佳教师”\n2017年入选首届“北京市青年教学名师”\n· · ·\n"}, {"year": 2024, "month": 4, "day": 1, "text": "第一次不需要提前向院长提交身份证号就直接进了校园，为北外率先重新向世界开大门点赞。北京的朋友有时间可以来逛，这里有个资料详实可以互动的世界语言博物馆，也不需要预约。\n北外展史学WORLD世界语言\n"}, {"year": 2024, "month": 4, "day": 8, "text": "世存老师的工作，就是端坐家中，关心世界，但他更善于倾听自己。因为没有单位，所以不用开会，他把肺腑之音写成书，一本是一本，振聋发\n《重建生活》\n《世道与人心》\n《盗火与革命》\n《安身与立命》\n《先知中国：巨变来临，我们如何自处》\n《非常道：1840—1999年的中国话语》\n《人间世：我们时代的精神状况》\n《大时间：重新发现易经》\n《老子传》\n《家世》\n《东方圣典》\n《自省之书：中国原典的当代精神》\n《己亥：余世存读龚自珍》\n《打开金刚经的世界》\n.\n余世存20多年的宅家躺平历史真正成功的人，内心部有弹性\n"}, {"year": 2024, "month": 4, "day": 11, "text": "圆明园马首在没有佛像的正觉寺，金岳霖故居（图4）在没有门岗的燕东\n"}, {"year": 2024, "month": 4, "day": 11, "text": "胡泳老师讲述为96岁父亲送终、照护85岁患阿尔茨海默病（俗称老年痴呆）的母亲：今天你可能风华正茂，但是你早晚都会遇到。。。\n这个世界有关养育和成长的东西很多。养育和成长代表着生命的曙光阶段，是向上的，美好的东西都在你的前方。大家乐此不疲地看这些东西。可是，有关照护的东西，大家关注得太少，被表达得也太少。而照护的时日，有时甚至长过养育和成长的时光。这是我愿意出来分享的原因。\n当一位北大教授成为24小时照护者\n"}, {"year": 2024, "month": 4, "day": 16, "text": "三期班同学，学哲有余，在文学课上找到她的【生命哲学】密码：\n“大部份的人，就像是一片落叶，随风飘荡，随风飘转，摇曳不定。最终跟跟跎跪落到地上。但也有极少数的人，像是天上的星星，沿着固定的轨道运行，没有任何风可以影响到他们，他们自身之中有着他们的法则和他们的轨道...\"”我们中的大多数人，包括我自己，既是落叶，也是星星，在不同的人生阶段或者不同的情境里，以不同的形态去经历着自己的成为自己—《悉达多》读后感|OD料理机160期\n"}, {"year": 2024, "month": 4, "day": 18, "text": "推荐一本妙书。银河老师的编辑说，李老师是个美好的人。\n我的生命智学\n"}, {"year": 2024, "month": 4, "day": 22, "text": "这周末的一场好课，怎么形容其好呢？综合思想食堂老朋友们去年在不同地方的听后感，大意如下：王雷泉老师的《心经》课，值得从世界任何角落飞回来聆听。王老师和《心经》都是第一次在哲学班开讲，这也是3期班第3次相聚，期待再见。\n中的生命智慧\n"}, {"year": 2024, "month": 4, "day": 24, "text": "【读书日谈哲学班】今天是生命哲学班1期班开班2周年的日子，也是他们可爱的灵魂毕业一周年的日子。今天还是2期班的超级学霸同学回归班级群的日子，这位学霸同学读书太多，多到没朋友的那种多，30多年前已是经济学副教授下海的他，从不炫耀商海功绩，参加哲学班的初衷是继续沉淀平生读书所学以成一家之言，著书立说，顺便以文会友。\n一起同学的一年，他孜孜不倦以坚持每日朗声读书、随时现身群内以知无不言言无不尽地帮助同学为乐。何曾想山高偶遇云薄，英雄难觅知音，谈兴既尽，概然退群。他不在的这段时间，群里的同学们偶尔有个话头，交锋三五回合即草草收场。\n今天他被班长邀请回群，群内诸同学一片盛大“心花怒放”式欢迎，有同学更是不吝溢美之词严重告白：“有时候一个人的顿悟，可能只是别人的基本功，而你的只言片语，也许能让别人醍醐灌顶。\n人非草木，这番泼天的文学功底令学霸动容，难得见他在群内一次感性发“读书日回到读书群，是一种应然。感谢班长的邀请，更感谢各位同学的大度。非常希望以读书本身就是目的，营造一个干干净净的读书群，值此乱世，这很难得，也很珍贵。”图片是今天在图书馆拍的，是为记。\n"}, {"year": 2024, "month": 4, "day": 27, "text": "分享王雷泉老师【心经】的传奇故事：《心经》是唐僧翻译的，也是唐僧在取经途中真正的护身符。“途经厄难，恒诵《心经》，在途得免一切艰难危险。”课上掌声不断，难以线上传递。唯有劝君读《心经》，这可能算是我做\n「生命哲学」课所能送给遥远的你最好的礼物一观自在菩萨，\n行深般若波罗蜜多时，\n照见五蕴皆空，\n度一切苦厄。\n舍利子，\n色不异空，\n空不异色，\n色即是空，\n空即是色，\n受想行识亦复如是。\n舍利子，\n是诸法空相，\n不生不灭，\n不垢不净，\n不增不减。\n是故空中无色，\n无受想行识，\n无眼耳鼻舌身意，\n无色声香味触法，\n无眼界乃至无意识界，\n无无明亦无无明尽，\n乃至无老死，\n亦无老死尽，\n无苦集灭道，\n无智亦无得，\n以无所得故。\n菩提萨，\n依般若波罗蜜多故，\n心无挂碍；\n无挂碍故，\n无有恐怖，\n远离颠倒梦想，\n究竟涅。\n三世诸佛，\n乃至无老死，\n亦无老死尽，\n无苦集灭道，\n无智亦无得，\n以无所得故。\n菩提萨，\n依般若波罗蜜多故，\n心无挂碍；\n无挂碍故，\n无有恐怖，\n远离颠倒梦想，\n究竟涅。\n三世诸佛，\n依般若波罗蜜多故，\n得阿多罗三三菩提。\n故知般若波罗蜜多，\n是大神咒，\n是大明咒，\n是无上咒，\n是无等等咒，\n能除一切苦，\n真实不虚。\n故说般若波罗蜜多咒，\n即说咒日：\n揭谛揭谛，\n波罗揭谛，\n波罗僧揭谛，\n菩提萨婆诃。\n生命哲学杭州市·浙江大学（紫金港校区）成均苑4幢\n"}, {"year": 2024, "month": 4, "day": 27, "text": "下午上课前，意外收到签名新书—《科学文明的坐标——沈括》，作者是哲学班3期低调的美女学员她的生命故事也一定非常精彩，期待以后有机会邀请她给大家分享。这本书记载的沈括，有一部大作《梦溪笔谈》，被国际历史学家推崇为中国科技史上的里程碑。\n品来韵康沉馆保略科北之美：\n赠贵社信票仰闲飘：\n作者简介路（见证：便命号\n"}, {"year": 2024, "month": 4, "day": 30, "text": "再出发，将飞6个小时，行走8天。这是一趟在诗人的口中被传为【通往撒马尔罕的金色之旅】的游学。但事实上沿途并不轻松，明天一早还要转飞机，再连日坐大巴长途跋涉，去一系列生活条件艰苦、孕育坚定和幸福之地。比起欧洲和美洲甚至中东，中亚与我们的物理距离和心理距离要近的多，但实际上我们对这块世界文明交汇之地知之甚少，也是典型的“文化灯下黑”现象。\n同行的同学们在机场很兴奋，非常期待这异域的前路漫漫。摘罗新老师翻译的诗句一在杏林丛丛的撒马尔罕在红百合盛开的布哈拉还有，在阿姆河岸的黄沙上缓缓走着带白色缠头的商队由于渴望知道那些我们本不知道的我们开始了前往撒马尔罕的金色之旅<Macao,北京市·北京首都国际机场T2航站楼-国际/港澳台出发\n"}, {"year": 2024, "month": 4, "day": 30, "text": "在塔什干机场附近就近休整，明天还要接着飞，一碗含二两羊肉的羊肉汤下肚
