<style>

  }

    font-family: var(--font-cn);

  .hero {

  /* Year timeline */
  .year-nav {
    position: sticky; top: 64px; z-index: 100;
    background: var(--white);
    border-bottom: 1px solid var(--border);

    overflow-x: auto;

  }
  .year-nav-inner {
    max-width: 1280px; margin: 0 auto;

    flex-shrink: 0;

    font-size: 0.9rem;

    transition: all 0.2s;

  .year-btn:hover { border-color: var(--accent); color: var(--accent); }
  .year-btn.active {
    background: var(--accent);
    color: var(--white);
    border-color: var(--accent);
  }
  .year-btn .count {
    font-size: 0.72rem;

  /* Search */
  .search-bar {
    max-width: 600px; margin: 0 auto 3rem;
    position: relative;
  }
  .search-bar input {
    width: 100%; padding: 1rem 2rem 1rem 3rem;
    border: 1px solid var(--border);
    border-radius: 32px;
    font-family: var(--font-sans);
    font-size: 1rem;

    position: absolute; left: 1.2rem; top: 50%;
    transform: translateY(-50%);
    color: var(--ink-muted); font-size: 1.1rem;

  section { padding: 2rem 2rem 4rem; }

  .moment-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);

    margin-bottom: 1.2rem;

    color: var(--accent);

    font-size: 0.95rem;

    color: var(--ink-light);
  }
  .moment-text p { margin-bottom: 0.5rem; }
  .moment-text p:last-child { margin-bottom: 0; }

  .no-results {
    text-align: center; padding: 4rem 2rem;
    color: var(--ink-muted);
    font-family: var(--font-display);
    font-size: 1.2rem;
  }

  /* Back link */
  .back-link {
    text-align: center; padding: 3rem 2rem;
  }
  .back-link a {
    color: var(--ink-muted);
    text-decoration: none;
    font-family: var(--font-sans);
    font-size: 0.9rem;
    transition: color 0.2s;
  }
  .back-link a:hover { color: var(--accent); }

  footer {
    padding: 3rem 2rem; text-align: center;
    background: var(--ink); color: rgba(255,255,255,0.35);
    font-family: var(--font-sans); font-size: 0.85rem;
  }

  @media (max-width: 768px) {
    .hero h1 { font-size: 1.8rem; }
    .hero-stats { gap: 1.5rem; flex-wrap: wrap; }
    .hero-stat .num { font-size: 2rem; }
    .moment-card { padding: 1.2rem 1.5rem; }
  }
</style>

// Load moments data
let allEntries = [{"year": 2017, "month": 11, "day": 13, "text": "这几天接到一些电话，能体会到谨慎的善意与关切。其实这是我职业历程中最漫长但也最难以周全的一次告别，很多话和故事攒着不想说，留着以后下酒，此刻能记起来的都是在通力与你们共历的美好。因为你们的奋斗，我受用过很多国防单位大领导竖着大拇指的溢美之词，甚至能有机会与航天英雄共饮；因为你们的朴素，我也试着坐十几个小时的火车体验饥肠之后的苦尽甘来；因为你们的善良，品尝着邻桌北京老大爷致敬的松鼠鱼，几乎不再计较没有北京户口；因为你们的信任，我也曾看到过最真实的通力人，我们一样收着陈年的理想，偶尔用老酒一杯一杯洗掉烟火熏过的油腻。。。真正的幸运是擦肩而过之前，曾一起走过，哪怕一天。涓滴三年，记忆敌不过时间，岁月把刀收起，留住美好。\n祝福你们，祝福通力。\n"}, {"year": 2017, "month": 11, "day": 21, "text": "#思想食堂长沙#千年岳麓书院选择屈身于没有围墙的湖南大学，让18岁的有志青年住在最昂贵的地段，不问世事地读圣贤书。曾国藩、左宗棠、毛泽东都从这里出发，下一个出发的是谁？是谁并不重要，重要的是总会有下一个。天下没有廉价的学问，只有失败的商业和政治。\n"}, {"year": 2017, "month": 11, "day": 22, "text": "新地盘一起玩\n"}, {"year": 2017, "month": 11, "day": 24, "text": "#日光之下再无新奇#尊师者王骑兵说：“刘邦可不喜欢知识分子，有一次，一个人戴着儒家那种帽子来见他，他拿下他的帽子，就在里面撒一泡尿。跟人谈话，常常破口大骂，\n试。”骑兵等有机会，把郦食其教他的话，说给刘邦。\n刘邦抵达高阳驿站招待所，派人召见郦食其，郦食其到招待所晋见。刘邦正踞坐在床上，有两个美女正给他洗脚。郦食其进去后，仅打一个招呼，\n骂说：“你这个酸货，天下受够了秦政府的暴政，所以各国奋起反抗，你他妈的胡扯些什么？”郦食其说：“既然要集结义兵，铲除无道，就不应该用这种态度接见长辈。”刘邦立刻停止洗脚，起来把衣帽穿戴整齐，请郦食其上坐，郑重道歉。\n柏杨《楚汉之争》\n我们是谁？我们心哪里来Who Are We? Where Did we come\n"}, {"year": 2017, "month": 11, "day": 24, "text": "小分队入场。他们说，思想食堂的上课场地不是有钱就能订到的。\n"}, {"year": 2017, "month": 11, "day": 25, "text": "9年，再听吴思老师。\n"}, {"year": 2017, "month": 11, "day": 26, "text": "朋友（男）说，除了挣更多钱给孩子找个更好的幼儿园，一时也没有什么好法子。在北京，身边同龄人无奈之下每个月要花相当于自己一年大学学费的钱，不图孩子能学什么，只希望他们能在父母不能陪伴的时候也能健康成长。\n庆幸没有送小黄豆去红黄蓝，虽然这个品牌曾经是我重点考察的候选之一。庆幸在他第一个幼儿园出现不适应时我们及时选择了改变，甚至搬家，\n虽然做这一切很艰难，但很值得。小黄豆现在的幼儿园看上去并不那么美好，但学校允许家长每天将孩子送到课堂，或在园内观察、陪伴。这一点要比那些有监控而不给家长看的做法要坦诚很多。\n新同事（女）说，真想带着娃上班。\n调查|现场，家长，专家：红黄蓝幼儿园事件将如何进展？\n"}, {"year": 2017, "month": 11, "day": 27, "text": "15岁上大学；\n29岁当教授；\n35岁当博导；\n50岁下海，用商业布道。费勇老师说：可以做任何你想做的；但不可以要任何你想要的。\n"}, {"year": 2017, "month": 11, "day": 29, "text": "#思想食堂青岛#八十七年前，闻一多先生问“谁信这个现成的海市蜃楼，一百年前还是个荒岛？”然后，老舍先生往返于荒岛书店，在这里写下“在光明中不会觉得寒冷。”再后来，舒乙先生来青岛，用北京话为我们一遍一遍地朗读祥子、二马和茶馆。。。\n有幸在这里听过王蒙、叶嘉莹、周汝昌、顾彬、毕淑敏、迟子建...看过康有为、闻一多、梁实秋、萧红、萧军....和很多人一样，沈从文说，青岛的几年时光是一生中最幸福的时期。\n十年。记忆犹新。\n"}, {"year": 2017, "month": 11, "day": 29, "text": "与无趣的人吃饭，不如与有思想的人聊天。收工。\n"}, {"year": 2017, "month": 11, "day": 29, "text": "饮歌集06我们还有很多梦要做，还有很多明天要走。\n《天高地厚》信\n"}, {"year": 2017, "month": 11, "day": 30, "text": "想把我唱给你听，趁现在年少如花。\n饮歌集07深夜食堂\n· · ·\n"}, {"year": 2017, "month": 12, "day": 1, "text": "你若为锋，谁堪为背。商场江湖，凶险。但凡要仗剑走江湖，不独凭一技傍身，更靠侠义行天下。义，犹如一棱刀背，幸者，有此栖身处。英雄忠义，互为刀背。刀锋指，所向披靡；刀背藏，锋芒俱挡。披肝沥胆，赴大潮；刀剑无眼，兄弟笑。\n"}, {"year": 2017, "month": 12, "day": 2, "text": "他激动，胡雪岩却冷静，很恳切地说：“庆生兄，这二百两头，你今天一定要带回去。钱是人的胆，你有这二百两银子在手里，心思可以定了，脑筋也就活了，想个把主意，自然就会高明。”—《胡雪岩》高阳不同凡响\n"}, {"year": 2017, "month": 12, "day": 3, "text": "临刑前，苏格拉底在牢里教他的徒弟们：“许多人不懂哲学。真正的追求哲学，无非是学习死，学习处于死的状态。他既然一辈子只是学习死、学习处于死的状态，一旦他认真学习的死到了眼前，他倒烦恼了，这不是笑话吗？”—杨绛先生译柏拉图《斐多》\n假如可以，问问自己是否已看透生死|思想书单\n"}, {"year": 2017, "month": 12, "day": 5, "text": "今天你能跟谁谈理想？\n还记得很久前有同事说，不敢跟人谈理想，怕被笑是傻瓜。今非昔比。思想食堂一周岁，吴晓波老师有话说。\n一年开了24堂课，思想食堂12.10这天要做个总结1年终大课\n"}, {"year": 2017, "month": 12, "day": 5, "text": "智慧的对立面是愚蠢，知识的对立面是无知。学习知识可以改变无知，但却不一定能改变愚蠢，许多有知识的人士因没有智慧而愚蠢。——徐责\n"}, {"year": 2017, "month": 12, "day": 7, "text": "欢迎首都领导前来视察。\n"}, {"year": 2017, "month": 12, "day": 9, "text": "有些真相可能永远没有人会告诉你。比如说大学里会教《企业管理》\n《工商管理》、《人力资源管理》，却不会直接开设一个总统专业，或者哪怕村长专业。空旷的冬天，有少数人在跟姜鹏老师学皇帝（BOSS）教2017.12.9鹏1《资治通鉴》里的修齐治根块一初识（通鉴）\n"}, {"year": 2017, "month": 12, "day": 10, "text": "为什么那么多有知识的人仍然会做蠢事？|思想食堂2018年\n"}, {"year": 2017, "month": 12, "day": 10, "text": "激动了，几度失语，老板说：今年做了很多事，有很多也没什么意思，思想食堂可能是最有价值的一件事。\n在这个喧嚣的时代，还有一些人甘于坐在书斋中，思考着这个民族和国家的未来。我们这些思想者的课时费用远低于做生意的人，是这个时代的耻辱。—吴晓波\n"}, {"year": 2017, "month": 12, "day": 11, "text": "一个人，赚了很多钱之后，接着会做什么？\n一个是继续赚钱，看看这辈子到底能赚多少钱；一个是，看看能不能把钱换成一些时间，用一些“另外的东西”来填满这些时间。\n可能是哲学，可能是宗教，可能是音乐，也可能是旅行，甚至对一些女生来讲可能是爱情。思想食堂就是这样一个“另外的东西”。\n吴晓波：如果这个世界由金钱构成，那是很可悲的|思想食堂\n"}, {"year": 2017, "month": 12, "day": 12, "text": "“60岁思想抛锚了，追求物质和金钱。看他们就住豪华的房子，坐豪华的车，个人还买私人飞机，我也追求像他们一样的生活，这思想就变了。”云南省委原书记白恩培《永远在路上》\n王健林的滑铁卢【虎嗅网】\n"}, {"year": 2017, "month": 12, "day": 12, "text": "一次直击人性弱点的复盘会议。在此刻的思想食堂，相较于业务的发展，\n团队的成长更重要。\n作为“思想”相关的内容从业者，在以思想之名拷问时代的同时，先拷问自己。或许我们要在自己身上揭开一个时代的伤疤。希望每一位善良真诚的小伙伴都如罗曼·罗兰所说的那样，在认清生活的真相后依然热爱生活。\n能加入思想食堂，为可能是全国最好的会员客户服务，我们都是得到命运垂青的好青年。\n"}, {"year": 2017, "month": 12, "day": 12, "text": "男儿一生要经过，世上磨炼共多少。\n饮歌集008《大丈夫》\n"}, {"year": 2017, "month": 12, "day": 14, "text": "第三年，新课表1.0\n"}, {"year": 2017, "month": 12, "day": 15, "text": "十年，历史在身边。\n2008-2018上我们一起，为梦想空\n"}, {"year": 2017, "month": 12, "day": 16, "text": "我之所以坚定地相信未来是我相信未来人们的眼睛她有拨开历史风尘的睫毛她有看透岁月篇章的瞳孔饮歌集009《相信未来》\n"}, {"year": 2017, "month": 12, "day": 17, "text": "从毕业到现在，还剩下几个纯粹的朋友？\n没有经济纽带，不为商业合作，也不谈项目机会。歇一天不做职业经理人、企业主、投资家、律师、法官....不担心世界瞬息万变。\n思想食堂北京分会有一个小小的约定，今天的话题，12个月后再继续。\n感谢甘美女创造契机，宜璞姐操持，亮非姐主持，孟兄照料，让温哥、郭丽君、曹居士、何老、黄兄、吉吉兄千里相聚，听到了隐于民间的京剧名角儿萧遥姐的《牡丹亭》。真好。\n度已度人，思想外溢。\n"}, {"year": 2017, "month": 12, "day": 19, "text": "那时候的中国人，个个都强悍好战，连吴越地区，也就是今天江浙上海地区，都是非常尚武的土地。那时不论男女，皆以高大健硕为美。当时的贵族，都能下马能文，上马能武，侠客遍地，武士横行，一言不合，就拔剑为什么说商鞅变法彻底毁了中国人？\n"}, {"year": 2017, "month": 12, "day": 20, "text": "阳光。咖啡。思想。\n杭州·星巴克(金逸影视店)\n"}, {"year": 2017, "month": 12, "day": 24, "text": "谈及芳华，朋友挪输我，大腿好看吗？好看，几秒钟的大腿赚我们看了2小时，忍受着许多的痛苦。\n我看到的《芳华》讲述的是一群青年人集体度过青春的故事，因为有彼此的共历与惦记，今天的老人们忘记了那个时代的苦，只怀念起曾经成就彼此的时光。那段时光，是他们共同的芳华。没有好人与不好的人，没有雷锋，只有刘峰和刘峰的朋友们；选择善良，是主动铭刻芳华的一种。一时丢失了善意，并非有意为恶，及至追忆芳华，令人晞嘘。\n最痛莫过于在美好的时光没去做美好的事。青年、壮年、老年....哀莫大于心死，每一段芳华都会逝去，我们希望它来，希望它留，希望它再来。\n"}, {"year": 2017, "month": 12, "day": 24, "text": "世上有朵美丽的花那是青春吐芳华饮歌集010《绒花》\nMERRYCHRISTMAS\n"}, {"year": 2017, "month": 12, "day": 25, "text": "20个月前，吴老师说：两张“饭票”表明我们还不够努力，还没有把应该讲清楚的事情说出来和做出来。如今，来自全国各地2000多名会员告诉他，我们可能做了一件最有价值的事。高质量思想应有一个好的“商品价格”。感谢大家的支持，思想食堂会风雨无阻地开出来，办下去。\n晓波邀请入思想食\n2018年的学习\n2018年1月起涨价至6000元现在加入4800元\n"}, {"year": 2017, "month": 12, "day": 29, "text": "出发。小伙伴要去留学，今天是她在思想食堂的LASTDAY。希望她带着思想食堂赋予她的能量，轻装上阵，一切如愿。希望她能记得上一次谈起思想食堂，我们用掉了半包心相印。那是一次计划之外的尝试，来不及准备任何套路，你一言他一语，声声入耳，句句在心。我们曾这样说一那种感觉，就像第一眼看到时就很喜欢，然后有一天居然就牵到了她的手。@吴晓波频道小长老每次新的老师开课，都会自己掏钱买两本老师的书，请他签名，然后收藏。这个小小的坚持，是我向自己表达对这份事业态度的一种方式。@坦诚而克己的90后男子这里有一位像爸爸一样的领导。@超级合唱天团95后妹子在这里，我偶尔有过几次真切感受到了那种感觉：这是一份能真正把自己的过去、现在、未来连接起来的工作。@90后帝系一姐为什么没有听妈妈的话去外企？因为我们的社会责任感，不能在这个社会消失。@90后侠系小仙女我一直在纠结这个事有没有原罪？后来我想明白了，救死扶伤的医院也要向病人收费，思想食堂没有原罪。于是，我选择留下来。@为爱南下的北在新的城市做新的工作，其实一开始并不喜欢。若不是思想食堂，真就回上海了。@80后知心姐姐只想好好的有个周末。@80后重度佛系撰稿人其实我搞错了，刚开始还以为是吴秀波。（鬼脸）后来，就不想走了，同学们都羡慕我。@爸爸喜欢科比的全能妹子大家都需要我的感觉，真的很好。@想哭的95后实习生从业十多年，从未见过这样的团队会议。@组织部新来的老司机这份工作其实是像自己的孩子一样。@80后创业辣妈这些年，这个世界一直欠很多老师一张饭票。@80后理想主义青年我们站在十字路口，知道什么是对什么是错，但我很羞愧没有选对的那条路，因为那条路很难走。现在这个年轻人很勇敢，他选了不好走的那条路，他是对的，我们要保护他，让他走下去。@偏爱阿尔·帕西诺的恶之\n—— 2017年 · 共35篇 ——\n2018\n"}, {"year": 2018, "month": 1, "day": 1, "text": "又一年大好青春。希望和朋友们一起做点事，做点自己觉得很美好的事，\n身边的朋友觉得也不赖。就好。\n"}, {"year": 2018, "month": 1, "day": 1, "text": "摘一段给老朋友们：\n中国美的员工11万，海尔6万多，而郭台铭在中国雇了130万员工。\n三年前，他曾说，我们打算在未来五年内，用一百万机器人替代生产线上50%的产能。为什么？因为中国的劳动力成本不断抬高，当库克请他生产手机时，其价格还在往下压，中国的手机行业已经饱和，IPAD、苹果电脑也在饱和。这边是劳动力成本上升，那边是终端品牌商对其压价，只有一个办法—告别中国人口劳动红利。\n2017年富士康集团生产线机器人增加了4万台，到了4万台，40万台就很快被实现了。在过去的几年里，以机器人为代表的工业4.0或生产线的智能化革命，在未来的2018年、2019年，会成为非常蓬勃的景象。\n吴晓波：预见2018（演讲全文整理）|吴晓波年终秀\n"}, {"year": 2018, "month": 1, "day": 1, "text": "#第一弹#从今天起，思想食堂正式调价为6000元，包含24张线下听课券+线上的视频观看权限。\n2018.1.1-1.7，思想食堂×美好的店，新年第一波福利放送。\n只要在这7天加入思想食堂，就可获赠价值1000多元的美好礼品。\n礼品一：吴晓波×梁文道x孙冕，三位文化人出的三样酒，总共就2000份（思想食堂抢占了一批），价值666元，不过要1月中旬才能发货；\n礼品二：西冷印社的心经沉香套装，价值450元or「上下」幸运红绳转运珠手链，价值500-750元，下单后即可发货。\n礼物可还趁各位同学的心意？\n笔善江湖吴晓波邀请你加入思想食堂与2000余名智职精英一同\n"}, {"year": 2018, "month": 1, "day": 2, "text": "不转型是等死，转型是找死？1月13日，思想食堂请国内企业转型实战专家陈雪频、刘润，为大家讲解企业转型及互联网化之道。速约，上海见。\n这些问题不搞清，企业转型不可能成功|思想食堂\n"}, {"year": 2018, "month": 1, "day": 3, "text": "曾经你一说起梦想总是这个句型：一定要让_过上好日子。现在你总有有几个车，几个房子，几百几千万。你，过的好吗？\n吴晓波：我给彩虹合唱团写了一首歌\n"}, {"year": 2018, "month": 1, "day": 4, "text": "#会员原创#皇帝BOSS教科书《资治通鉴》里的一个经典程式：自己比较二，然后被外人坑、被老婆坑、被儿子坑。。。\n楚怀王为什么是战国第一糊涂蛋？|今日读史\n"}, {"year": 2018, "month": 1, "day": 7, "text": "意外机缘，有幸聆听林谷芳先生。略过窗外高楼，看着林先生穿过课堂，\n从讲台迎面走来，白衣浩气如一座高山缓缓近前，山高无阶可攀，有缘人能看到山门。\n围炉烤橘，先生说做文化的事，第一年第二年用力是正常的，如果第五年还要用力，那就一定出错了。\n感谢廿一文化团队用心坚持，今天得以沾到仙气。\n"}, {"year": 2018, "month": 1, "day": 10, "text": "可以正式答复复旦新闻研究生朋友写毕业论文的问题了。现场1500人+线下同步35个城市50家咖啡馆直播；线上直播点击48570000人次；\n100家媒体；200篇报道；媒体曝光67390000人次，覆盖近70000000新中产#年终秀传播数字公布#理波车终秀“预见2018”吴晓波年终秀，交出了这样一份成绩单\n"}, {"year": 2018, "month": 1, "day": 12, "text": "马云、马化腾、李彦宏的生日和BAT创办时间有什么秘密？明天上午陈雪频老师会在课上公布答案。然后，做产品还是做平台？明天下午听听刘润老师的建议。\n上海·新华联索菲特·LEBAR.乐吧大堂酒廊\n"}, {"year": 2018, "month": 1, "day": 13, "text": "乞力马扎罗山没有回头路，7天时间10名朋友登顶，然后一起抱头痛哭；\n1名朋友登不上留在山脚独自抱头痛哭。我们看到成功与失败，62名护送他们上山的本地挑夫看到的都是体能弱者的悲情。\n上海·新华联索菲特大酒店(上海虹桥店)\n"}, {"year": 2018, "month": 1, "day": 20, "text": "和思想食堂的会员一起请到孙老师给我们讲故事，唱歌给我们听。他说，他快乐。你听，你快乐。看他65岁的快乐，\n本无我们无关，却感染身边5米内的一切人，无需商量，无止无尽。\n"}, {"year": 2018, "month": 1, "day": 22, "text": "记得08年的一个冬夜，在北大法学院，一群有“身份”的人，也是一群血气方刚的青年人，为了捍卫北大的声誉，在“言论自由与公共理性”的探索中，终于搂不住争论起盗画事件，各种情节还原，各种知情人现身，真相却扑朔迷离，只记得有人在那个圆桌会议厅高呼了一句意料之中却又情理之中的话：“把他轰出去”。。。理性，又一次在个体自由的美好想象与集体哗动中失控#人间的风骨走一个少一个#季羡林：深到骨子里的高贵，是没有身份感\n· · ·\n"}, {"year": 2018, "month": 2, "day": 11, "text": "万事开头难，其实开头之后，每一步更难。吴老师对巴九灵小伙伴说，所有的困难，都可以用发展的方式去解决。\n九灵208新春工作会议杭州·MAO livehouse\n"}, {"year": 2018, "month": 2, "day": 11, "text": "趁年少，炫酷收官國古代嘻哈遇进师：\n神污染物000\n"}, {"year": 2018, "month": 2, "day": 12, "text": "“我想家了”，小马哥轻轻向席间告别，“你们都别起身，窗外风景很好，\n可以再坐一坐，多聊一会”。交谈正酣的同学们然，目光都盯着这个一直不太说话的汉子，直至看到他微黑的脸上生出些红，终于明白他是认真的。从诺莱仕移座小南国，从《资治通鉴》谈到食品安全，看起来有四张儿的他，真的想家了。迄今听到最真诚的饭间离席理由。很美好，不是吗中国独特的家文化从何而来？\n"}, {"year": 2018, "month": 2, "day": 14, "text": "奔跑过田野站在那树旁饮歌集011《归来》满军安庆·大龙山龙井组MrHuang'sHome\n"}, {"year": 2018, "month": 2, "day": 14, "text": "既然接下来，要连着过好几天的大日子，今天先过个小日子吧。\n安庆·大龙山龙井组MrHuang'sHome\n"}, {"year": 2018, "month": 2, "day": 15, "text": "365天不间断，每天写5-6篇文章，平均每天有30万点击，全年累计阅读1亿多人次。今天仍在发文。为新媒体职人点赞嘿！去年25w+的吴晓波频道专栏都在这了|小巴年度盘点\n· · ·\n"}, {"year": 2018, "month": 3, "day": 1, "text": "思想不过一杯酒，生命就像半盏茶。刘爷名刘（大写）如是说。\n自三部《大商埠》入围矛盾文学奖，文坛“擅入者”刘爷再凭爆之作\n《猴票》、《茶战》愈战愈勇。值《茶战2》付印之际，幸得创始会员钱总牵线，恭候刘爷阔别数年再过江。\n3月，待到西湖龙井头采时，相约江南，与刘爷饮茶论道，是为“敬思想而为利禄乃为万古千秋”。\n"}, {"year": 2018, "month": 3, "day": 6, "text": "曾经征服世界的权杖如何交接，方能稳固家族地位并持续进阶？亲历改革开放40年后，中国百万民营企业家都将有此一役。激情未褪刀不老，中军帐下酒尚温。\n酸资人中心路演厅西适对继承人关系着王朝和家质衰，对录人们总是站在自己的立场来判新对绩，事实上，！\nD何选择继承人1、图氏天族：选错继承人的2、刘立太子：各方博宾的3、曹王决胜局：统治者也要重代际差异1、线武候与老卧：二代模班\n"}, {"year": 2018, "month": 3, "day": 9, "text": "1941年，钱钟书先生出《写在人生边上》，那一年他31岁。2007年，\n杨绛先生写《走到人生边上》，那一年她96岁。\n杨绛：年轻时认真历练，方能优雅老去\n"}, {"year": 2018, "month": 3, "day": 10, "text": "今天姜鹏老师讲《资治通鉴》第三课：选择继承人。讲课场地在罗斯福公馆，老怡和洋行大楼，有90多年历史，是浦西众银行大楼之一，目前由美国前总统罗斯福家族持有。今天在现场还有中国企业转型及二代研究专家陈雪频老师和《家族企业家》出品人王立鹏老师。跟众老师一起听姜老师解读900多年前的传承故事，过瘾。\n"}, {"year": 2018, "month": 3, "day": 18, "text": "5年前一次竞标提案间隙，老板和小伙伴们谈起文化名人，冷不丁问我最佩服谁，我说李敖。老板证证多看了我一眼，接不上话，我估摸着他肯定不会懂，但也懒得解释，就补充了一句我佩服李敖，不在于他说的话，而在于他做的事。\n没见过李敖大师，所以其实没有亲眼看他做事。但大师写书，大师演讲，\n大师有话说，大师语妙天下，大师说的都是做的事。不鸡汤，不空骂，不轻诺，先做后说，做了自己说不完，留给后人说。今年《北京法源寺》被排成《戊戌变法》，看过的都说好，了。\n大师说要金刚怒目，也要菩萨低眉。三十多岁到八十多岁，还有半个世纪，且学。\n"}, {"year": 2018, "month": 3, "day": 19, "text": "听你说的故事深深打动我来自这个世界来自我们真实的生活故事里始终都有爱无论有什么样的艰难许巍《故事》\n林爽：食堂，是工作后对学校最美好的向往|会员感悟\n"}, {"year": 2018, "month": 3, "day": 20, "text": "不知道在那天边可会有尽头只知道逝去光阴不会再回头饮歌集014《鹊桥仙》罗家英汪明荃\n"}, {"year": 2018, "month": 3, "day": 21, "text": "十年前，在叔叔的感染下，第一次尝试立过一个蛋，那时候快乐很简单，\n觉得自己NB不是吹的。十年后，与叔叔久别重逢，想再立一个，立了，\n心里很清楚有多少是命运眷顾的成份。\n"}, {"year": 2018, "month": 3, "day": 23, "text": "思想食堂要去台湾游学了，去拜访林谷芳老师、傅佩荣老师、蒋勋老师，\n听他们主场讲课，看看大师，看看传统中国人的日常之美。6月中旬出发林语堂先生的故居也不能错过。\n林语堂：把痛苦过成快乐，把生活过成艺术\n"}, {"year": 2018, "month": 3, "day": 24, "text": "时间，通往思想的唯一窄门。\n下午2点30见。\n思想食堂2周年天量“总想共建”启动\n"}, {"year": 2018, "month": 3, "day": 25, "text": "当今中国需要怎样的思想市场？这是一个漫长而庞大的话题。雷颐老师和韦森老师都谦虚地说不好说，或许只有我们做了才知道。\n怎么做？思想食堂是开放的，大家一起做。或许你走了那么久，也正在寻找一盏灯。\n了那么久，我们寻找一Cantina130天DAYS\n"}, {"year": 2018, "month": 3, "day": 25, "text": "风声。风骨。风范。\n730天后的第一课，在春天里追风。\n"}, {"year": 2018, "month": 3, "day": 27, "text": "6月，一起去台湾，拜望蒋勋老师。\n蒋勋：美感是什么？就是当周围人都求快的时候，你能慢下来\n"}, {"year": 2018, "month": 3, "day": 27, "text": "放眼看，近一百年的时间里，美国作为经济大国，发动过几次重大的贸易第一次是1920年代大萧条时期，它的贸易战对象是英国；第二次是1950年代，对象是苏联；1980年代，以广场协议为核心，发动了第三次贸易战，对象是日本。\n美国的贸易战对象都是当时全球的第二大经济体，所以今天它面对的是中吴晓波：这是一个好时代，它允许新的可能性发生\n"}, {"year": 2018, "month": 3, "day": 30, "text": "9年前，搜狐曾做过一个投票专题，大意是季羡林先生之后，中国有四位国学大家：饶宗颐、冯其庸、张其成、傅佩荣。如今随着冯老、饶老仙逝，可垂范示下者唯张老师与傅老师。傅老师去年6月在思想食堂面授\n《易经》数字卦，初学有得如获至宝。\n今年，将再拜张老师到思想食堂传道。460年世医传承、中国《内经》第一博士，通晓易理易术，以“易”融贯儒、释、道、医。《内经》、《易经》.家学、国学...博学广游的宏涛姐三年前就断定张老师五经贯穿必将为中国第一人。\n初次拜访，张老师说，思想的载体首先是人，然后是经典。庆幸今日之中国，有经典，也有人。庆幸在三十多岁的年纪能够走近这个时代的中心，\n期待张老师带领我们学习经典。\n特别感谢1月13日在上海偶遇北京山东人宏涛姐（图一右三）。\n"}, {"year": 2018, "month": 3, "day": 30, "text": "老同桌燕子说感觉我是真心喜欢这份工作，为什么喜欢，一直不知道怎么回答她。举个新同事的例子，玲艳说，办完这场会，朋友圈点赞数都赶上她生娃那天了。\n思想食堂赶上一个非常好的历史契机，这个正在形成的思想市场有多大？\n老师们都说非常大，甚至是无穷大。契机即使命，任何有限的团队和个人都无法独立完成这个历史使命。所以我们推出了思想共建计划，这项计划的通行证就是彼此思想的同频与共振。\n就像《一代宗师》里宫老爷子给叶问传的那句心法：凭一口气点一盏灯，\n念念不忘，必有回响。我们要做的，或许就是擦亮这一盏灯，然后，然后在黑夜里守护它，直到更多的人带着灯走来。\n有灯，就有人。\n思想食堂，等你来共建。\n730天，2000余名学友在这里找到了一盏灯|感恩回馈\n"}, {"year": 2018, "month": 3, "day": 31, "text": "阔别重逢，明天见。\n恩想食堂\n"}, {"year": 2018, "month": 3, "day": 31, "text": "你凭直觉能做的噬多你就越影明一个声音电脑应该证伸你的无意识没有经过反对的洗礼永远不是真理真相就是符号的影响力隐私的重要性最好的服务也是最坏的服务青岛·中国海洋大学鱼山校区－逸夫科技馆\n· · ·\n"}, {"year": 2018, "month": 4, "day": 4, "text": "春天里的艺术大课，节后第一个周六，上海见。\n田艺苗：月薪三万养不起孩子的暑假，这样就能培养出审美吗\n"}, {"year": 2018, "month": 4, "day": 7, "text": "五花马千金裘呼儿将出换美酒饮歌集015《将进酒》陈涌海\n"}, {"year": 2018, "month": 4, "day": 8, "text": "用耳朵撩心，可能是中国城市化进程中最被忽略的常识启蒙。\n这一课，关乎一种声音的密码。\n14号，上海等你。\n他在中国推广古典音乐30年，他说“音乐不是用来懂的”\n"}, {"year": 2018, "month": 4, "day": 9, "text": "本文很长，但既然都在刷朋友圈了，不妨花点时间深读，我最喜欢下面一“有一次，木心和陈丹青吃饭，邻座坐了两个外国人，陈丹青问邻座是不是意大利人，一问，果然是，丹青有点得意。\n但木心提醒：“你刚去过意大利，你想证明你的虚荣，人难免会这样，但要克制，这是随口就来的虚荣心。”陈丹青的脸，立马红到耳根。\n修养是很具体的，就是一件件小事。一句话熬不住，就失了教养。”木心：以一生优雅抵抗野蛮\n"}, {"year": 2018, "month": 4, "day": 10, "text": "因为她不懂大BOSS的难。\n让欲望牵着自己的心越走越远，直到跟BOSS不是一条心。\n“红人”们最常犯的致命伤。\n为什么有刘邦的宠幸，戚姬还是斗不过吕后|思想食堂\n"}, {"year": 2018, "month": 4, "day": 11, "text": "我的记忆里，他的名字就等同于南通；\n他在的时候，能让一座小城世界闻名；\n不在的时候，留下一城百姓令人羡慕。\n吴晓波：他是我心中排第一的企业家，失败但伟大\n"}, {"year": 2018, "month": 4, "day": 14, "text": "陈立老师从北京南下为我们“精神扶贫”。印象最深的是多明戈流着泪看完委内瑞拉音乐拯救计划的交响乐，说那些（孩子们）不仅仅是瞬间的震撼人心，更是美纶美幻。\n田老师声线与颜值风度俱佳，不愧为音乐学院的“女神”教授。怎么教孩子练琴？你的手指头就像小石头，钢琴就是湖面，噗通掉下去了。她说，让孩子学乐器，是父母的修行。\n感谢生命中的音乐，让我们不至于像陈老师引述左巴时说的那样：老板，\n你什么都有，但你仍然错过了生命。\n小马哥说，两位老师都很快乐，这很好。看，这就是音乐的力量。\n想有堂-艺术通识速音乐的力量\n"}, {"year": 2018, "month": 4, "day": 16, "text": "伟大革命导师毛主席的护士孟锦云回忆，主席的床头总是放着一部书，这是一部被他翻烂了的书，有不少页都已脱线，用透明胶粘着。这部NB闪闪的书就是《资治通鉴》。\n人民网是这么报道的：1975年的一天，毛泽东还与孟锦云谈《资治通鉴》，他指着桌上的《资治通鉴》问：“孟夫子，你知道我这部书读了多少遍了？”不等孟锦云回答，他又接着说：“一十七遍，每读一遍都受益匪浅。一部难得的好书噢。恐怕现在是最后一遍了，不是不想读，而是没有那个时间啰。”能让伟大领袖爱不释手，这部文言巨著到底有多神奇？为什么它会被称为“帝王BOSS教科书”？它这么厉害，又为什么几乎从未有老师教你？\n本周末，姜鹏老师将移驾杭州一如书院，带大家一起精读《资治通鉴》思想食堂定制第四模块《帝国成败启示录》。为什么是姜鹏老师？姜鹏老师又为什么走下“百家讲坛”来到思想食堂？\n本人身鉴，此课烧脑，而且相当。由于服务能力有限，本课人数不超过25人，原则上已停止报名。因每次有少数董事长BOSS课前请假，特开放单一模块供有档期的历史爱好者朋友参加。\n号外，本人已被历史选中，自本期开始添居课务“班主任”一职。责任重大，诚惶诚恐，欢迎有兴趣的BOSS朋友慷慨给予意见建设；权杖在手，\n力不压身，或有不方便公之于众的特殊需要，也可私信。\n4月21日-25席帝国\n《资治通\n"}, {"year": 2018, "month": 4, "day": 17, "text": "开会。谈起思想共建，老板说思想食堂的合作伙伴不是谁投了钱都能做；\n我们的底线是绝不能让合作伙伴亏钱。\n"}, {"year": 2018, "month": 4, "day": 21, "text": "他强任他强，咱出道比他小；\n他横由他横，咱活得比他老。\n帝国成败启示姜鹏《资治通鉴》系统课第四模块\n"}, {"year": 2018, "month": 4, "day": 22, "text": "国大故事多，一方水土八方人。这周末食堂的小伙伴兵分两路，南通是中国近代大商人游学第一站，杭州是900年《资治通鉴》第四站。\n又一次与南通擦肩而过，却不经意艳遇杭州燕姐备下的鸡汤泡炒米。\n《资治通\n"}, {"year": 2018, "month": 4, "day": 25, "text": "去岛上，看会发光的人。\n6月17日出发。\n第一天16月17日早餐：不含第二天16月18日\n"}, {"year": 2018, "month": 4, "day": 27, "text": "很多小说你也读过，但他读出了不一样的味道。\n吴晓波：一起来听毕飞宇品读经典，他真的读出了不一样的味\n"}, {"year": 2018, "month": 4, "day": 29, "text": "放下一切走吧是时候就会开花饮歌集016《观》张学友谭咏麟\n· · ·\n"}, {"year": 2018, "month": 5, "day": 2, "text": "在我们身上，送代这个时代。\n有一个，算一个。\n思想食堂——汇集全中国最好的人文课程\n"}, {"year": 2018, "month": 5, "day": 3, "text": "人，为什么总得有点想法？\n叔本华：一个人越有思想，乐趣就越多\n"}, {"year": 2018, "month": 5, "day": 3, "text": "乔迁坐标：白沙泉基金并购街区可算是老HIGH的地方了。\n独栋办公房，出门是北山，山下有球场，翻山是西湖。。。好山好水好少年，好茶好酒好书香。\n敲黑板！！！本人手上尚有风水俱佳工位一枚，专供抗压耐摔靠谱有料有志有面儿文艺男女青年，欢迎举荐或毛遂自荐。\n跳槽有风险，来撩且谨慎。\n"}, {"year": 2018, "month": 5, "day": 5, "text": "门风，才是你守护家人最好的恒产\n5月19日，北京见。\n这个家族传承500年的奥秘，都写在了这本书里|思想食堂\n"}, {"year": 2018, "month": 5, "day": 8, "text": "4年前，你在做什么？那时候你有想做而至今未做的事吗？\n一个又一个4年，晃一晃就过去了。何不就在今日，想想下一个4年，甚至40年，你愿意ALL-IN地做点什么？\n我们往往因说得太多而寂寞，却忘了多做一点就有好运气。\n四年千里，日拱一卒。\n吴晓波：四年以降，谢谢你，一直在\n"}, {"year": 2018, "month": 5, "day": 11, "text": "在富而可求的大好时代，请经济学家和大家一起谈谈“钱”的故事。\n君子爱财，可以来。\n的懂钱吗？\n老师带你重新认识货小货币如何影响宏观经济币起源发展，知晓货币内核本质“文货币为基，解等货币经济困感务信用税角，分析经济在危机币运行机制，了解定现经济大势\n"}, {"year": 2018, "month": 5, "day": 14, "text": "30岁之后才明白修齐治平，基本已经是来不及了。怎么办？只好先治业，再齐家，然后才可谈修身。\n再然后，突然如醍醐灌顶般明白原来还有正心，诚意，致知，格物。\n这也算是实现中国传统理想人生的当代路径。\n一个成功家庭必然要有的细节，这本家教典范都说了\n"}, {"year": 2018, "month": 5, "day": 18, "text": "根据思想食堂近百场课程执行经验，凡来的比签到组还要早的都是学霸BOSS，他们的特点是来得早，走的晚，手机一天不带响。\n实不相瞒，不论老师日常会对哪个会请客会聊天的学生格外偏爱；当老师在讲课的时候，一定还是最喜欢紧缩眉头、默默记笔记学霸BOSS们。\n因此，明天的座位将不排号，从第一排开始往后坐。在严格的思想签到组面前，我，也没有特殊供应我亲爱的BOSS和准BOSS盆友们，敢再试试你的学霸值吗？\n"}, {"year": 2018, "month": 5, "day": 21, "text": "为什么《资治通鉴》被誉为“皇帝教科书”？\n首先编写这部书的人不一般，4朝元老从政48载官拜宰相，司马光皓首19春秋300万言皇皇巨著。\n其次，不是谁都能读到这部书。毛泽东一生爱不释手通读17遍，康熙帝私房精读传世详批107条，曾国藩盛赞之为中国经世哲学巅峰之作。\n最要紧的是，不是谁都能讲好这部书。姜鹏老师曾于百家讲坛讲解《资治通鉴》，广受欢迎。高晓松赞他是中国当下解读《资治通鉴》最好的老师，我信。\n小班两天，6月下旬见。\n精品私垫课|做企业为什么要读《资治通鉴》？\n"}, {"year": 2018, "month": 5, "day": 29, "text": "大人虎变，小人革面，君子豹变。\n《易经》革卦\n"}, {"year": 2018, "month": 5, "day": 30, "text": "6月9日，经济学家七剑之韦森教授继剑桥、哈佛之后，与思想食堂一起做客沃顿商学院中国教室（上海大学内），深度干货，高能加餐。\n感谢易居沃顿马总和家泰兄支持。\n韦森：理解货币与现实经济的关系，才能避免被愚弄|思想食\n· · ·\n"}, {"year": 2018, "month": 6, "day": 1, "text": "谁愿意解释为了什么一笑已经风云过饮歌集号外002郑少秋《笑看风云》\n"}, {"year": 2018, "month": 6, "day": 2, "text": "荣家是中国民族资本家的首户，中国在世界上真正称得上财团的，只有他们一家。\n"}, {"year": 2018, "month": 6, "day": 3, "text": "在102年的教室里同窗，最新的木地板也有50年以上了。\n请到无锡梁溪荣氏家族史研究会秘书长—荣华源老先生给大家讲家族故老先生系无锡下荣二房春沂公支派，比荣智健小一岁，论辈分是他侄子。\n"}, {"year": 2018, "month": 6, "day": 3, "text": "无锡游学思考|工商工商，先工后商，工商一家。为什么？从前的工厂是商场的源头，也就是说先有工业再有商业。\n投身工业办工厂，是状元张赛辞官的选择，也是布衣荣氏白手起家的选择。先做厂长，再做董事长，土是土了点，但结实啊。现如今理工科高材生们日子不好过，要让他们转文史科就更没前途了，不过好在还有一个古老而又历久弥新的行当一—商科，火烧的正旺。\n就看身边多少昔日的技术大牛奋不顾身地完成了赛道切换，换得一时安顿。不想当将军的士兵不好，但神枪手都去做指战员，真的好吗。\n天下大事分久必合合久必分，大势所趋的文化局和旅游局合了；看看情形，工商局要不要分一下。确认个眼神？\n紧华传承国内专家学者新时无需工文党袋用商文化研销会中国民获工商处制\n"}, {"year": 2018, "month": 6, "day": 8, "text": "谈到思想食堂，谈到彼此的机缘，于老师说，上个世纪很多有思想的老师无人问津以致“自生自灭”，他们的思想消失了，是民族的损失。今日之幸运，在于我们的职业与事业天然统一，而我们要做的的事则必将载入史曾经少年，于老师追忆求学问道，每每不请自到、与老师软磨硬泡直至师母下逐客令，如此“厚着脸皮”只因为“在老师家里听三个钟头，顶的上自已读半年书啊”...画面感十足，颇有为往圣继绝学，舍我其谁之当仁不让之风范。去年“净名精舍”落成，年近六旬的于老师笑言，自己一生的事业才正式开始，而前50年经历的一切都在为此准备。\n于晓非老师精通梵文和巴利语，南大天体物理学毕业、在中央党校研教哲学30年，多年弘法奔波拥10万+线下听众。他正本清源解读《金刚经》、《心经》、《维摩诘经》音频在喜马拉雅上的播放量已超过780万次。期待于老师在思想食堂与大家见面。\n再谢宏涛姐无上功德，感恩惜福。\n"}, {"year": 2018, "month": 6, "day": 8, "text": "他们终其一生源源不断地创造出优秀的作品，不仅推动着古典音乐的发展，甚至还促进了欧洲思想开放的进程。\n世界上最伟大的10位作曲家，你听过几位？|思想食堂\n"}, {"year": 2018, "month": 6, "day": 15, "text": "当欲望已成记忆。晚安。\n"}, {"year": 2018, "month": 6, "day": 16, "text": "有多久没问过：为什么？\n十岁之前见人就可以问答案。\n二十岁之后渐渐无人可问直至不再有问。\n三十岁之后，请问自己。\n为今天在现场的朋友点赞。\n"}, {"year": 2018, "month": 6, "day": 19, "text": "思想食堂来台湾，是因为台湾有人。\n按日程，我们同时请到傅佩荣、林谷芳、蒋勋三位大家，在一周内分别讲述中国传统文化“儒、释、道”的精髓。\n正式上课前，竟又意外在食养山房邂逅林炳辉先生，在先生笃定的坐立起居和一茶一饭的感召下，台湾人文之旅注定的美好和机缘已初露芳华。\n林先生主张传统中国人先有儒家的入世精神，把家顾好，把社会给予的责任做好；当年纪慢慢大了，可以有道家的自然情怀，然后年纪更大的时候，就有关照生命的一个终极，可能就是佛家。他说，最幸运是在年轻时就做了自己喜欢做的事。\nDAY1：旅游公司和地接负责人都说，这个团不一样。都说台湾最美的是人，其实，来台湾的人也美。人美，思想也美。\n"}, {"year": 2018, "month": 6, "day": 19, "text": "论少读一部《资治通鉴》的风险在中正纪念堂外的自由广场，和学霸会员聊起一个有趣的话题：蒋校长和毛主席都是爱读书、善于学习的政治领袖，为何却结局如此不同？\n管中窥豹比较一下，主席酷爱史书，尤其是皇帝教科书《资治通鉴》，\n生通读十七遍，批阅无数，爱不释手。而校长大人读“经”甚于读史，\n重“术\"胜于重“道”，钟爱《管子》、《韩非子》等，完美错过《资治通鉴》，与理想失之交臂。\n那么一部《资治通鉴》的分量当真这么重？！蒋校长和毛主席共同景仰的千古第一完人曾国藩如此评价：最好的经世治国之书。\n周五返沪（6月23日至24日）百家讲坛名师姜鹏，在上海开讲《资治通鉴：权力博奔中的策略》，小班教学，私话帝王权斗故事。\n上海约。\n"}, {"year": 2018, "month": 6, "day": 20, "text": "DAY2宁辰小姐（图六）听课后写到：“下午傅老师用两小时为我们做了易经入门讲解..在清晰简洁介绍了八卦之后，他为大家演示易经占卜。\n我也向老师请教了一个问题，得到了一个有趣的卦象，得到大家的祝福，\n静待事势发展吧同学们也纷纷提问参与，傅老师总结说很少有一个课程问的问题都是中性趋利的。的确，这次台湾游学团品质能量非常好，大家三观同，聊得来，美好的能量也在相互感染传递。\n感谢傅老师近七十岁年龄，精神翼，幽默活力，一整天的课程全神贯注，思维飞速，感谢这样的老师言传身教，他把儒释道的理念活了出来，\n示现给大家。愿这样美好的能量能铭记心中，继续真诚友善地行走世间思想食堂台湾游学渐入佳境，祝福所有心里默默发光的好同学。\n海务浦学第一站海务游学第一站海外满学第一站特业（通与元）\n海外游学第一站\n"}, {"year": 2018, "month": 6, "day": 22, "text": "DAY4：机缘兑现海外满学第一站海务浦学第一站\n"}, {"year": 2018, "month": 6, "day": 23, "text": "DAY5：有时候，老师离不开书卷气，他们读书，讲书，也写书。有时候，老师难得有烟火气，他们谈天，谈地，也谈人。\n看到了就是看到了，听到了就是听到了。所谓大先生一生活之外，都是风景；他们在风景中生活。\n温饱之外，皆可美好；他们在美好里温饱。\n跟着大先生，读书可以当饭吃。\n欣菜食勤\n"}, {"year": 2018, "month": 6, "day": 23, "text": "“蒋介石少读了一部《资治通鉴》。\n姜鹏2018.6.23\n"}, {"year": 2018, "month": 6, "day": 29, "text": "“快到山顶了，该遇到的人都会遇到。”刘丰老师上车后寄语子心。\n8小时的聆听与对话，再次印证世界文明的新轴心时代正在到来，而这一次，中国的思想者作为主角将不再缺席。而不久的未来，必将诞生系统工程级的思想体系。\n正如林语堂先生说：“世界上的强盗，再没有比劫夺我们思想自由的罪恶更大的了。”这是一个“想权”终将大于“产权”的时代。\n感恩遇到子心（图二左起往右）晓杉总、古总、刘丰老师、宏涛姐，还有立玮兄和翠翠。\n美好正在发生，伟大已经上路。祝福各位有缘人无欲则刚，然后，心想事\n· · ·\n"}, {"year": 2018, "month": 7, "day": 14, "text": "“堂堂天朝岂能去了解那些蛮夷之邦”？够任性吧。但是挨揍的前奏。\n上午是雷颐老师的上半场，他站着讲了三个小时，最后说中国老百姓最应该看到的是日本人的学习精神。\n像林则徐、魏源这样仅为了解敌情而编的《四洲志》《海国图志》便被视为大逆不道。\n《海国图志》在自己的祖国备受冷落，却在异邦大受欢迎，启发了异邦的改革，并反过来不断侵略中国，不能不说是历史的讽刺。\n"}, {"year": 2018, "month": 7, "day": 15, "text": "马国川老师在新书《国家的启蒙—日本帝国崛起之源》中开宗明义：“看日本，想中国”。\n昨天下午，雪虎跟雷颐、马国川两位老师对谈，提到一个“改革到底怎么算成功”的问题，也对比了下中国的改革开放和日本的明治维新。\n干货如下一1.判断一场改革是否成功一定要看它要达成的目标是什么，这个目标的达成肯定要经历一个过程，曲折往复，但目标一定是要明确的；\n2.现代国家的改革目标简而言之就两点：一、政府的权力生成和分配是否得到有效制约；二、人民的权益是否得到有效的保障；\n3.按照上述标准，日本的明治维新并不是在明治一朝完成的，甚至在明治天皇去世时改革已经走入歧路，因此日本付出了军国主义带来的巨大代价，直到1980年代，日本才基本上完成了明治维新定下的改革目标；\n4.反观下今天中国过一段时间就要提一提的改革，不妨先问下目标是什么？路径是怎样的？跑偏了没有？只是经济上取得了点成绩，就别急着炫耀了。照目标看一看，路还远着呢。\n时话：解读中国社科院杂志主等\n"}, {"year": 2018, "month": 7, "day": 15, "text": "思想食堂成立时，吴老师就邀请许纪霖老师讲课。两年后许老师隆重返场，一天听下来，也开始琢磨：当我们谈论中国时，我们在谈论什么。\n是“厉害了我的国”的国，还是“精忠报国”的国？我们习惯于在酒桌前津津乐道于我们理解的南方人和北方人时，真的是那么回事吗？\n吴老师还引用过许纪霖老师的一段话，他写道：“今天，传统中国人的安身立命处在哪里？学者许纪霖给出知识人的回答：两种关怀。一种是与自己的专业志向相联系的知识关怀，另一种则是与普遍良知相关联的社会关怀。这也是思想食堂的安身立命处，是它的根。”我们是缴？\n何为中国？\n何为中华\n"}, {"year": 2018, "month": 7, "day": 16, "text": "在晓波老师的心目中：雷颐先生是国内民国史研究的“第一人”。雷颐老师当过兵，修过飞机，下过乡...是文革恢复高考后第一波思想解放的知识分接受采访时，他说：“我们只是幸运者，精神启蒙还没有完成，社会转型正在进行中。”8天的登岛行动，能跟着雷颐老师的眼睛去看日本的故事，跟着雷颐老师的分享去想我们的未来，我们也是幸运者。\n作为一个有影响力的中国资源持有者，你的心里其实很清楚，日本队在俄罗斯留着眼泪清扫赛场的行为其实并不简单。我们简单粗暴地目中无人或妄自菲薄，其本质都是一种理性的赢弱。\n这注定不是风花雪月的“观光”之旅，甚至可能并不轻松，但我想说，这是一种责任。生于这样的时代，我们无法随波逐流，我们需要一种直面真相的理性勇敢。\n期待与思想的勇者同行。\n今年“明治维新”150周年，雷颐老师带队从鹿儿岛出发|思想\n"}, {"year": 2018, "month": 7, "day": 20, "text": "姜老师拿皇上的故事给企业家朋友开的猛药，不好吃，但有效。\n刘邦为什么能赢项羽？就四个字：舍得分钱|思想食堂\n· · ·\n"}, {"year": 2018, "month": 8, "day": 4, "text": "万涓成水终究汇流成河像一首澎湃的歌童安格《把根留住》\n饮歌集017\n"}, {"year": 2018, "month": 8, "day": 16, "text": "四年哇步自力自足\n"}, {"year": 2018, "month": 8, "day": 18, "text": "孟老师说，有的语言，是一种艺术。思想食堂第87场通识大课。\n"}, {"year": 2018, "month": 8, "day": 25, "text": "千古帝王遗憾：建国不能传国，传国不能传家。\n生而为人，最难“做人”。身不由己，何以齐家？\n姜鹏老师《资治通鉴》压轴：家族传承德政之类\n"}, {"year": 2018, "month": 8, "day": 26, "text": "走一程，望一程。\n2017.12.09-2018.08.26，9个月，思想食堂最长的一次系统课尝试。\n礼。成。\n"}, {"year": 2018, "month": 8, "day": 28, "text": "写的真好一终于在北京的郊区，为自己布置了一个理想的居所：院子里有花，有木栅和鹅卵石铺就的小道；屋宇明阔，有实木打造的整面墙的大书架；地下室用玻璃搭建了小小天井；室内一角布置成和风茶室，可以冥想，可以与来访的朋友小叙。\n最为奢侈的是，小区的背后，就是北京东部最大的湿地郊野公园。因而，\n余宅虽在都市之内，却端然有着世外的气象。\n余世存说，他现在才懂得了穆旦的那句诗：“这才知道我的全部努力，不过完成了普通的生活。“余世存：做三四月的事，在八九月自有答案\n"}, {"year": 2018, "month": 8, "day": 29, "text": "雷颐老师笔下的甜酒沈从文：无论自己在其他方面取得了多么辉煌的成就“在他真正希望终身从事的业务上，他把生命浪费了..\n扪胸自问，你有了“真正希望终身从事的业务”吗？\n雷颐生命的浪费：沈从文的内心独白\n"}, {"year": 2018, "month": 8, "day": 31, "text": "想起钱钟书先生曾有个说法，大概是正常人都要靠着1%的甜头，克服了99%的痛苦。\n但凡做点事，总想要牛逼，但苦逼的时刻肯定居多。人生总归要有点甜头：怕就怕你尝点甜头，就误会以为那99%都应该是甜的。贪恋牛逼如同沉迷甜头，一不小心就是会伤天害理的，警惕警惕。\n功成身退：做人，要有开拓的本事，也要有善终的智慧\n· · ·\n"}, {"year": 2018, "month": 9, "day": 5, "text": "看过大山，看过大水。\n沐过清风，沐过明月。\n都不及，\n这个迷人的所在。\n"}, {"year": 2018, "month": 9, "day": 5, "text": "邵公的课，在北大一座难求。此号乃邵老师篇篇原创，日日更新。文中或有颜如玉，有黄金屋，立志阅读传统经典的理工科童鞋不可错过，上课老打盹的文学青年更要补习。\n读《论语》：朝闻道，夕死可矣\n"}, {"year": 2018, "month": 9, "day": 8, "text": "你们要的干货。\n"}, {"year": 2018, "month": 9, "day": 9, "text": "a big day\n"}, {"year": 2018, "month": 9, "day": 10, "text": "人不可一日无尊国不可一日无师表師世萬\n兹在文斯\n"}, {"year": 2018, "month": 9, "day": 13, "text": "为什么要听这堂哲学课？这么说吧：30多年前，周国平老师转述青年尼采1个半世纪前的批判预言：“现代人已经远离人生的根本，贪得无厌，\n饥不择食的求知欲和世俗倾向恰恰暴露了内在的贫乏。”尼采说：“老子的《道德经》像一个永不枯竭的井泉，满载宝藏。”马克斯\n·韦伯说：每当老子思想被提倡，中国经济都比较好，人民丰衣足食。\n余世存老师说：“在写《老子传》的日子里，对自己的微笑最多。”他救赎了自己，再告诉世人：人不是来征服世界的，人是来世界上适得其所的。\n"}, {"year": 2018, "month": 9, "day": 13, "text": "不知不觉，钱总的聚芳永已为思想食堂学友们赠送了半年多的茶歇，还买了不少课送给他的会员听。接触时间久了，能看出钱总是个做的多、说的少的董事长。\n茶研所出身，做了20几年茶。7年前带着几亿资金回杭州，买茶山、请博士、建实验室。。。小心翼翼弄出了茶，守在西湖慢慢卖。看着一个又一个不种茶的茶店都红了，我就纳闷：一个可口可乐、立顿、雀巢抢着合作的大茶企，一个上市公司做的东西，怎么到了喝茶人这里就不灵了呢？\n做好了茶，卖的不火，他也着急，但还唯恐我们为聚芳永做广告，惹学友不舒服。他总喜欢这样宽慰我：陪无趣的人吃饭，不如与有思想的人喝茶。这弄得我很不好意思，虽然是合作，却总有一种我司被照顾的感觉。\n钱总的团队都是跟他5年以上的班底，在企业定制方面非常靠得住。感谢钱总对思想食堂的支持。钱总的茶，值得思想食堂的朋友们一试。\n思想茶礼\n"}, {"year": 2018, "month": 9, "day": 14, "text": "有没有发现，身边的老大们见面时不再拱手，再见时也不再摆手，他们都习惯：双手合十。\n梁文道、曹德旺、陈坤，为什么他们都学佛？\n"}, {"year": 2018, "month": 9, "day": 14, "text": "周国平老师的思想有多伟大？可任取一篇郭红老师主编的周老师公号文章。比如周老师不经意说：“思想停止了，才有思想。”能让杨绛先生出版《走到人生边上》的郭红老师有多美？明天在现场的童鞋们或许会有幸一睹风范。祝福你们。\n人人知道而只有一个人敢说出来的东西\n"}, {"year": 2018, "month": 9, "day": 16, "text": "中原人民太热情了，1个半小时的PPT吴老师多讲了40分钟。但，并没有误机。\n感谢洋河郑州团队，感谢吴老师夸赞的合颂小伙伴。感谢万能的路总。\n"}, {"year": 2018, "month": 9, "day": 20, "text": "不逼一下，真不知道原来个个都是身怀绝技。\n思想小食堂001期\n"}, {"year": 2018, "month": 9, "day": 22, "text": "姜老师的《资治通鉴》系统课，二期重新编排，专讲皇帝和他身边人的故事。个中精彩已在一期课时偶有侧漏，这次课已有数位一期同学再次报名，期待又一次充满智慧的学习之旅。\n1八节上时领导智慧展(（治通)\n2018\n"}, {"year": 2018, "month": 9, "day": 25, "text": "都说“第一等好事无非读书”，你一年又实实在在读了几本书？\n所以，第一等“难”事才是读书。能做难事，敢行难路，必心存浩然，久之，自然气度不凡。\n中国历史上十大成功帝王，他们到底有何秘诀？|思想食堂\n"}, {"year": 2018, "month": 9, "day": 25, "text": "读史为何必读魏晋？雪虎以雷海宗先生《中国的文化与中国的兵》书中观点为小伙伴们内训一中国四千年的历史可以分为两大周期：第一周期，殷商至肥水之战；第二周期，水之战至民国。（今日可已至第三周期？）\n第一周期内，是纯粹的华夏民族和以儒家为主的华夏文化，而这一套政治文化体制到魏晋时已彻底走到了头，衰弊尽显；\n恰恰在此时，五胡进入中原，与汉民族融合，佛教从印度传入，与儒道融合，使得种族和文化皆有大的改观，自此开启了中国历史的第二周期。\n从大历史角度看，中国的破“危”为“机”也是缘于包容与开放，尽管很多时候是被动的。\n而魏晋南北朝一段恰恰是中国的大转折之时期，其承上启下的意义怎样强调都不为过，不了解魏晋南北朝，就不能理解之后出现的巅峰盛唐，不能理解中国何以成为唯一延续至今的古文明，而理解了魏晋南北朝，就懂得了《道德经》里的“物损而益”，也懂得了《易经》里的“否极泰来”。\n仇鹿鸣/复旦大学晋南北朝为什么会成为最漫长的分裂时代\n"}, {"year": 2018, "month": 9, "day": 29, "text": "夫君子能勤小物，故无大患。\n《国语》\n· · ·\n"}, {"year": 2018, "month": 10, "day": 7, "text": "距离产生美，近距离产生美好。\n蒋勋老师用人间大音讲《庄子·逍遥游》，刘若璃老师的优人们用生命和神鼓诠释道艺合一。\n台湾游学二期\n"}, {"year": 2018, "month": 10, "day": 8, "text": "你～挑着担，她～牵着马，迎来日出回家休假～恭喜台湾二期小伙伴凯旋\n"}, {"year": 2018, "month": 10, "day": 9, "text": "还记得当时正值隆冬，家泰兄在北京有晚宴，为避免第二天迟到，选择坐通宵火车返沪，披着羽绒服就来到了黄浦江畔的课堂里。\n为什么要学习《资治通鉴》？为什么要跟着姜鹏老师学习？\n他的这篇课后感想，写得真好。\n宋家泰：毛泽东和邓小平都喜欢读的书，现在有人讲给你听了\n"}, {"year": 2018, "month": 10, "day": 13, "text": "复旦大学仇鹿鸣教授《魏晋南北朝为什么会成为最漫长的分裂时代》\n思想食堂通识课090场陕西师范大学于哲教授《唐朝为何成为中国古代的巅峰》—思想食堂通识课091场\n"}, {"year": 2018, "month": 10, "day": 14, "text": "如梦如幻，精妙绝伦。\n精品课：于晓非《金刚经与佛教的基本精神》\n"}, {"year": 2018, "month": 10, "day": 15, "text": "看斜阳落下去又回来地不老天不荒岁月长又长韩磊《走四方》\n饮歌集018\n"}, {"year": 2018, "month": 10, "day": 19, "text": "在我理解的中国传统智慧系统里，儒、释、道三家各大经典之上，另有两部至高经典：《易经》和《黄帝内经》。\n张其成先生来自徽州“张一帖”国医世家，460年秘传家学之外，于上世纪末，先后得北大《易经》泰斗朱伯先生和北京中医药大学《黄帝内经》\n泰斗王洪图先生晚年关门授业。张先生师承有来，潜心精进数十载，主张易、内同修：《易经》讲天地宇宙外在变化的大规律，《黄帝内经》讲人体生命内在变化的大规律；先易后内，一个是起源，一个是落地。\n何其有幸。能请到张其成先生南下，为你解密中国史上唯一生命思想经典\n《黄帝内经》，教你“法于阴阳，和于术数”的养生基本原则，聚足人身三宝：精、气、神。\n筹办这次课，特别感谢浙江电视台《养生大国医》嘉宾初芳老师、孙琪老师助阵，咱们能提前一天一起领略江南药王胡庆余堂、养生药膳及胡雪岩\n10月27一28日，杭州，张其成《黄帝内经》精品课+胡庆余堂、胡雪岩故居主题游学\n"}, {"year": 2018, "month": 10, "day": 28, "text": "如春风化雨，如尘埃落定。感谢在场和不在场的你。因为我们做了三四月的事，我们在八九月有了答案。\n"}, {"year": 2018, "month": 10, "day": 30, "text": "十多年前就听说过你的梦想，只是没想到你的南门保安比北大复旦的敬业这么多。\n好在你不大，去北门刷脸。\n北京限装学院\n· · ·\n"}, {"year": 2018, "month": 11, "day": 6, "text": "一位名叫穗织一成的日本青年，在参观时突发急性胃出血急需手术。但他担心中国的血液技术不过关，不愿意输中国人献的血。而同团的日本人又以旅途劳累体力不支为由，不愿为他献血。\n情急之下，工作人员将此事上报中央和日本大使馆，最终决定强行为他手术和输血，保住了他的命。\n访问结束后，穗织一成举家迁往中国，只收象征性的报酬，一直在中国教了好多年日语。\n三千个日本人，闯进1984年的北京\n"}, {"year": 2018, "month": 11, "day": 16, "text": "空山新雨后\n"}, {"year": 2018, "month": 11, "day": 25, "text": "赣江流过，水大，鱼也大。\n“一个新闻人出身的财经作家，正持续奔波在这个世界上最重要的经济新闻产生地，受雇于一个伟大的记忆。\n此刻，想起思想食堂2周年时，雪虎请会员朋友朗诵的那首《青灯》一你把词语垒进历史让河道转弯花开几度催动朝代盛衰乌鸦即鼓声帝王们如蚕吐丝为你织成长卷美女如云护送内心航程\n"}, {"year": 2018, "month": 12, "day": 3, "text": "论日本，论中国，论中日美，他是得天独厚，无出其右。\n10年写一个中国人，怎么做研究？他方方面面的人都要看，不同人的声音都要听，为的是最大可能地记录一个时代，做一个有“人情味”的学者。\n下个月一起去哈佛，看看这个中国话贼溜的大个子老头儿眼瞅着就89亲历40年中美风云，“中国先生”傅高义聊大国博弈\n"}, {"year": 2018, "month": 12, "day": 14, "text": "好酒不是一天做成的，也不是卯着劲花个一两年功夫就能有所得的。钟雨总裁是四代酿酒，今天喝的梦之蓝出自上一代之手，今天酿下的好酒又是下一代的福田。\n听吴老师采访钟总3个小时，居然有聊不完的话题。好酒跟好文章一样，\n时间门槛非常高，所谓书香世家尚要十年寒窗，或可一笔成章。人生一世，想要酝酿点豪情，就得有足够的笨功夫，少有捷径。\n躬耕半生，总要有所成就，留下点声名。都说成名要趁早，趁早又如何？\n李白早就说，古来圣贤多寂寞，惟有饮者留其名。\n思想食堂×梦之蓝客400余\n"}, {"year": 2018, "month": 12, "day": 15, "text": "#吴老师讲洋河差异化竞争#酒们都争着叫酱香、浓香、清香。。。洋河换了个阵地，叫“棉柔”。棉柔是一种味觉，与香型无关，这一下就把其他酒划分出去了。\n香是闻的，棉柔是喝的，酒喝到嘴里，就由不得鼻子说了算。任你有多香，咱是棉柔鼻祖啊\n"}, {"year": 2018, "month": 12, "day": 16, "text": "1915年，陈独秀创办《新青年》，新文化运动开始，青年学生在李大钊、胡适、鲁迅等诸位精通传统中文的大先生带领下，大破大立，做新青年学新思想写新文章，一时风光无两。\n见不得北洋政府在巴黎和会丢人卖国，1919年5月4日，新思想武装血气方刚的青年学生上街抗议，用行动发起五四运动，一举把新文化运动推向高潮，也直接加速陈独秀、李大钊的创党进程。再然后，风霜雪雨30年，有了新中国。\n明年是建国70周年，新文化运动催生五四运动100周年。\n国运70\n"}, {"year": 2018, "month": 12, "day": 19, "text": "还有5个钟头，翻一本老书。\nEdeos9.3.年\n"}, {"year": 2018, "month": 12, "day": 20, "text": "有一位士大夫曾对他说，我有一个儿子，今年17岁，学习还不错，但我还想让他学习一下鲜卑语，也学学怎么弹琵琶..因为当时北齐最高的统治阶层是鲜卑贵族，说的是鲜卑语，而且有一位北齐皇帝是最喜欢弹琵琶的颜之推听完之后，当场并没有发表什么意见，但是之后把这件事记录在《颜氏家训》里，感叹：这个人怎么会这样教育自己的孩子呢？\n一个故事告诉你，焦虑时为什么更需要读历史|思想食堂\n"}, {"year": 2018, "month": 12, "day": 28, "text": "国运70，预见2019。\n"}, {"year": 2018, "month": 12, "day": 30, "text": "今天在上海，《资治通鉴》二期开课了，感谢姜鹏老师，感谢会员朋友对思想食堂的支持。\n不图小利、锁定即需坚定\n"}, {"year": 2018, "month": 12, "day": 30, "text": "吴老师邀请许知远老师聊聊人文，聊聊那些不同于财经和投资领域的“说不清的事”。许老师分享了米沃什《被禁的头脑》中的一段话，这正是思想食堂的意义所在一“庸俗化知识的特点是：它让人感觉一切都是明明白白的，一切都是可以解释清楚的；它也令人想起在深渊之上架设吊桥的方法，沿着吊桥可以大胆地往前走，同时自欺欺人地认为：脚下没有万丈深渊，同时要记住，眼晴千万不能往深渊看—但遗憾的是，这一切都不可能改变现实中存在万丈深渊的事实。”\n"}, {"year": 2018, "month": 12, "day": 31, "text": "思想小贩年终秀预见2019学习笔记-盘晓波老师：大国之大，不在大器，不在大金，不在大楼，在于代代有管老师：嗯，这一代人数量红利下降，质量红利看涨。光是来了，但隧道有点长。\n吴声老师：嗯，当这一代人懂得什么是好，时髦，且感动。也挺好。\n知远老师：啊，友谊很重要，但知识庸俗化是个问题。这代人下代人都要勇敢地看到问题。\n晓波老师：海德格尔早说了，在疑惑和不适中，哲学就诞生了。把机遇交给青年人，让他们去折腾吧。\n所以，2019年，思想食堂是有条件要办，没条件创造条件也得办，感谢大家一直以来对思想食堂的支持。\n新年新开始，祝大家2019心有所想，心想事成来没有夕阳西下的产业有夕阳西下的人。\n—— 2018年 · 共130篇 ——\n2019\n"}, {"year": 2019, "month": 1, "day": 1, "text": "看碧波高壮又看碧空广阔浩气扬\n"}, {"year": 2019, "month": 1, "day": 4, "text": "只顾语言纵欲，哪管思想瘫痪。\n许知远：中国崛起时，我们和世界的沟通语言只有消费\n"}, {"year": 2019, "month": 1, "day": 4, "text": "“道”是什么？就是思想。思想是管一切的硬道理。\n胡适在六十岁的时候接受采访，他回答记者说，他并不想直接从政，因为“思想文化的途径有其巨大的力量，有其深远的影响”。\n新刊|葛兆光：再谈思想史在当代中国的重要性\n"}, {"year": 2019, "month": 1, "day": 13, "text": "读书四境界新论第一境石是石第二境石是担第三境石还是石第四境石也可以担一下姜鹏《资治通鉴》系统课二期\n"}, {"year": 2019, "month": 1, "day": 13, "text": "有时候，老师发明很多概念，给你开个脑洞。你一直醍醐灌顶，然后，然后你的脑袋就不听使唤了，因为那个洞就这么空着，没人管。\n有时候，老师似乎特别死板，就带你认字读书。你偶尔昏昏欲睡，醒来，\n醒来居然精神抖擞欢喜自足，为毛？\n因为课上养神啊你以为你在用脑筋学知识，其实历史教给你的是胸怀。get到了吗\n"}, {"year": 2019, "month": 1, "day": 14, "text": "书店越来越成为商业的灵魂。而书店的灵魂，可能是文学。一种为人疗愈的慰藉，非人人可得。\n这里有好作品，背后是好作者和评论人，这三者都越来越少。祝贺许老师单向空间在杭州开业，人文的魅力。\n在杭州，我们听到了这一年最动人的话|单读\n"}, {"year": 2019, "month": 1, "day": 18, "text": "随风潜入夜，哈佛游学第一期前站。\n美国·剑桥·Hyatt Regency Cambridge\n"}, {"year": 2019, "month": 1, "day": 20, "text": "讲个故事啊：从前，有那么百十来号成年人，日子过得不如意，想找个没人的角落换个活法。哪那么好找？好在那时候还有远方。\n他们背井离乡九死一生飘过大西洋，上岸之前，当家的爷么们很兴奋，决定从今不再受那奴役苦，兄弟齐心把家建。他们定了个规矩：自己当家做主，有事一起商量，不能欺负人。\n上了岸，先苦后甜，日子过得不错，中间当然也有问题，兄弟们也被老长辈们欺负过，惨得很；也有后辈们为家产打架，闹得很凶；但最后总能用那几条规矩解决。这一晃小400年过去了，这波冒险的兄弟们建起的家园让很多人羡慕，那几条规矩刚开始就百十来号人当回事，现在得有3个多亿的人在一起遵守了。。。\n这季节，走在北纬52°的波士顿自由之路上，谈点美国历史，你还会不会觉得是个冷笑话？如果给你们一块土地让你当家做主，你会建立一个怎样的世外桃源？波士顿的百十来人留下的答案是，美国。\n哈佛游学第一期DAY1《波士顿自由之路》\nStepintoHistorPLEA\n"}, {"year": 2019, "month": 1, "day": 21, "text": "中美贸易战，本质上就是官家主义大环境下的中国国企和美国民企之战，\n当然，中国民企也想搭个便车在哈佛费正清中国研究中心，吴思老师给中国人文企业家讲《中国的历史坐标和未来走向》。\n"}, {"year": 2019, "month": 1, "day": 22, "text": "哈佛是什么？就像校徽上三本书，书上拉丁字母连起来是—veritas\n（真理）。意思是哈佛追求真理，但真理不在一本书里。吴思老师说翻译成“真相”更符合当代中文语境，傅高义老师说，好。\n哈佛的本科教育主要帮助学生解答一个问题：毕业后将成为什么样的人？\n将过怎样的生活？从总统到花农，哈佛没有标准答案，但有很多榜样。\n在这里与世界各地有思想的青年人交朋友，自由的课堂里有帮你超越他们的师长。只要你愿意，随时可以泡在世界一流的博物馆、艺术馆、图书馆和哈利波特魔法学院的学生餐厅，值得20岁的青春年华。\n哈佛游学第一期DAY2Hu PheWorld Is4Floor GalleryHARVARD>>>SHUTTLEElowersGloModlsofPon\n"}, {"year": 2019, "month": 1, "day": 24, "text": "哈佛毕业生梭罗，27岁，决定向生命迈进。他来到湖畔，在自己建造的小木屋里写下-“我只看到，一个从容的人，在哪里也像在皇宫中一样，生活得心满意足而富有愉快的思想。”哈佛游学第一期DYA6\n"}, {"year": 2019, "month": 1, "day": 26, "text": "最后一课也是吴思老师在哈佛访问1年的收官之课。我们回到剑桥街1709号，这里既是吴思老师访美一年的住处，也是哈佛沙龙的定期举办40来人在几张方桌拼接的长案上，因地制宜围坐两三圈。与思想食堂的人文企业家们并坐的，还有旅居、定居、本居波士顿的诸多关心中国问题的朋友和波士顿大学教授学者，他们和1709号的主人一样，安安静静坐在局促的空间里，5个小时极少移动、克制语言、沉思致意。。。他们既是来学习，也是特意冒雪赶来，向思想致敬。\n两天后吴思老师即将回国，这一场倾囊相授和全神贯注的课短时间内难以经典重现。思想者即将远行，思想的魅力长留。很荣幸参与，用一次思想的宴席为思想者践行。\n哈佛游学《听大师讲中国》后会有期\n"}, {"year": 2019, "month": 1, "day": 26, "text": "“你老家哪里？”“湖南”，“成都”。。。“知道知道，去过去过”。。。老先生看到远道而来的的中国朋友，拉起家常尽了十足的地主之谊。\n只是周末不上班，会议室没人管，老主任也郁闷了。撞到突然出没的工作人员和学生，问可有钥匙，答日没有，然后，就没有然后了。\n没有就没有，老傅先生就坐在一楼食堂里给思想食堂的朋友开讲了。。。\n谈笑风生，仁小时后，签书，拍照。。。终于，累了，起身向客人们告饶：“我是老人家，该回家啦”。欢送。\n哈佛游学第一期《听大师讲中国》DAY3\n"}, {"year": 2019, "month": 1, "day": 28, "text": "会不会武解台湾？在哈佛费正清中国研究中心，陆伯彬教授和傅士卓教授的说法一致：太贵，不划算。学员适时提醒美国的中国专家，中国人不怕可见资本主义的规则很简单，政治学者分析战争的底层逻辑源于商业精神。有意思的是，他们和身边的朋友却都不喜欢他国商人的杰出代表一特朗普。\n他们懒得听商人总统作秀，他们更愿意通过观察总统先生做了什么来确认这位富商的意图。虽然观察至今，他们并未整明白，但已确认富商不尊重他们。他们对美国人民有信心，所以决定任由总统自生自灭。白宫最近“坏了”，他们挺开心，因为这并不影响美国人过日子。\n哈佛游学第一期《听大师讲中国》DAY5\n· · ·\n"}, {"year": 2019, "month": 2, "day": 1, "text": "一个多月前，晓波老师拉雪虎和我建了一个群“思想食堂2019”，聊到后半夜，定下了新一年的“变与不变”。\n做思想食堂第三个年头，有变，有不变。继续坚持人文课，有两点很鼓舞我：第一，要做这件事，不能躺着；第二，要长久做这件事，得站着。\n今天新课表发布，我们希望用值得反复研习的16堂名家经典课，尝试为新学友们构建一次人文认知体系。感谢关心和支持思想食堂的你，希望我们的“不躺且站”对更多人有益。\n假如你也不满意这个功利的世界，来听听思想食堂这16堂课\n"}, {"year": 2019, "month": 2, "day": 5, "text": "财富或多或少，你的独立无坚不摧；\n思想或深或浅，你的自由无人可挡。\n家以清風濡子弟人凭正载立乾地\n"}, {"year": 2019, "month": 2, "day": 23, "text": "子日：见贤思齐938天\n"}, {"year": 2019, "month": 2, "day": 25, "text": "去台北，木栅老泉山。走一天路，打一次鼓。\n杨丽萍：非常敬佩这种道艺合一、用整个生命去舞蹈、人与自然结合的风格，在其中看到了禅意，不虚此行。\n龙应台：“优人神鼓是台湾最值得推荐的表演团体”，原因是“他们让我重新思考什么是表演，什么是剧场、音乐和舞蹈”。\n他们在台北山里禅行、修练、击鼓，科比、王力宏都为之折服\n"}, {"year": 2019, "month": 2, "day": 25, "text": "论为师不易。好课不多，好老师更不多。读书的时候常去重复旁听自己喜欢的课，一般老师看到老同学都会笑脸相迎夸好学；某次听到第三遍，老师紧着眉毛轻轻道：都是之前讲过的，放过老夫吧。。。罪过罪过近一年来，厚着脸听姜老师讲“霍光立昌邑王又废之，宣帝忍霍光后灭其族”这段历史已是第三次。老师雅量，差生没有被“劝退”第二次课，老师课前专程请教了中医老师论证了麻醉剂毒害皇后的可行性，令人信服。\n这一次，老师带来了《易经》，以经解史，以史证经，经史贯通，让人不得不心生敬意。\n这就是思想食堂姜鹏老师《资治通鉴》历史通识课。\n"}, {"year": 2019, "month": 2, "day": 26, "text": "“王”于庚哲老师从西安带来严肃真诚的萌恐，春风化雨如行云流水成功让同学们回程票一改再改。无奈赶飞机出到教室门口，仍不忘回头再看一眼再听一耳朵。。\n意犹未尽。4月，跟着于老师去看秦汉唐老长安，像他的历史系博士生一样，跟老师去看你可能去过却“啥也没看到”的兵马俑、陕历博、大雁塔。。。当然，跟着长安人历史学者逛长安城，必然要有不一样的秦汉体验（此处暂按下不表，去了才知道）\n赶世长字！\n· · ·\n"}, {"year": 2019, "month": 4, "day": 1, "text": "这个世界还会好吗？\n4月，杭州。\n丛林世界\n"}, {"year": 2019, "month": 4, "day": 11, "text": "现在在大学里做学生，最自豪的显然不是修了多少学分，每门课考了多少分。而是在不经意就挥霍掉的青春年代，有幸有那么几位不一样的老师在校园里出没。更有幸，自己也曾在他们的讲台下坐过，直到多年以后，还记得讲台上的表情。这些表情总是影响深远。\n【年度教师】姜鹏：凡是教学都应该给予方法\n"}, {"year": 2019, "month": 4, "day": 14, "text": "什么是启蒙？脱离自己弄成的不成熟。\n什么是不成熟？不能运用自己的理性。\n为什么是自己弄成的？总是听别人的理性，不听自己的理性。(康德)\n那么，你有理性么？由此看，所有甘苦自饮的独立企业家值得尊敬。\n李宏图老师是思想食堂最早的老师之一，今天讲《英法启蒙思想运动》\n梳理近代世界文明的觉醒历程，与去年雷颐老师《日本明治维新启蒙》\n样，给坐在台下的学员在提供了更多对比和方向。\n：“度动人用机自己的加之千自己的不成热就态不成次是是不这第人的付静，就对通用自记的您暂无能为为。\n那人您不试优也健见身已用加之于自己的了。\n（罗与体人的一句要有情气远用学自己的维量！\n这健是会量述动的口号。“\n"}, {"year": 2019, "month": 4, "day": 14, "text": "思想者的思想永远刻在皱纹里，只把语言化作钱江水，洗涤一方。看到又一波历史爱好者被圈粉，期待吴思老师系统课。\n这是思想食堂三年来第99场线下通识大课，感谢到场的每一位学友。\n冬去春来，怀念哈佛之旅。\n"}, {"year": 2019, "month": 4, "day": 20, "text": "心心念念，重庆有课了。\n"}, {"year": 2019, "month": 4, "day": 20, "text": "今天上午，韦森老师还在上海，姜老师还在北京。\n踏雨而来，会师两江。\n"}, {"year": 2019, "month": 4, "day": 21, "text": "为什么会有学友从北上广来重庆听韦森老师？\n吴敬琏、许小年、张维迎、茅于轼、陈志武、黄亚生、韦森曾并称自由市场派经济学家“七剑下天山”，剑挑经济真相，剑指经济乱象。。。如今，\n仍活跃在国内经济研究和评论前线的恐怕只有日月剑韦森老师了。\n思想食堂通识大课第100场，韦森老师给重庆政商中坚梳理中国经济的宏观状态和未来走向。\n感谢重庆高新管委会、黄桶树财经前后18个月的张罗，感谢杭州巴九灵生态的支持。\n"}, {"year": 2019, "month": 4, "day": 25, "text": "李宏图老师和理想启蒙课庞大而精炼，句句都是精华。\n法国启蒙者是文学派，思想深刻，批判性强，把过去的一切都通通质疑一遍，如黑暗中的明灯。\n英国启蒙者是学院派，思想系统，建设性强，在痛苦不堪的旧世界里清扫铺就一条路，通往全新的社会秩序。\n比东方人早数百年拥有法国和英国启蒙运动的果实，这是西方人的幸运。\n李宏图：为什么这场启蒙运动更值得今日中国学习|思想食堂\n"}, {"year": 2019, "month": 4, "day": 25, "text": "摘一段，意味深远一一都匀一中出了任正非这么一个大企业家，现任校长希望他捐款支持。\n捐钱可以，但老任非要问校训是什么。校长答不上来，没人想这个事。\n老任跟校长说：“如果你不把校训搞清楚，不讲清楚为什么要办学校？怎么样办学校？办成什么样的学校？你不说清楚这个事，那我不能给你钱。\n校长也说不清楚。于是老任告诉校长：“你要说不清楚，我来帮你说清楚我找朋友来帮你说清楚，然后你们都认可，就按这样做，我就支持你。\n冯仑：我心目中的任正非\n"}, {"year": 2019, "month": 4, "day": 28, "text": "-老师，海德堡的哲学家小径感觉如何？\n-走过，感觉自己不是一个哲学家hhh~-那天我推着女儿的婴儿车，她才9个月大。。。一晃20年啦hhhhhh~下半年，跟周国平老师去德国，在滴滴湖上划一把。何如？\n"}, {"year": 2019, "month": 4, "day": 29, "text": "第100和101场课在重庆收了官，颇有一种承上启下的深远意义。\n吃人嘴短，想到年内还有几顿地道的红汤火锅等着，食堂的天平往西南又斜了点。\n韦森：中国经济会好吗&姜鹏：做人最忌投机取巧|思想食堂重庆首课\n· · ·\n"}, {"year": 2019, "month": 5, "day": 6, "text": "曲阜游学打个前站，孔子研究院很亲切，孔庙很大，孔府很大，孔林很大，尼山圣境很大很大很大。\n立一个小目标：这次游学最后一天，每人至少会背诵30段《论语》，然后人手一证。刷脸。进府。\n"}, {"year": 2019, "month": 5, "day": 17, "text": "技术满地打滚，科学已被遗忘。\n民主依然危险，自由从未开始。\n刘亚东说科学精神：中国1919年缺乏，2019年依然缺乏\n"}, {"year": 2019, "month": 5, "day": 22, "text": "上周末在现场为下一期台湾游学向詹老师约“宣一宴”，答日：要特别的机缘。被婉拒后一直在想，需要什么样的机缘？机缘就像火候吧，火候足时味自美，频道的文章写得真不赖。\n专访詹宏志：火候足时味自美\n"}, {"year": 2019, "month": 5, "day": 22, "text": "座位数的清，来的都是真爱。\n角度看，中国处吴思老师带深入到最底血酬定律官家主义考察和别析上海市广\n"}, {"year": 2019, "month": 5, "day": 31, "text": "如果你说中国话，这里值得从世界上任何地方飞来看一看。\n至少看一次，6.20-6.23。\n一个家族靠什么传承2500年成为“天下第一家”|思想食堂游\n· · ·\n"}, {"year": 2019, "month": 6, "day": 3, "text": "把吴思老师的7小时课堂，从波士顿搬到上海，预计9小时的课又讲了10个小时。\n感谢共建现场的每一位历史爱好者；感谢易居沃顿开大门；感谢哈佛游学扁舟先生千里驰援。\n如一次巡礼，又如一次破局。礼毕，局活。\n吴思：用生态学和经济学拆解历史|课程预告\n"}, {"year": 2019, "month": 6, "day": 11, "text": "今年上海最后一次人文大课了，四位老师用两天周末时间讲一个终极闭环1，我们从哪里来？\n2，我们到哪里去？\n3，我们该怎么走？\n4，我们有地图吗？\n《从人类学解读历！\n《中国文化如何传》\n李辉复县大学人类学余世存交著有出班Y采色体与东亚族被理体称为“当代中国是富有：\n（道德经古本合订）、（录通组）\n者之一，若有（8常道）（老\n《改革的时机与策\n（禅与创意产业》\n费勇尖教文研究方向为：中国近代思想史著有（不焦虑的活法：金别经至此)（推度百年)（历史约较通通时光：神疯子率山的八堂\n"}, {"year": 2019, "month": 6, "day": 12, "text": "传承是向后看，了解过往，了解我们从何而来，了解我们背负的历史遗产变革是向前看，预见未来，知晓我们要去何方，尝试找到继续前行的路径雷颐、李辉、费勇、余世存，4位老师讲授“传承与变革”\n"}, {"year": 2019, "month": 6, "day": 14, "text": "他们的时间，走在自己身上。\n京都有一千种美，每一种都能打动人心|思想食堂日本游学\n"}, {"year": 2019, "month": 6, "day": 15, "text": "第102场大课，请到思想食堂最早的老师雷颐先生在上海讲世界各国改革，老师风范卓然，纵横阖，余音绕梁。\n"}, {"year": 2019, "month": 6, "day": 16, "text": "不可思议却在情理之中。中国第一位人类生物学博土，耶鲁医学博士，\n33岁任教授。。。李辉老师的“复活传奇”才刚开始，等着跟老师去文明遗址走一圈\n"}, {"year": 2019, "month": 6, "day": 20, "text": "跑山，明早选修课。\n"}, {"year": 2019, "month": 6, "day": 21, "text": "“夕闻道，朝死可以”4个小时过去了，宏涛姐一口气还没歇，也不知啥时候歇。都不愿意走，\n很多人连洗手间都没去一次。。。最新PPT进度62/268\n"}, {"year": 2019, "month": 6, "day": 22, "text": "孔子博物馆，今天还有展厅看不到，三个月后举办正式的开馆仪式，咱们这次算是捷足先登了。临时改时间，特别感谢尼山圣境同仁和张磊老师、杨馆长。\n寻迹轴心时代，问道东方圣城思想食堂曲阜游学1期\n"}, {"year": 2019, "month": 6, "day": 22, "text": "一念之差，天壤之别。《论语》断句与《孔子家语》参照举例：\n民可使，由之；不可使，知之。\n杨朝明孔子研究院院长\n"}, {"year": 2019, "month": 6, "day": 22, "text": "孟华老师和学员们共同创作了一场独一无二的课。鑫姐问到巴别塔的问题算是象牙塔之外的极大惊喜。丽丽说，课到第三场，孔子终于落地了。一群人在北斗星光下追着孟老师到门口，看到宏涛姐正在和昌建老师“聊天”。她说，今晚满天的星空很亮，说明每个人的能量都有了提升。\n· · ·\n"}, {"year": 2019, "month": 7, "day": 4, "text": "思想的胜利：斯密、柏克与美国独立战争\n"}, {"year": 2019, "month": 7, "day": 5, "text": "撰文：彩霞摄影：春光夫妻学友，青年榜样。想起那首歌一一年修得同船渡，百年修得共枕眠。若是千啊年啊有造化～曲阜游学学友手记|思想食堂\n"}, {"year": 2019, "month": 7, "day": 9, "text": "人，诗意地栖居在大地上。——记不清这句话在哪里看到的？下楼，去附近bighouse售楼处去找一本叫楼书的册子翻一翻，如果没有，可能那个house还不够big。这句话的破折号后面是海德格尔，少有人在意海德格尔是不是哲学家，更少有人在意这句话最早出自诗人荷尔德林。\n写了一百多本书的大哲学家，在中国流传最广的一句话居然不是他原创的。孙周兴老师主编的中文版海德格尔文集中有一本《什么叫思想？》，\n里面有句话：“在我们这个可思虑的时代里最可思虑的是我们尚未思想。”你怎么看？\n当然，德国的老海先生还说：“这部书是我发表过的一切著作中最少被人阅读的一部，这件事或许也是我们时代的一个标志。”Mavtin Meideqger什么叫思想？\n"}, {"year": 2019, "month": 7, "day": 23, "text": "8月大课，来自北京、上海、南京、杭州的四位老师，在重庆。\n“每个企业的正反相生与两难成败，都写处境，走近老子在这三张<道德经》里的周期表里生命智慧从“竹林七贤到“魏晋风度之于中华文明\n· · ·\n"}, {"year": 2019, "month": 8, "day": 10, "text": "思想食堂发起人吴晓波老师《2019三大周期里的中国企业》\n通识大课第106场思思食堂\n"}, {"year": 2019, "month": 8, "day": 10, "text": "第一次现场听刘笑敢老师，第一次听“无为”，慷慨激昂。\n2019年8月10-1\n《如何理解老子的“无为面无不为”》\n"}, {"year": 2019, "month": 8, "day": 11, "text": "坐上海硕果仅存的航班，凌晨2点到酒店，坚持9点开讲，被夸年富力强的仇老师谦虚了一下，说一其实我也不是很年轻了，至少比汉末最大的皇帝都大。\n学历史好处多。年轻不值一提，咱们只是专业。\n"}, {"year": 2019, "month": 8, "day": 11, "text": "武黎嵩老师亮相思想食堂，讲汉与罗马。晓波老师评价是个好课题，刘笑敢老师评价我们请到了好老师。\n帝国的对视：大汉与罗什么是考国？\n开到在一起汉与罗马在本质上有零些个人专享有独权马之后无罗马，而大汉之\n"}, {"year": 2019, "month": 8, "day": 21, "text": "感谢已报名的18位同频学友，尚缺2名行走在人间的思考者。满20人全队加餐莱比锡巴赫博物馆。\n鉴于行程中有一段黑森林徒步和HB啤酒馆PK，以下达人优先——诗人，\n画家，钢琴7级，或小提琴10级，或全马选手，或啤酒D当饭一口一扎。。。\n授课师者生命的沉思德国哲学艺术之旅\n"}, {"year": 2019, "month": 8, "day": 28, "text": "文章写得真好，看完就觉得为抢到那间他住过的酒店做的所有努力都值了歌德诞辰270周年|感到自己渺小的时候，才是巨大收获的开\n· · ·\n"}, {"year": 2019, "month": 9, "day": 1, "text": "艺术家的矛盾体，流连这两幅，我猜作品左想说的是作品右。但这两幅并不在一起，有意思。\n开幕式上，画家焦小健感慨最多的居然是—可算有个像样的地方把这些画儿体面地摆出来让人看了。。。可见老师从艺艰难，画出来不易，摆出来似乎更不易。至于看不看得懂，看到了什么。那得分人了。而历来的画家历来应该都并不真的在意。\n画展的文字标题是《眼睛那片蓝》，文本取材德国诗人策兰，是画家喜欢的诗人。豁达的哲学教授孙周兴老师和画家同在中国美院，他也喜欢策兰，并在翻译海德格尔、尼采等哲学家之外，也翻译了不少策兰的诗。他对这位喜欢沉思的画家朋友近期作品十分赞赏，这次专门为画家朋友写了一篇文章，文章写得很长，核心意思是谁懂策兰的那首《花》，谁就懂了焦小健的画。但连孙老师自己都说《花》“破碎而美丽”，着实不太好懂。\n今天在现场，离开文本，他说：如果连艺术都不好玩，那这个世界还有什么意思。幸好有焦小健的画。哈哈，还是现场好玩\n"}, {"year": 2019, "month": 9, "day": 3, "text": "文科和理科，再来一次，你怎么选。\n王小波：怎么做对是科学，怎么做好才是艺术\n"}, {"year": 2019, "month": 9, "day": 5, "text": "在家人的难，出家人或有答案。\n《杭州游学一期》进山\n"}, {"year": 2019, "month": 9, "day": 6, "text": "这个点，已上完一个钟头课，吃过早斋，享用山里的回笼觉。现在去山里\n"}, {"year": 2019, "month": 9, "day": 6, "text": "从头开始，写字。\n径山禅寺\n"}, {"year": 2019, "month": 9, "day": 8, "text": "为确认钢琴家的古堡音乐沙龙，和她来自柏林的助理提前会师。\n在北京城一天两次穿越8环的能达老师说，这个被揉成一团的甲壳虫，像极了后工业时代德国艺术家们的愤怒。\n"}, {"year": 2019, "month": 9, "day": 27, "text": "第一课，孙老师在波恩的中国领土上讲回马克思，可谓意味深长。\n迄今为止，马克思作为哲学家的存在并未得到充分理解，尤其是他关于“人是劳动的动物”的论断。毕竞理解一个哲学家比崇拜一个革命家要难的多。连他自己也曾说：哲学家们只是用不同方式解释世界，而问题在于改变世界。\n孙老师用鲁迅的家乡话在使馆办的课堂可谓妙趣横生，结合他的文章，小结一下—\n1，历史很生动。青年马克思也很躁动，至少在波恩大学的一年折腾地不轻，以至于他英明的父亲直接把他弄到到柏林大学。\n2，现实很残酷。有志青年马克思为报社写的稿子鼓舞人心，却不足以养活他和他的燕妮。\n3，人还得有理想。小镇青年马克思日子过得苦的很，却在苦日子里敏锐地观察到资本主义背后的本质是工业革命带来的自然与人、技术与人、人与人的关系的变化。并有天才般对未来的思考，这在当时的宗教社会几乎是绝无仅有的，比尼采说“上帝死了”要早数十年。因为有理想，他如愿以偿把他的革命对象的女儿娶回家，又把他革命对象的儿子弄成革命战友。\n生逢乱世，有挚爱，有兄弟，有想法，大搞一场，然后余音绕梁。\n中华人民共区私民国大快馆波惠小事光德国·Bonn·Chinesische Botschaft Handelsabteilung\n"}, {"year": 2019, "month": 9, "day": 28, "text": "科隆，大教堂楼下有个车站广场。\n· · ·\n"}, {"year": 2019, "month": 10, "day": 1, "text": "都在买，顺手也提了一辆德国·Stuttgart·Mercedes-Benz\n"}, {"year": 2019, "month": 10, "day": 3, "text": "雨中探访尼采最后三年的故居，现在是档案馆，青年馆长看到我们来看尼采，很开心。他曾任孙老师教研队伍一员，升到副教授，后回国得了尼采档案馆。\n"}, {"year": 2019, "month": 10, "day": 4, "text": "到处都是歌德，和他的朋友们的故事。这栋花园里的别墅远不如他在法兰克福和魏玛的豪宅故居大，却是他落脚魏玛的第一栋物业。门口有路，路边有河，河畔有些不为人知的往事和秘密，真是个幽静而迷人的地方。\n德国·Weimar·Parkan derllm\n"}, {"year": 2019, "month": 10, "day": 5, "text": "邂逅一个遥远国度的精灵，动人心魄，又亲切可攀。她舞动的手指让我看到一种很久很久的美，难以忘怀。\n意大利钢琴家吉达布塔，在巴赫演奏的城堡演奏巴赫，李斯特，肖邦和吉达布塔的《海上钢琴师》。\n"}, {"year": 2019, "month": 10, "day": 15, "text": "受许倬云先生“从历史看领导、组织和管理”启发，思想食堂计划和你一起，回到残存的历史现场，去分析历史上那些组织的兴衰成败、领导者的功过得失。\n第一站：西安（长安），请于庚哲老师讲唐，讲玄宗，讲他做对了什么，\n缔造开元盛世，讲他做错了什么，酿成安史之乱。\n雪虎给这堂课写的导读：其实盛世离乱世，差不了几十年，经不起三两下的瞎折腾，毕竟很多危机之前都只是隐而不发，今天觉得活得还不错的我们需要有危机意识。。\n从西安开启，后续还应该有洛阳、成都、南京、开封。。。\n于痕暂讲解一唐朝的兴衰和唐太宗的功过得失行程安排\n11月22日院、碑林\n"}, {"year": 2019, "month": 10, "day": 21, "text": "这才是明年该来上课的地方啊魔幻的校舍，远离经济、政治、文化的喧嚣，外加一个让人忍不住要误会的校名，完美藏匿了一个纯粹的自由殿这里走出的大师作品太多，不需要品。重点，罗中立美术馆门口那没有马赛克的大卫兄弟，是真的。景鹏老师说，米开朗琪罗的老大卫在佛罗伦萨美术学院里，而这个高新区大卫和米开朗基罗广场上的大卫，虽然差了一百多岁，但是同一个团队用同一个模具用同样的材料在佛罗伦萨制成，\n所以兄弟俩是同一个模子刻出来的。亲生兄弟，随意鉴定。\n孙老师说，时代如此乏味，艺术必须好玩。无疑这是一个很高级、顶好玩的地方，在这里当一回老师或是学生，混上几年光阴，肯定是老了也能回味无穷的事吧\n—— 2019年 · 共71篇 ——\n2020\n"}, {"year": 2020, "month": 1, "day": 14, "text": "学富五车，子欲何求\n· · ·\n"}, {"year": 2020, "month": 2, "da th": 5, "day": 26, "text": "松赞团队为大家精心准备了丰盛的藏餐，费勇老师说修心不必非要吃苦，\n而他流连藏区一个多月，从今开始终于不用受苦了。\n松赞CEO知诗兄不会饮酒，诚恳地用藏族家人间的缘分作比，迎接大家“回来”。曹蕴老师用精彩的演讲让大家和高原开启热恋之旅。最精彩的部分是，每一位学员都向老师分享了自己此行的初心，表达方式各有不同，但因为真实，所以特别珍贵。已一一记下，守护之。\n忍不住分享以往在结业时才会出现的告白，大体归为以下三类：1，费勇老师是心中的佛。2，松赞有毒。3，余生里思想食堂若在，一定还来。\n"}, {"year": 2020, "month": 5, "day": 26, "text": "曹蕴老师的老师是“世界上最快乐的人”——明就仁波切。\n修心之前，先摸摸心在哪里。\n"}, {"year": 2020, "month": 5, "day": 26, "text": "出发前，看到同学们都在拍照，原来松赞林寺的金顶上突然降下了金光，\n和杨颖姐互勉一定是吉兆。\n万没想到，邂逅坛城。感恩子璇老师前天刚给我们讲过坛城的奥义。\n极致执着，轰然放下。\n"}, {"year": 2020, "month": 5, "day": 27, "text": "僧人讲佛，是传佛法；学者讲佛，是研究佛教；费勇老师说他和大家一样，是一个普通人对佛的智慧的好奇。他好奇30多年，分享给大家的，\n是佛的智慧的学问，是为佛学。\n费老师说，很遗憾，大部分人在快乐的时候是想不起来佛学的，只有在苦的时候才慢慢接触佛学。曹蕴老师说，她小时候的梦想是当神仙，她的佛缘恰是一首关于花的禅诗引发了对智慧的求索。\n早课间再次感知心与脑的不同，曹老师说：念头是云，觉知是天空。\n云卷云舒，海阔天空。\n"}, {"year": 2020, "month": 5, "day": 27, "text": "晚上在这里上课，白玛老师和费勇老师将就各自的文化偏爱和企业实践谈谈《商业与信仰》\n山水田园，雨中塔城\n"}, {"year": 2020, "month": 5, "day": 27, "text": "得妻如此，复何求\n"}, {"year": 2020, "month": 5, "day": 28, "text": "下雪的香格里拉，大家一致同意放弃打卡达摩祖师洞，选择守在曹老师身费勇老师一直推崇乔布斯说的那句话，“我从禅中学到的真理就是，如果你愿意跋山涉水去见一个导师，往往你的身边就会出现一个。\n早课一直在延续，看这状态，是要把早餐吃到午餐的节奏。\n"}, {"year": 2020, "month": 5, "day": 28, "text": "深夜提问：如何在文人和商人之间寻找平衡？\n费勇老师说，人生太顺，从未想过做生意发财，自己只是顺从内心的指引，然后一切都有安排。从文人到商人，身份差异很大，也着实有好几年都不好意思挣别人的钱。\n白玛老师说自己算不上文人，但要说是商人，也未免轻视了自己。你以为他最伟大的成功是松赞酒店，其实错了，他想做的远不仅仅是酒店和旅白玛老师用教导女儿的话鼓励我们：当年龄大了，懂得一点真正的道理之后，才明白人最讨巧的生活方式就是，做好人。\n两位老师都特别善解人意，一个问题就聊俩小时，顺便回答了雪虎还没问出的另2个问题香格里拉修心之旅-知行对话《执念：信仰与商业》\n"}, {"year": 2020, "month": 5, "day": 29, "text": "松赞提前一个多星期在香格里拉准备好工程帐篷和私厨团队，前天车队冒雪上山，昨天完成搭建，在泥泞中等天晴，等我们，等神山恩赐。\n感恩费勇老师召唤，感恩白玛老师，子璇老师，曹蕴老师，知诗总，安泓姐，安伟兄，洛桑兄，张敏姐和宇萌、毓翎和无数松赞同事全程加持。\n感恩同行19位同修学员。雪山见证，我们一起过林卡。\n"}, {"year": 2020, "month": 5, "day": 29, "text": "雪山下过林卡，抄经，印经幡。给远方的爱人打个视频电话，和身边的朋友同享福泽。难忘的一天。\n"}, {"year": 2020, "month": 5, "day": 30, "text": "埃德加·米歇尔登上月球后，说：一但看过更宏大的场景，你就不会像过去那样生活了。\n· · ·\n"}, {"year": 2020, "month": 6, "day": 1, "text": "斗大的字认不得一碗的豆总过节愿望：爸爸，我们什么时候去钓鱼啊\n"}, {"year": 2020, "month": 6, "day": 12, "text": "上个月的香格里拉游学，种种奇遇，现在想起来心里仍然澎湃不已。已和老师及松赞伙伴相约7月再聚。\n存好心，行好事。剩下的交给伟大的大自然，一切自有安排。\n费勇：好好吃饭、好好睡觉、别想太多一香格里拉修心之旅\n"}, {"year": 2020, "month": 6, "day": 13, "text": "他们之所以能够“安顿”下来，是因为他们怀有幻想般的希望，驱使自己去研读、创造学术思想体系、带出弟子。我曾经说：“民族血脉的新旧交替，这惊達的时刻总要有人来表现，有人选择了表现；这惊的时刻过后总要有人去承担，有人选择了承担。”殉节者表现，遗民们承担。\n余世存：至暗时刻的君子之道\n"}, {"year": 2020, "month": 6, "day": 23, "text": "自力更生，食堂终于有食堂了。\n"}, {"year": 2020, "month": 6, "day": 25, "text": "黄豆豆在杭州一直惦记着外婆家，除了想二姨家的小狗妞妞，还惦记着隔壁的小姐姐。今天得偿所愿，城里来的妞妞在村里也学会了啃骨头，小姐姐带他捞鱼，还帮他抓了只青蛙。他很难接受，妈妈不让他直呼小姐姐的芳名，得喊姑姑看小儿无赖，在乡间呼朋唤狗青蛙啄手，可算乱世一\n"}, {"year": 2020, "month": 6, "day": 28, "text": "在香格里拉小别一个月后的几位同学相聚杭州，思想食堂2020年杭州游学前站。天竺路深夜食堂，思想实验进行时。\n今晚金句：成年人的世界之所以离《红楼梦》越来越远，是因为我们和\n《金瓶梅》越来越近。\n· · ·\n"}, {"year": 2020, "month": 7, "day": 7, "text": "很快，我们就可以用想法与世界互动，而我们常常控制不了自己的想法，\n这很危险。。。毕竟，过去是说话要算数，未来可能想想就要算数。\n要补一个练习，练习控制自己心中所想的能力。\n马斯克向全球宣布：脑机接口将在一年内植入人脑！\n"}, {"year": 2020, "month": 7, "day": 13, "text": "念念无常，山有常。\n再出发。\n杭州·杭州萧山国际机场-机场综合楼\n"}, {"year": 2020, "month": 7, "day": 14, "text": "“走了那么远，我们去寻找一盏灯。\n曹老师说，最喜欢点灯。费老师提醒我们记得佛陀的留言：自以为灯。\n香格里拉修心之旅2期\n"}, {"year": 2020, "month": 7, "day": 15, "text": "从丽江到香格里拉途中，路过一个很像海德格尔小木屋所在的村庄，忍不住多看几眼迪庆藏族自治州\n"}, {"year": 2020, "month": 7, "day": 16, "text": "又见松赞林寺，天又晴了，这次走着上去。\n"}, {"year": 2020, "month": 7, "day": 16, "text": "在隆净美术馆再见子璇老师，她曾是香格里拉形象大使，是舞者、歌者，\n是画中人，现在只专心画佛。诗人北岛说她“以心入佛，以佛入心。”尽管已工作了一天，我们看到的仍然是一个神采奕奕满脸欢喜的她。她说：女人的修行就是对自己好，男人的修行就是对女人好，但不能惦记太多，只能对一个好。\n"}, {"year": 2020, "month": 7, "day": 17, "text": "上辈子有没有情人不重要，重要的是这一生谁不想宠一个女儿呢\n"}, {"year": 2020, "month": 7, "day": 17, "text": "噶丹东竹林寺上个月在修，一期修心之旅就未能得见立体坛城，但当时在松赞林寺有幸偶遇沙画坛城（图1）令大家鼓舞不已。这次不但看到了黄金的金刚坛城，居然又见僧人在做沙画坛城（图2）上天的每一次殊胜都在兆示我们行好事，做好人。\n"}, {"year": 2020, "month": 7, "day": 18, "text": "雨季的梅里雪山，和山下的人间。\n摄影：春光\n"}, {"year": 2020, "month": 7, "day": 19, "text": "高山流水菩萨低眉迪庆藏族自治州·香格里拉修心之旅-春光摄影\n"}, {"year": 2020, "month": 7, "day": 20, "text": "窗外的雪山被浓雾遮住，耐心抄经半日。被生命究竟智慧加持，神态安\n"}, {"year": 2020, "month": 7, "day": 21, "text": "周六下午小聚，山东兄弟讲山东故事第一次正式招募，来的都是朋友，学费不够场租，讲的不是课，是义气。现场揭秘在海拔3800米的梅里雪山下，一口气讲2个小时是什么体验？还有5个座，扫码吧\n(RE8) 102IEER\n"}, {"year": 2020, "month": 7, "day": 25, "text": "思想食堂终于有个供大家聚会的地方了，雪虎在这里讲《金瓶梅》里的色与空，算是思想山房正式开业了。\n感谢各位朋友支持。\n· · ·\n"}, {"year": 2020, "month": 8, "day": 8, "text": "山房小课，苦中一乐思想山房\n"}, {"year": 2020, "month": 8, "day": 10, "text": "西方哲学三大叮瞩-1，人生苦短，可别想不开。\n2，人在江湖，脑子不能糊。\n3，人心难测，有话好好说。\n孙周兴：为什么中国的年轻人都不喜欢哲学？\n"}, {"year": 2020, "month": 8, "day": 20, "text": "5月香格里拉，7月香格里拉，10月第三期如约而至，依然是“思想食堂×费勇修心课×松赞酒店”联合出品，而相较前两次较长的行程，第三期的公开行程时间减少2天，费用上也更优惠，但核心的课程都在。\n更独特的体验则在公开行程之外，将由费勇老师带领我们去梅里雪山徒步，真切的感受“行走的力量”，将连续走3天，一直走到雨崩村。\n追加的雨崩行程限12人，具体安排尚在沟通中，届时仅邀请今年已报名香格里拉的同学选购。\n费勇：为什么要去香格里拉？\n"}, {"year": 2020, "month": 8, "day": 21, "text": "有些人则不断想象，想象一个美好的世界。\n有些人不断地上路，不断去寻找隐藏在大自然中的奥秘。\n费勇：为什么人一生之中总要去次香格里拉？|思想食堂\n"}, {"year": 2020, "month": 8, "day": 21, "text": "明天9点。\n2020年第一场大课。\n"}, {"year": 2020, "month": 8, "day": 24, "text": "很荣幸承办今年的经济学家年会。本周末与张维迎、张曙光、韦森、毛寿龙、冯兴元等诸位老师在杭州共话《新经济新企业》，感谢主办方人民大学信任，感谢思想食堂优秀学员企业佰世恒财富支持。\n小范围硬核活动，有少量企业家学习座位。可扫码预约，先到先得。\n登第16届奥地利经济学年会\n"}, {"year": 2020, "month": 8, "day": 27, "text": "2年前听了韦森老师课后才知道“奥派”，然后就不断听思想食堂的企业家同学谈论，春光大哥说“奥派是企业家的最爱”。一直有和韦森老师约着系统给大家讲一讲哈耶克、杨小凯。\n文中说：在米塞斯看来，企业家的本质是应对不确定性。他们是那些“特别热衷于调整生产适应变化，以谋取利润的人；他们比一般人有更多的原创力、更多的冒险精神、更敏锐眼光；他们是推动经济进步的拓荒者”。\n奥地利学派对现代经济学的五大贡献|思想食堂\n"}, {"year": 2020, "month": 8, "day": 29, "text": "人们对谎言熟视无睹，对真相也习惯了视而不见。“真实世界经济学”奥地利学派2020年会议半场掠影。冯兴元老师引用哈耶克《通往奴役之路》\n评议张维迎老师演讲，还是荷尔得林说的对：要制造一个地狱，往往先号称要创造一个天堂。\n第7届公共政策年人民大屋第16届奥地利学派经暨第16下企业转型马克思、恩格人阶级袋况》刑家制建立公有制\n"}, {"year": 2020, "month": 8, "day": 30, "text": "《新经济新企业》论坛圆满落幕，经济学者和经济战士们报团取暖。思想食堂诸位企业家代表的企业实战奥派经济学，获得经济学者们一致称奥派年会，很奥派。明年再见。\n第7届公116届奥政束年会公共政策年会学派经室利学经济公共政策年会第7届公\n· · ·\n"}, {"year": 2020, "month": 9, "day": 12, "text": "陪于老师来出席企投会活动，上午无事来逛逛。全是人，场面有点失控，\n下次请于老师带大家游学得预留一下这个环节\n"}, {"year": 2020, "month": 9, "day": 12, "text": "1，2，3继上午被实力粉丝围观低调未果，下午在课堂继续实力圈粉。\n4，今天有9000人不远万里都挤在阳光下，鲜有人知道莫高窟地块是在三危山上被选定的。5，不是所有的飞天你都会喜欢。6，没事，咱迎着太阳走几步。7，王道士的纪念塔，忍不住叹口气。8，老敦煌研究院，“敦煌的女儿\"樊锦诗就在这担任第三任院长。9，第196窟的木檐是中国仅存三个半唐代木建筑的那半个。\n极度渴睡的下午，大漠的课堂里充满了快活的笑声，可能是讲敦煌最有趣的老师了。\n敦煌：大唐的缩影\n"}, {"year": 2020, "month": 9, "day": 23, "text": "昆德拉说，凝望仁慈上帝窗户的人是不会厌倦的。\n少不是多，慢就是慢。\n"}, {"year": 2020, "month": 9, "day": 24, "text": "每当感到“崇高”，我很羞愧。于个体的我而言，“崇高”这种情感之所以能发生，大概一半是因为“世风刻奇”，另一半则因为自己思想滑坡。突然想起12年前刘老师的语重心长，她并不担心那些不能承受的轻，反而是我们生命中有太多不能承受之重。\n米兰·昆德拉与我们|景凯旋\n· · ·\n"}, {"year": 2020, "month": 10, "day": 16, "text": "成功的男人和美丽的女人，就像河滩上的浪头；幸福的家庭，却像城里的今天我们的家庭到底出了什么问题？|思想食堂哲学课\n"}, {"year": 2020, "month": 10, "day": 31, "text": "刘东老师细论中国家庭传统沉，引傅斯年名句：\n可恨中国的家庭，空气恶浊到了一百零一度。从他孩子生下来那一天，就教训他怎样应时，怎样舍己从人，怎样做你爹娘的儿子。决不肯教他做自己的自己。\n· · ·\n"}, {"year": 2020, "month": 11, "day": 3, "text": "马国川老师公子读书习作，能看到少有的知识分子传承。\n“别说什么“初心”，因为最是初心不可靠！尝到了权力的甜头，一个人是会变的（据说大脑结构也会变化），朴正熙是一个生动的例子。在他20岁的时候，想的是脱离穷苦生活，做一个小军官；在他30岁的时候，想的是怎么逃脱死亡；在他40岁的时候，想的是成为军中领袖；在他50岁的时候，才开始想还是当终身总统好！”朴正熙（九）：终身总统梦\n"}, {"year": 2020, "month": 11, "day": 3, "text": "像自习室，是个上野班的好地方。\n北京市·PAGEONE书店（三里屯店)\n"}, {"year": 2020, "month": 11, "day": 5, "text": "摄氏26度，空气里都是热土的味道。\n共建文明家园\n"}, {"year": 2020, "month": 11, "day": 8, "text": "今天的中国人，吃饱穿暖后如何度日？早晨跑步吗？睡前1小时做什么？\n挤地铁还是开车？每个选择都不容易。\n这是个社会问题，而正在发生的商业转型或许是最直接有效的解答。基于暨大生活方式研究院5年《生活榜》趋势报告的一堂好课，期待春天在杭州举办。\n"}, {"year": 2020, "month": 11, "day": 12, "text": "前几天在广州课上费老师着意分享了他和陈坤滇藏的《行走》经历，个中艰难与收获种种，令人神驰。\n这是今年第三次进香格里拉，有幸与诸友跟着费老师，去雨崩徒步数日。\n明日会师，吾等或可皆“与点也”。\n"}, {"year": 2020, "month": 11, "day": 14, "text": "一群天南海北的中国人，相识于台北，波士顿，魏玛，京都，high在了香格里拉。\n"}, {"year": 2020, "month": 11, "day": 16, "text": "EricWang\n"}, {"year": 2020, "month": 11, "day": 17, "text": "即将离开雨崩，想起桐城张英的名句-富贵贫贱，总难称意，知足即为称意；\n山水花竹，无恒主人，得闲便是主人。\n历史书上写桐城派只说方、姚、刘。却不知“六尺巷”张家，张英是康熙的宰相，他一生梦想只是龙眠山的芙蓉溪畔有个小院。\n张英的儿子张廷玉也是宰相，是整个清朝唯一牌位进太庙的汉臣。\n"}, {"year": 2020, "month": 11, "day": 22, "text": "完整的略清晰版视频，特别鸣谢学友春光和雅淇的全程跟拍，他们就是江湖传闻里最低调的诸“贝尔们”的摄影师。大家坐2天飞机+2大巴&越野，\n当然不是就为了走2天路。你说那图啥？我。。。从冰湖下山的时候，我左腿膝盖有一阵突然不能弯曲15度以上，每坚持一秒都要进行“我不入地狱谁入”的自我动员。终于发现，骡子真好。庆幸与费老师及诸学友一起心想事成，算是给今年的香格里拉修心之旅画上一个句号。总之，雨崩必须要去，但绝非居家休闲养生之旅游目的地。推荐重点：1，松赞的五星级帐篷营地；2，阿若康巴的弦子锅庄；3，间隔时光的巨大厨房。\n【思想食堂】香格里拉修心之旅完结篇：雨崩\n"}, {"year": 2020, "month": 11, "day": 23, "text": "有种替他把剩下的英语作业都做了的冲动。\n· · ·\n"}, {"year": 2020, "month": 12, "day": 7, "text": "“江雪召唤我垂钓一种风景我茫然地钓起天地精神”余世存：“大雪”君子以寒江独钓\n"}, {"year": 2020, "month": 12, "day": 21, "text": "2年前的这个时候，思想食堂起意做哈佛游学，通过吴思老师约了傅高义先生在费正清中心和大家见见。那时候中美贸易战扑朔迷离，人们试图解读刘鹤访美的意图，也在为孟晚舟和华为忿忿不平，更为各自当时的明天也是此时的今天担忧。\n老先生看到万里之外的朋友们扛着《邓小平时代》来请他签名，很开心。\n冬天的波士顿和中国的漠河一样冷，大家围坐在费正清中心的食堂里，大事小事家长里短聊了很多。\n现在看来，那次哈佛游学已成绝响，而思想食堂也因为诸多原因差点未能成行。时间过得快，令人来不及晞嘘。\n相信当日在场的朋友都会记得老先生在雪地挂拐而行的背影。感恩同行，\n感恩遇见。\nHARVARDStep intoHistor\n"}, {"year": 2020, "month": 12, "day": 26, "text": "观感非常好，其实是堂哲学课，道理并不复杂，但画面和音乐全程动人。\n发人深省，自哭自话的《艺术与人生》们最该好好学。\n里面有不少金句，中文翻译和配音对全年龄段都很友好，主人翁是个爵士音乐人，有个反复出现的主题：今天，你爵士了吗？很像5月份在香格里拉冥想时大家喜欢的那句：今天，你觉知了吗？\n标题《soul》翻译成《心灵之旅》也很有意思。太适合《修心之旅》游学时一起欣赏了。\n6周岁的黄豆豆全程看得聚精会神，说看懂了。本想和他聊聊“生命本无意义，生活多么美妙”。又猛然觉得这样的说教实在太可憎了，不如带他再去游戏厅，一起赢个玩具过瘾。\n"}, {"year": 2020, "month": 12, "day": 27, "text": "一场言之有据、言之有物发布会。文科老师带学生做的人文研究能如此面向社会发布，值得祝贺！\n当生活开始回归，商家和广告从业者的表达习惯也在慢慢转变。可以看见，引用暨南大学生活方式研究院数据的也越来越多了。\n视频！《越科技越自然》及第五届生活榜在松山湖发布！\n"}, {"year": 2020, "month": 12, "day": 27, "text": "“今年夏天，一位从商的学生给我打电话，讲他最近要做的一些项目。我说，对这些项目我都是外行，但有一点，你这些项目有个共同特点，链条太长，环节太多。现在是一个高度不确定性的时代，这些链条中如果有一个环节出了问题，你掉到坑里，爬都爬不出来。后来他说，链条太长这句话，对他启发太大了。”\n【三言两语31】孙立平：明年，世界的不确定性不会小于今年\n—— 2020年 · 共74篇 ——\n2021\n"}, {"year": 2021, "month": 1, "day": 4, "text": "晚上发的好处是，大部分人睡一觉就忘了恨不得今夜就要辞职（TIAOCA0）的冲动\n2021年第一个工作日，我们在讨论如何辞职\n"}, {"year": 2021, "month": 1, "day": 5, "text": "接上一条。田园将芜，陶渊明辞职了，他辞的职不小，在古代叫青天大老爷，也叫父母官。细论，相当于现在的县委书记加县长加公安局局长、人民法院院长、检察院院长、税务局局长、教育局局长。。。\n注意，陶渊明辞职，是心心念念想着去“田园”写下那句“采菊东篱下，悠然见南山”。汝辞职，有自己惦记的“田园”吗？\n陶渊明的故事是费老师提醒我们的的方式。这个故事孙老师几个月前在\n《家庭哲学》课上恰好也讲过。\n孙老师喜欢尼采。关于这个事，尼采是这么说的，在这个文明的国度，几乎每个人都是为了挣钱而工作。那种誓死也不愿工作的人已经越来越罕见了，只有那些终日沉溺于打猎、旅游、冒险和爱情交易中的人，与无聊相比，他们实际上更害怕做自己不感兴趣的工作。\n在喜欢的事情上，他们全力以赴，即使是最繁重、最艰苦的工作也在所不辞；否则，他们就会一直懒散下去，就算穷困潦倒、颜面尽失。\n他们只听从自己内心的声音，哪管别人都说他们是“懒鬼”。\n"}, {"year": 2021, "month": 1, "day": 6, "text": "今日最佳冻图：\n小刚我的心太乱华仔男人哭吧哭吧不是罪小刚想哭的我却怎么哭也哭不出来合@赵雷北京的冬天太冷\n· · ·\n"}, {"year": 2021, "month": 2, "day": 11, "text": "过年好。\n· · ·\n"}, {"year": 2021, "month": 3, "day": 3, "text": "这是想斧哥了\n"}, {"year": 2021, "month": 3, "day": 4, "text": "摇摆的小胖\n"}, {"year": 2021, "month": 3, "day": 5, "text": "来看看老钓位，不在鱼，也不在钓，就这么看看，就很好。\n"}, {"year": 2021, "month": 3, "day": 7, "text": "山浅屋深，雨小书大。\n"}, {"year": 2021, "month": 3, "day": 10, "text": "需要招个人，分担一些思想食堂的基础工作，基本上是直接由雪虎和我带着做，要求有新媒体或人文课程相关工作经验，不超过1年，合适则长期培养，吸纳为合伙人。\n目前提供稳定的薪资6k，五险一金，日常坐班，出差不多，有工作午工作地点：杭州天竺路\n"}, {"year": 2021, "month": 3, "day": 12, "text": "来上海和大学班主任相聚，看到几位同级的同学和低一级的同学，13年再相见，几乎可以说是重新认识。那时候在学校，文化产业的号角才刚刚吹响，自由选课的我们似乎也没什么交流，又何曾想过会有今日一聚。从昔日的徐家麦岛到茫茫大上海，南方的海风并没有吹走他们的青春和笃定。搜寻良久，也终于看不到岁月留下什么痕迹。酒过三巡，仍然不清楚各自在做什么，就像读书时一样，彼此并不了解，却又很确信都没变。虽说手上无利剑，这又何尝不是一种庆幸。\n"}, {"year": 2021, "month": 3, "day": 15, "text": "一位地产项目总经理在集团的内部工作报告，她的员工早会不是读《羊皮卷》，而是《道德经》。很好奇，这样的团队会带来怎样的居住产品，又会营造什么样的生活方式？\n毫无疑问，跨界无处不在，但持续攀登的人总归会在山顶汇合。时代在召唤，总有人走在前面，掌声鼓励。\n道教以“道”为最高信仰。“道”无形无而又生育天地万物。“道”在人和万物中的显理“德”，故万物莫不尊道而贵德。道散则为气为神，神仙既是道的化身，又是得道的楷模。\n济世度人为宗旨。故道教徒既信道德，又拜神\n"}, {"year": 2021, "month": 3, "day": 16, "text": "听闻犬儿近日一连发生诸如上学迟到、老师抽查作业时故意上厕所、在课堂公然拒绝老师将小试卷带回家等多起劣迹，一时急火攻心乃至上头。孽障，非家法无以伺候。正欲请出传家戒尺擦拭一番，悍然发现公堂前多出四大护法，仪表堂堂，威风凛凛，老夫竟一时恍惚。正所谓山贼好防，心贼难破。怎么破？\n"}, {"year": 2021, "month": 3, "day": 17, "text": "恭喜松赞团队。今天南迦巴瓦雪山下的山居开业了，寻找快乐源泉的途中又多了一扇隐秘之门。\n去年跟随费老师3次深入香格里拉，松赞的林卡、山居、帐篷都给我们提供了中国最好的旅途保障。继香格里拉环线之后，修心之旅将继续向西进发。今年5月的林芝－波密－然乌之行就从这里开始，满团待发，值得期\n"}, {"year": 2021, "month": 3, "day": 22, "text": "去看过几个知名的书院。\n岳麓书院。大名鼎鼎的四大书院之一，内设中国书院博物馆。经湖南政府安排，已从湖师大转为湖大管理，平时在体制内培养文科生，节假日面向社会举办年费文化讲座，造福一方。\n台北书院。台北市政府新办、独立经营的课程空间，课程收费，涵盖修行、学问、艺术和生活。其山长林谷芳先生由台北市长聘请。\n尼山书院。位于孔子出生地，始于宋朝。地方已成景点，名字重现生机，\n经山东政府安排，在全省公共图书馆广设尼山书院。\n山不在高。大学之大。书院何如？\n今天，我们需要什么样的书院\n"}, {"year": 2021, "month": 3, "day": 29, "text": "斗不断的主线。\n平生不到伊犁，实为一大缺憾。\n不到伊犁，不知中国疆域之辽阔；不到伊犁，不知中国历史之复杂。\n更何况，伊犁又有独一无二绝美的景色，于是，便有了此次伊犁游学。\n二、为何要参加此次思想食堂的伊犁游学呢？\n1、时间：6月是伊犁一年之中风景最好的时节，草原、河流、雪山，都会呈现出最美的景色；\n2、地点：我们将会去到3大历史遗迹、3大知名草原，以及2次古道徒步，充分领略蕴含其间的人文风采与历史沧桑；\n3、导师：我们请到了知名历史学者于哲老师全程带队，他是研究中国古代史的专家，将带来三次主题课程，让学员们更好的理解“历史上的西域与伊犁”；\n4、同学：参加此次游学的多数是长期在思想食堂学习的朋友，他们热爱人文，喜欢阅读和行走，在事业成功的同时更加渴望精神上的成长，有这些朋友同行，亦将让行程充满乐趣；\n5、组织：思想食堂自2018年起，已经组织过多次国内外的游学，从曲阜、南通、无锡、香格里拉、台北以到日本京都、美国波士顿、德国波恩-弗莱堡－魏玛，我们并非专业做旅行，唯有用心将最合适的资源整合到一起，秉承“一期一会”的理念，给大家带来一次次绝不重复的游学体验。\n「修心之旅]2021新疆伊犁【于哲】6.5-6.13\n· · ·\n"}, {"year": 2021, "month": 4, "day": 9, "text": "准备出发，下午在山里办知行会员第2课。一堂句句见血的历史观课。\n"}, {"year": 2021, "month": 4, "day": 10, "text": "雪虎分享《金瓶梅》。为继续揭示潜规则，探讨积极的虚无主义、传播戒定慧，先为金莲翻案\n"}, {"year": 2021, "month": 4, "day": 11, "text": "中国的思想文化，从来就没有落后过世界上任何一个国家，时至今日，中国文化依旧领先于世界。可为什么到了近代，这样的文化没有让我们国富民强，反而我们的民族屡遭劫难、我们的国家步步衰败呢？\n因为：我们真正优质的文化，没有普及开来。\n当前中国最大的问题，是心的问题\n"}, {"year": 2021, "month": 4, "day": 12, "text": "上山何所求山中无所有欲知人间法下山世上游访古方广寺可性法师\n"}, {"year": 2021, "month": 4, "day": 13, "text": "可渔可樵可耕可读\n"}, {"year": 2021, "month": 4, "day": 15, "text": "三名矿工，在凌晨一点就已被救援队找到临时安置在距离地面一百米的副井底，等待等到领导们开会完成布置，等到记者们全部到位等到镜头拉到黑乎乎的井口上。最后等到的才是他们。\n上午八点一刻，他们被救援队急急忙忙抬出井口，抬进镜头里的救护车上然后，我们会看到现场的人们在鼓掌、欢呼一个煤矿工人写的诗，不忍读完..\n"}, {"year": 2021, "month": 4, "day": 21, "text": "一个好玩的事，去年在莫高窟，于老师一边走一边给我们讲西域的那些事。讲得精彩，自然有游客驻足、追随，一不小心就被内卷成导游。老师胸怀西域，西域辽阔，这种误会他自然也不会当回事。所以咱就接着走，接着讲。没想到，有几个女游客突然走上前激动表白：您是于老师吗？您是于老师，我看过您。。。在电视上。。不是吧，这离家千里还满大街的口罩，得有多熟才能认出来啊。很遗憾，看不到当时于老师口罩里面的表情眼神告诉我，他知道光天化日，藏不住了。见人围的越来越多，干脆摘下口罩，应答不暇，和诸多新老粉丝合影留念打成一片。。。\n6月，去伊犁\n"}, {"year": 2021, "month": 4, "day": 23, "text": "既然每年只有一个读书日，为什么我天天都要去读书？\n"}, {"year": 2021, "month": 4, "day": 24, "text": "因有一组同学遗憾取消计划，5月藏东修心之旅空出3个名额，重新开放招募，期待大山的缘分。\n和费老师一起深入藏区，全程入住松赞酒店，途经林芝－波密-然乌；走雪原、穿峡谷、探冰川；费老师说，所有的远行，都是为了走回自己的内心。愿我们一起在遥远之境，找到心，安住心，打开心。\n思想食堂费勇修心课×松赞文旅\n"}, {"year": 2021, "month": 4, "day": 25, "text": "南迦巴瓦-卡瓦格博-贡嘎雪山天空中没有翅膀的痕迹\n"}, {"year": 2021, "month": 4, "day": 27, "text": "这种信息看的越来越多，到底是什么出了问题？体制上的归体制，学校的归学校，家庭的归家庭。养不教，父之过。这个事，当爹的，得管管。\n还有多少假课文正在侮辱孩子的智商？\n"}, {"year": 2021, "month": 4, "day": 29, "text": "人鬼天地，万金似慷慨。\n5月见。\n· · ·\n"}, {"year": 2021, "month": 5, "day": 11, "text": "吴老师：华西村村民年分红10万+姜老师：比我工资还高，我为什么还在复旦教书吴老师：所以，田老师（上海音乐学院）已经辞职了何老师：有些职业只能卷进去直播已结束吴晓波频道7小时直播Live秀\n"}, {"year": 2021, "month": 5, "day": 12, "text": "曹德旺：我个人的成就是受益于党的改革开放的政策，我挣了那么多的钱。我想把这些钱再还给这个社会，去做一些有意义的事情。同时这也意味着一种背水一战的挑战，但我们做什么事情没有挑战？办学这件事，成则可为人生加分，如失败，你也可以想象可能的后果。因此，我对办好这所大学志在必得。\n对话曹德旺：为什么要发起设立福耀科技大学？\n"}, {"year": 2021, "month": 5, "day": 21, "text": "最近看金融业的瓜，核心体会：做金融要赚钱，最好学赌业，十拿九稳；\n其次学农业，按季收割。\n思想食堂有对夫妻学员，他们也有家“金融”公司，不专心研究赌技或刀功，却执着于参加游学，还花钱请人来听他们聊“旅行”，怪不得行业资深人士会对他们斜眼相待。\n听说我一不留神也会被教育自己不擅使用自己的财富。他们愤而急呼：如果自己用不好，又能指望谁替你用好自己的财富？凭什么要拿自己的血汗钱去考验别人的人性？\n旅行的意义—2021年518超级会员日活动纪实\n"}, {"year": 2021, "month": 5, "day": 23, "text": "在林芝，读一首叶芝。多事时节，相聚不易。旅程尚未出发，修心已经开始，祝愿明天过来的22位师友一路平安—\n我就要动身走了，去茵纳斯弗利岛，\n搭起一个小屋子，筑起泥笆房；\n支起九行芸豆架，一排蜜蜂巢，\n独个儿住着，荫阴下听蜂群歌唱。\n我就会得到安宁，它徐徐下降，\n从早晨的薄雾落到蟋蜂歌唱的地方；\n午夜是一片闪亮，正午是一片紫光，\n傍晚到处飞舞着红雀的翅膀。\n我就要动身走了，因为我听到那水声日日夜夜轻拍着湖滨；\n不管我站在车行道，还是灰暗的人行道，\n我都在心灵深处听见这声音。\n"}, {"year": 2021, "month": 5, "day": 25, "text": "预报雅鲁藏布江峡谷一周有雨。趁太阳出来，马上出发，去南迦巴瓦雪山下的河谷里徒步。\n"}, {"year": 2021, "month": 5, "day": 25, "text": "又回到春末的五月凌晨的集市人不多小孩在门前唱着歌阳光它照暖了溪河柳絮乘着大风吹树影下的人想睡沉默的人从此刻开始快乐起来\n《少年锦时》赵雷\n#思想食堂·修心之旅\n#雅鲁藏布徒步\n"}, {"year": 2021, "month": 5, "day": 27, "text": "窗外，该起了想起费老师去年修心之旅讲的《十牛图》，探索的过程充满未知与惊奇，\n怎可一步到位？这一段算是十牛之三吧，“见牛”。\n"}, {"year": 2021, "month": 5, "day": 27, "text": "费老师说，在行动中找到自己的真心。面对无常，做好能做的部分，剩下的随缘。\n从林芝到昌都，一路向上，即将入住冰川无人区。\n"}, {"year": 2021, "month": 5, "day": 28, "text": "蓝天白云，雪山下抄经。\n· · ·\n"}, {"year": 2021, "month": 6, "day": 1, "text": "国际儿童节源于对纳粹恶行的反思，旨在保护孩子的健康和受教育权。所以，儿童节的礼物，父母和老师的关心远比塑料玩具更重要。推荐耶鲁大学校长前几天在毕业典礼上的演讲，他回忆了那份影响他一生的礼物。\n对于关注儿童节的家长和老师，可以参考作家阿尔博姆的话：“是否真的有过这样一位老师？一位视你为未经雕琢但珍贵无比的璞玉的老师，可以用智慧将你打磨成耀眼光芒的珠宝？如果你有幸遇到这样一位老师，你总能找到自己的归途。”特稿|耶鲁大学2021届毕业典礼精彩瞬间全收录！耶鲁校长演讲：来自教师的礼物（附高清视频+中文译文）\n"}, {"year": 2021, "month": 6, "day": 4, "text": "马上出发，预计5小时到克拉玛依，停1小时再飞1小时，下午4点到伊犁，和飞欧洲差不多了。无怪乎孙中山先生曾言欲谋大洲则伊定都伊犁。\n还没检票，先被广播点名过去扫了几个码截屏，在机票上加个章，安检说新疆是疫情防控最严的地方。到了伊宁，无论哪里来无论有无做过核酸打过疫苗，落地必须做核酸。\n我们的资深导游，土生土长在乌鲁木齐的爱国同志说，他今天坐火车去伊犁，到站了也要做核酸。\n这一切并不妨碍机舱满员，隔壁座不认识的导游一直毫不避讳地在电话会议，恭喜他，搞定一个150人团的大单。\n#思想食堂·2021新疆伊犁历史文化之旅CA1233Yining放9天8晚\n"}, {"year": 2021, "month": 6, "day": 4, "text": "一阵雨后，下午10点，霞光上树。爱国同志和建国同志的手穿越半个世纪的风雨，紧紧握在了一起。\n"}, {"year": 2021, "month": 6, "day": 5, "text": "建国同志专门提前一天到，得偿所愿去将军府瞻仰左帅。春光同志下了飞机就奔去赛里木追彩霞，诚邀我当，忍痛婉拒。\n伊犁河畔路遇几个伊犁大爷，算是看到了和平年代炮兵风采很自然在这塞外江南，想起了传说中的西湖大爷。\n"}, {"year": 2021, "month": 6, "day": 5, "text": "实力证明，56个民族，有55个能歌善舞。\n"}, {"year": 2021, "month": 6, "day": 6, "text": "这两天在伊犁河畔看到很多安静的钓鱼人，想起皮特主演的电影《大河恋》，根据同名自传体小说改编，也是热爱钓鱼的哥俩，蒙大拿河畔荡气回肠的兄弟往事。\n吴晓波：他们看到的是同一片大海吗\n"}, {"year": 2021, "month": 6, "day": 7, "text": "嫁到伊犁的兰州的姐说，老天照顾伊犁的孩子，每年高考前几天都会下点雨，把温度降下来。你看，高考虽然重要，更重要的是别把孩子烤坏了。\n她也喜欢旅游，去过南方不少好山好水的地方，也去过那几个大城市，但都不如在伊犁舒服。\n伊犁哈萨克自治州\n"}, {"year": 2021, "month": 6, "day": 7, "text": "丝绸之路的一段，无数为钱奔波的商人们就在这里，走个120公里穿越天山，省2000公里。一路雪山洪水，泥石猛兽，看着是曲线温柔，实则九死一生。\n每年都有探险者遇难，完整的穿越线路已封禁。于老师说推测唐僧也从这里走过，下午咱们也下车走一段。\n#思想食堂·2021新疆伊犁历史文化游学\n"}, {"year": 2021, "month": 6, "day": 7, "text": "夏塔古道是本次游学最短的一段徒步，本是为后面26公里热身，没想到沿途大美。出发时下着雨，中途转晴，格外振奋。连翻了几座小山头，在藏区养成的习惯，雪山扑过来时第一反应不是欢呼，而是下意识告诫自己淡定，又马上想起这里没有高反。遂跑，大快。\n#思想食堂·新疆伊犁历史文化之旅伊犁哈萨克自治州\n"}, {"year": 2021, "month": 6, "day": 8, "text": "于老师带队，草原上的历史考古现场。能看出哪个是高仿的\n#思想食堂·新疆伊犁历史文化之旅\n"}, {"year": 2021, "month": 6, "day": 9, "text": "昨天第二课于老师讲丝绸之路，一条被误会很深的路，至少是并不经济的一条商路，但文化意义非凡。讲到晚上9点还没吃饭，屏幕上从胡琴切到胡椒、香菜...料很多，颇有点废寝忘食的趋势。今早还有一课，两位同学没吃早餐就来占座了。\n上完课，去那拉提草原，要在那里徜祥3天。\n#思想食堂·新疆伊犁历史文化之旅伊犁哈萨克自治州·那拉提草原-河谷草原\n"}, {"year": 2021, "month": 6, "day": 9, "text": "喝过奶茶，从哈萨克毡房出来，录一段草原上的好嗓子，天山上有金雕盘\n"}, {"year": 2021, "month": 6, "day": 10, "text": "有欢歌笑语，也有不足道之苦旅。下个节目，26公里徒步\n"}, {"year": 2021, "month": 6, "day": 10, "text": "这个40岁的哈萨克族汉子，骑摩托带媳妇和儿子在山顶上兜着风巡山。\n13岁的丫头不知在干嘛，4岁半的儿子没有动画片看，也没有打架对象，\n爱好是骑马、俯卧撑和仰卧起坐，山上那些数不清的牛羊和马匹都是他的我以为他是职业骑马爱好摩托，直到他放下水桶跳上秋千，我知道自己肤浅了。他的生活与我们无关，他的快乐不需要观众。\n伊犁哈萨克自治州·那拉提草原-河谷草原\n"}, {"year": 2021, "month": 6, "day": 11, "text": "今天真走不动了，下午换个草原，骑马。\n课，早上完了\n"}, {"year": 2021, "month": 6, "day": 12, "text": "出来10天，看此水此位，想回家了\n"}, {"year": 2021, "month": 6, "day": 13, "text": "落地北京，9天的新疆伊犁游学结束了。感恩于哲老师带队同行，让大家在猝不及防的疫情局势下迢迢万里相聚。于老师依旧是慷慨激昂怒慰一切不平，如批判中国传统男权日“盛世需女人点缀，乱世要女人背罪”这次游学时间长，距离远且徒步多，途中不乏脑力和体力双重挑战，难得各位一路互帮互助，一起上过课，一起徒过步，建立了超越普通男女同学感情的阶级友谊，这革命感情可谓固若金汤。连历来惜字如金的建国同志，都在临别之际徐徐朗诵起仓央嘉措的长诗，令人惊叹，叫人惆怅。难忘此情此景，雪虎有诗为记一五月赴波密，六月至伊宁。\n天南地北客，星聚弓月城。\n旧迹难寻见，唯余桑与杏。\n苏帅驰骋日，一战平胡戎。\n古道访夏塔，草原寻空中。\n观鹰忽上下，策马自西东。\n石人散落处，荒野立坟莹。\n牛羊自得乐，何须牧人横。\n"}, {"year": 2021, "month": 6, "day": 18, "text": "京郊非重点小学生黄豆豆，在随父拜访大学教授的旅行途中，临时给自己安排了点作业，写完给自己评了一个个人语文史上最高同时也还颇有余地的分数。\n"}, {"year": 2021, "month": 6, "day": 21, "text": "为革命，做社会主义大保健。\n#落枕后流浪在世界核心\n"}, {"year": 2021, "month": 6, "day": 21, "text": "在按摩师王大楠大夫的6号诊室，哥们趴在床上发出了震惊自己的惨叫。\n15分钟后，带着失声的羞愧和上了贼船的懊悔来到地下1楼的理疗区。\n分诊台没人，惊魂未定正举棋不定之际，出现了一个娇小可人的背影，领我进了这绿帐。在床边坐好，让背对着她，脖子上被凉凉的一番摸索之后，耳边传来一声北方女大夫少有的软语：11号，有感觉了吗？苍天在上，因落枕而积攒的厌世值瞬间跌停，就这一句医者仁心，值了。\n后脖子上传来过电的感觉，微电脑发功了，又15分钟后，决定先不退医疗费了，至少有勇气明天再去找人民好大夫王大楠同志一次。\n一通操作猛如虎，革命工作不说苦\n#热烈庆祝建党100周年\n#社会主义健康大保健\n"}, {"year": 2021, "month": 6, "day": 25, "text": "禅门温柔，今晚全素。吃完这一顿，算是彻底从西域回来了\n"}, {"year": 2021, "month": 6, "day": 26, "text": "#知行会员·第三课“生活的意义，正因为总不让你活成想要的自己。\"因为有两位小学生早早赶来上课，姜老师格外语重心长接下来两天，姜鹏老师在灵隐给大家分享《资治通鉴》与《心经》。\n感谢一杯活法空间场地赞助。感恩念老，转眼间，距离春天和姜老师在永福寺相聚已三个月。\n"}, {"year": 2021, "month": 6, "day": 26, "text": "读万卷书，行万里路。\n接着姜老师《资治通鉴》的年代背景，雪虎分享苏东坡，看到小学霸们记笔记的热情，这大概是思想食堂最接近一种可以成功的商业形态（官方日：教培机构）之巅峰时刻么\n《自题金山画像》\n· · ·\n"}, {"year": 2021, "month": 7, "day": 1, "text": "早上送孩子去学校，回家路上有队列在头上隆隆飞过。看到这壮丽的景象，早点铺子门口的大爷大妈都很激动，纷纷仰面拍照，我也捧着手机，\n记下了这一刻。\n在这个热闹的日子，我忽然想起少年时代，独自拜谒老家山后陈独秀墓时的冷清，想起了他传世的《新青年》、《中国共产党宣言》，和他看起来并不幸福的人生。是啊，那个年代的党员何来幸福可言，据说咱们今天的幸福就是他们当年埋在心底的幸福所在。\n为此幸福，应该感谢百年前那一代勇敢的党员。也祝贺身边在各岗位上努力工作认真生活的党员朋友，今天是个值得骄傲的日子。祝你们身体健康，生活幸福。\n设有理想何必远方\n"}, {"year": 2021, "month": 7, "day": 9, "text": "敦煌，有两样最让我惦记一日沙葱跑蛋，二日马特葡萄8.18\n"}, {"year": 2021, "month": 7, "day": 20, "text": "最近没见出去浪啊在家训娃，筹备着走趟敦煌还是你日子舒服，羡慕你们敦煌内容不错啊，报名挺多吧也没打算多招，还差点啥意思，王总要包场？\n就说差多少人吧总数就20，王总有多少人到底差多少还差15人，王总搭把手都给解决了吧一王总？\n记一次日常沟通。我的工作呈现在朋友圈上的冰山一角时不时会让老王抓狂，所以偶尔我也乐于陪老王逗逗闷子。\n比较成熟的官宣应该是这样：由于部分原来有兴趣的同学这次都不能同行，敦煌游学还有一些名额期待有兴趣的朋友同行。\n我们不打算取消这次行程，不是我们任性、不懂商业，没听过有种投资策略叫及时止损，而是我们不想让前面和于老师、和敦煌那些知道思想食堂名字的人，还有已经报名的几位同学，白白为此付出几个月的沟通、忙碌和期待，只留下一声叹息。在商业领域，据说这叫沉没成本不可估量？\n因为莫高窟A类票要提前近一个月预约，今晚提交名单，敦煌游学出发之前真不想再发敦煌了。\n香格里拉亲子游学本周末开始，明天带我儿提前过去。\n其体行程\n"}, {"year": 2021, "month": 7, "day": 26, "text": "姜老师第一课《历史上的诸葛亮们》是想解答一个问题，如何让孩子对历史感兴趣。\n开场故事：三个臭皮匠，真能顶个诸葛亮吗？\n向11位家长朋友开宗明义一让孩子学历史的好处：不容易被骗。\n丽江市·丽江阿若康巴-庆云庄园\n"}, {"year": 2021, "month": 7, "day": 27, "text": "#让孩子与历史学家同行·暑期亲子游学姜老师第二课，开题引子：历史是变还是不变的？\n12岁的粉色小高同学因为近水楼台被突然点名，众大小同学正苦思老师此题用意何在。只听子轩同学不紧不慢道：我认为，历史是指已经发生过的事，那么既然是发生过的事，自然是不变的。\n姜师怒赞一该生在哲学领域极有天赋。\n"}, {"year": 2021, "month": 7, "day": 28, "text": "马背上的一天，孩子们自在欢喜，几位家长略受颠沛。\n暑假是用来玩儿的，我们不给孩子补课，我们只是让孩子和老师在劳作了一天后，坐在结满苹果的大树旁，聊聊天即将启程去香格里拉。在丽江度过了很自在欢喜的三天，感恩庆云庄园和松赞酒店的朋友们。期待再见一场教辅未遂的游学\n#让孩子与历史学家同行\n"}, {"year": 2021, "month": 7, "day": 28, "text": "看了金沙江，再也不纠结前浪后浪了，因为咱压根不算浪。饭后消消食，\n浪声极度舒适。\n"}, {"year": 2021, "month": 7, "day": 28, "text": "行至神性弥漫的香格里拉，孩子们很自然地跟着唐卡画家华旦老师用心描募人生第一副唐卡作品，在不知不觉中亲近佛菩萨的智慧。\n跳罢锅庄，独克宗古城大佛寺的金光璀璨，孩子们和父母一起做在火塘旁，听阿若康巴创始人扎巴先生讲马帮故事，讲他和祖国和父母的恩情往事，为了一条牛仔裤跟着父亲走马帮走到欲哭无泪。扎巴先生长在印度，\n普通话比较难懂，孩子们都耐心坐着，陪着各自的爸爸妈妈。\n自去年雨崩之行与这里朋友结缘，很感慨狭小的滇藏商业世界中有这样几位走心的朋友。\n"}, {"year": 2021, "month": 7, "day": 29, "text": "昨天在丽江松赞遇到爱笑的尼玛，今天在松赞林寺遇到会唱歌的加措，纯朴的藏族朋友，一年前就是他们两位带着我们走进松赞林寺，踏上修心之旅。\n久别重逢，然后相忘于江湖。\n"}, {"year": 2021, "month": 7, "day": 29, "text": "第三课《何以家运独长久》\n课前试笔，鸦雀无声\n"}, {"year": 2021, "month": 7, "day": 30, "text": "历次游学最接近理想的野营地。帐篷外是世界上最美的香巴拉，蓝天白云，草绿花密，鸟鸣马驻。帐篷里有25℃的暖气、还有和家里一样的干净卫浴，孩子们昨夜泡完澡，此刻应该都还在做着香甜的梦吧。\n豆哥又在床上翻了个身。年纪大了觉少老父亲要出去走走了\n"}, {"year": 2021, "month": 7, "day": 30, "text": "响午，自发加了个课，给同学们点赞。\n下午去湖边野餐，再加个项目赏一下：骑马漫步，简称：马步\n"}, {"year": 2021, "month": 7, "day": 31, "text": "带豆哥落地北京。为期7天，我们执行了11天的#暑期亲子游学结束了，\n感恩姜鹏老师。我们与家长和孩子们一起跟着历史学家同行，本质上是为了未来，为了在读书行路的过程中，探索一种今天中国理想家庭的范式，\n就像鲁迅在《我们现在怎样做父亲》中思考的那样：肩住黑暗的闸门，放他们到宽阔光明的地方去。\n三堂课下来，历史告诉我们：对人性不能抱有幻想，而面对这一双双清澈的眼睛，想起这个世界的未来就在他们手中，我们唯有相信人性。不论是去看洛克，还是走茶马古道，亦或参访松赞林寺，绘制唐卡，听课写字，\n姜老师从历史得出的结论是：一个人的真正成功，是做自己。越早越好。\n作为执行方，这次游学最大的心得：让孩子“吃苦”，并不等于要带着他们体验各种因成年人的不负责任导致环境脏乱差，也不等于毫无道理地让他们放弃独立思考的能力去适应所谓丛林法则，学习“狼性”。。。事实上，\n如果能在物质上尊重他们在家生活的习惯和品质，再在时间和空间及思想上对他们有所引导，才是更友好和有效的陪伴方式。\n最后，意料之外却在情理之中，这些优秀的孩子最让我们显而易见的，并非他们过人的才华名师名校等等，而是他们都有着显而易见的，优秀的父\n· · ·\n"}, {"year": 2021, "month": 8, "day": 12, "text": "最近因疫情接连取消游学计划。晚上写完字，看到子璇老师拍摄的松赞林寺，真是动人心弦。\n北京市·首都师范大学附属中学（通州校区）\n"}, {"year": 2021, "month": 8, "day": 13, "text": "为了这口汤，得过个节。\n#传统佳节七夕快乐\n"}, {"year": 2021, "month": 8, "day": 21, "text": "为了这条媲美苕溪的水，春天开2个半小时的车程今天堵了5个钟头。进了山里，很快天就黑了，看着月光下惬意的那几家人，我忍不住搭山：你们的生活太让人羡慕了。烤肉架子后的兄弟乐了，挥着膀子擦了一把脸，\n我还是没看清他，就听到：哈哈，哥们快别这么说，你们不也在这里。\n"}, {"year": 2021, "month": 8, "day": 27, "text": "楼下中学操场的音响在试音。感受一下这音质。想起去年除夕夜，窗外还是漆黑的钢铁工地。由于烟花炮竹是计划供应品，所以大过年的，几乎看不到谁家的烟花，听不到几声鞭炮响，倒是有钢筋上飞溅的火花和不绝于耳的电焊声。这个工地全年无休，常常因施工到下半夜被群众投诉，如今篮球架立起来，想想过几天，该有少年们在楼下挥洒青春，简直想重回校园。忍了一年的噪音，音乐一响，终于赏心悦目。我社会主义劳动环境越来越好，有点惭愧拖了共同富裕的后腿\n· · ·\n"}, {"year": 2021, "month": 9, "day": 10, "text": "教师节，坐在这个黑色的角落，用电脑给远方的老师写了一封信。从下午写到黄昏，写完通读两遍，没有病句，又改了几个错别字，仔细调整字体和间距，另存为PDF，微信发出。一个时辰过去，未收到回信，开始有点坐立不安\n"}, {"year": 2021, "month": 9, "day": 14, "text": "10月底请费勇老师为知行会员讲修心课，地点选在天台山。\n因为永福寺月真法师和念顺法师的引荐，春末的时候探访过一次。一路高山流水，走过很多古色古香的寺院，遇到一些很有个性的出家人，也意外看到一些来自日本的石碑，上面刻着怀念与敬仰。这是个被忽视和低估的好地方。\n我最难忘的是去石梁的途中，在溪边的农家吃了一碗鲜美无比的竹笋肉片\n《法华经》中的修心智慧|思想食堂·知行会员课\n"}, {"year": 2021, "month": 9, "day": 15, "text": "来广州探访闭关写作中的费老师，敲定了修心之旅系统课方案。这套课程谋划了有半年之久，从读经开始，辅以徒步，贯穿艺术和交流体验，希望探索一种美好中国人的生活方式（过日子）提案。预计11月开始招募。\n头脑风暴5个小时，全程高能。费老师谈到创作中的新书《苏东坡》，怡然自乐。他说，苏东坡最厉害的是让自己快乐的能力，而这个能力根植于他对市井生活的热爱。身为传统土大夫文人，不论事业命运如何窘迫，他也从未放弃把平常日子过好的努力。\n感觉对于东坡大爷，没有什么事是一顿红烧肉过不去的，如果过不去，那就加一壶酒。而今我们每天忙忙碌碌，谁有时间做红烧肉，谁在关心过日子。扎心\n"}, {"year": 2021, "month": 9, "day": 16, "text": "书架上的拷问-\n《何为良好生活》\n《长大了就会变好吗》\n深圳市·唐宁书店(蛇口汇港购物中心店)\n"}, {"year": 2021, "month": 9, "day": 21, "text": "在山里翻一本奇书《禅与摩托车维修艺术》，写的是作者骑摩托车遛娃的故事，记录真实而丰富，充满哲思，比如刚看到的这句：我们从所观察到的无穷景致中选出一把沙子，然后称这把沙子为世界。\n"}, {"year": 2021, "month": 9, "day": 22, "text": "回城堵车很晚回家，略疲惫。收到费老师团队设计的明年修心日历，前几天在广州已看到样本，知道里面的一笔一划一字一句都是原创。提前拆开，细品插画和字体尤有禅意，韵味十足。想起马上国庆，圣诞也就快了，不如趁此团圆佳节，给大家拜个早年咱们不等2022，就明天起，\n祝你顿顿有饺子，日日是好日晚安。\n空静+来.创造可爱的\n"}, {"year": 2021, "month": 9, "day": 23, "text": "和曹老师结识于去年第一期修心之旅，在那个春末的5月，我们逃离樊笼，放下一切，邂逅了高原上醉人的花香。如果你相信相由心生，那么曹老师一定有一颗宝藏的心。\n曹蕴：与“正念”相比，你更需要的是“觉知”\n· · ·\n"}, {"year": 2021, "month": 10, "day": 28, "text": "在天台准备课程，造访华顶云雾茶园。突然站在喝了三年的茶叶生长之地，有种能量被激活的感觉。18年春，因永福寺月老结缘此茶，当时因茶叶盒上僧家清供四字，未擅行销，一直以礼品赠送给师友。今日山中偶见茶树开花，尤觉珍贵。花开花谢，落籽成茶。传说千百年前这里的茶籽随大诗人谢灵韵到杭城，成就了西湖龙井；也随留学僧荣西漂洋过海成就了京都的宇治。\n"}, {"year": 2021, "month": 10, "day": 30, "text": "知行会员第4课，算起来也是第118场线下课。\n"}, {"year": 2021, "month": 10, "day": 31, "text": "下山上山，农田心田。\n· · ·\n"}, {"year": 2021, "month": 11, "day": 1, "text": "20多个人走了近二十公里山路，终于到了通玄寺，当家允源法师在罗汉堂请大家喝茶，一个多小时，跟着茶师用腹式呼吸法喝了七碗茶，穿一件短袖也喝出了汗。每个人都喝出了不凡的体验，费老师说终于明白为什么苏东坡特别推崇卢全的写的7碗神仙茶一一碗喉吻润，二碗破孤闷。\n三碗搜枯肠，惟有文字五千卷。\n四碗发轻汗，平生不平事，尽向毛孔散。\n五碗肌骨清，六碗通仙灵。\n七碗吃不得也，唯觉两腋习习清风生。\n蓬莱山，在何处？玉川子乘此清风欲归去。\n大智若总\n"}, {"year": 2021, "month": 11, "day": 7, "text": "余世存老师的大时间观。\n天地有大美而不言，人间无恒业常噪。\n立冬|立冬之天地不言\n· · ·\n"}, {"year": 2021, "month": 12, "day": 1, "text": "走了那么远，我们去寻找一盏灯。这是顾城的诗，3年前，我们以此与思想食堂的学员共勉。如今走了那么久，我们终于听到，佛说，自以为灯。\n现在，你也听到了思想食堂商业实践第5年，一次告白：我们要做的游学就是“修心之旅”，\n我们要做的事业也是“修心之旅”。你来，或不来，我们会更少一些期待，\n多一些认真对待。\n原来走的快，总以为人世间最好的事，莫过于我从远方赶来，恰巧你们也在。现在走的慢，看到的不太一样，其实更好的事是，走了那么久，居然修心之底从思想食堂到修心之旅\n"}, {"year": 2021, "month": 12, "day": 26, "text": "孙老师在清华北大都做过全职教授，因为他对这个社会有话说，经常请朋友分享他的茶；又因为说真话，他也没少被请“喝茶”。今春和吴思老师因西湖龙井谈喝茶的境界，说起孙老师的退休生活，吴老师说他在北京的圈子里公认是会喝茶。这篇文章里，孙老师主要讲了他为什么会不教书卖茶叶，堪称“学而优则商”的从容自白。\n孙立平：从大兴安岭到海南岛\n—— 2021年 · 共94篇 ——\n2022\n"}, {"year": 2022, "month": 1, "day": 4, "text": "吴老师：为什么荒谬的生活仍然值得热爱？不妨读读下面这些句子，它们或许代表了加缪的答案。\n“攀登顶峰，这种奋斗本身就足以充实人的内心。”“真正的救赎，并不是厮杀后的胜利，而是能在苦难之中找到生的力量和心的安宁。”“如果你继续去寻找幸福是由什么组成的，那你永远不会找到幸福。如果你一直在找人生的意义，你永远不会生活。\n“生存本身就是对荒诞最有力的反抗。”“在隆冬，我终于知道，我身上有一个不可战胜的夏天。”吴晓波：三十岁之前一定要读加缪\n"}, {"year": 2022, "month": 1, "day": 10, "text": "一个人要走多少路，才能成为一个真正的人？一个人要读多少书，才能发出人性的光？\n鲍勃迪伦曾说，答案在风中飘荡。\n请保持你心里的光，因为不知是谁会借此走出黑暗|曾焱冰新\n"}, {"year": 2022, "month": 1, "day": 18, "text": "关于这场火山爆发对我们的影响，可以参考上一次—1815年火山爆发后，1816年成为所谓「无夏之年」，具体表现是：\n美国东北部5月出现霜冻，大量农作物被冻死。6月，加拿大及美国新英格兰出现两次暴风雪。7月至8月，宾夕法尼亚州仍有河流结冰。\n刚刚结束对拿破仑作战的欧洲，面对突如其来的天气变化，根本无力应对，农作物失收，大批家畜死亡，粮食短缺普遍，德国等地在8月出现霜冻，约有20万欧洲人死于这次的极端天气。\n而在中国，1816年是清嘉庆年间，农历八月「天气忽然寒如冬」，滇西地区连续三年冬季降雪，云南全省饥荒，史称「嘉庆云南大饥荒」，东北地区农历七月霜冻严重，安徽、江西等地亦有农历六、七月降雪的纪录。\n当然，目前来看，这次火山爆发并没到达VEI7的程度。但即便VEI6，影响也是巨大的。\n汤加，一个国家就这样失联了\n"}, {"year": 2022, "month": 1, "day": 20, "text": "关于今年今日，最好的提示：\n在大寒的日子，天地间经历了漫长的封冻，有心人已经听见了震动的消息\n—余世存余世存说二十四节气|大寒\n"}, {"year": 2022, "month": 1, "day": 28, "text": "喝了白酒，微之后放起烟火，电车载着朋友圈疾驰，想起白河、苕溪和瓦尔登湖。又忽然想起前些日子读过的木心，和他生活的纽约《杰克逊高地》，他写过一“蓝紫鸢尾花一味梦幻，\n都相约暗下，暗下清晰和蔼委婉不知原谅什么诚觉世事尽可原谅。”在这雨雪纷纷的南夜，\n年关将至，\n世间本该充满福音，我不知该祝福什么，\n但觉一切都该祝福。\n"}, {"year": 2022, "month": 1, "day": 31, "text": "吃团圆饭，过吉祥年。\n· · ·\n"}, {"year": 2022, "month": 2, "day": 1, "text": "路漫漫其修远兮，\n吾实在熬不住了，晚安\n"}, {"year": 2022, "month": 2, "day": 6, "text": "今晚全程静音看的女足，别问为什么。分享一段杨澜的视频，关于国家、女足、荣耀，冬奥开幕那天忍住没发，等赢了冠军再看，带劲。女人的荣耀就该有女人讲述。\n2001年在莫斯科进行申奥陈速Ms.YANG Lan11世纪宋朝的时候\n"}, {"year": 2022, "month": 2, "day": 21, "text": "有一次，有个学生偷了别人的东西，作为学监的夏可尊很着急，向李叔同请教对策。李叔同的办法是，学监先向学生认错，因为学生偷东西，是老师没教育好。然后宣布偷东西的学生出来认错，如果学生不认错，老师将自杀以谢罪。他说，君子无戏言，话说得这么重，学生一定会出来认错的。夏可尊担心，万一学生不站出来认错怎么办。李叔同的回答是，那就自杀呗，怎么可以欺骗学生呢？夏可尊最后到底用了什么法子，他没说，好像也查不到关于这件事的“后续报道”。\n能查到的是，这个学校后来出来了音乐教育家刘质平，美术教育家吴梦非、李鸿梁，文学家曹聚仁、蔡弓因、黄寄慧，还有画家丰子恺、潘天寿、沈本千...\n当然，这些文化人的名字你可能都没听说过，但你一定听说过这所位于杭州的的师范大学\n3月，杭州，追寻弘一法师|游学招募\n"}, {"year": 2022, "month": 2, "day": 26, "text": "俯仰皆苦人间自愈\n"}, {"year": 2022, "month": 2, "day": 28, "text": "鲁迅：自从有这种牛痘法以来，在世界上真不知救活了多少孩子，—虽然有些人大起来也还是去给英雄们做炮灰，但我们有谁记得这发明者隋那的名字呢？（在隋纳医生之前，仅18世纪欧洲因天花病死1.5亿人）\n鲁迅：杀人者在毁坏世界，救人者在修补它，而炮灰资格的诸公，却总在恭维杀人者\n· · ·\n"}, {"year": 2022, "month": 3, "day": 5, "text": "思想食堂「修心之人」系列之天才李叔同：\n他曾经是艺术家，绘画、戏剧、篆刻、音乐、书法，都非常擅长，作为教育工作者也很成功，培养出了非常多优秀的学生（如画家丰子恺，音乐家刘质平），但他毅然决然的舍弃了这一切，剃度受戒，非常明确的做了和由风华才子到云水高僧，由李叔同到弘一法师，这一戏剧性大转折，为时人留下了不尽的惊愣和感叹，也为后人留下了一个深奥的人生和历史文化\n3月中旬，追寻弘一法师的足迹，品读他的传奇人生。\n人到中年万事休：当李叔同成为弘一法师\n"}, {"year": 2022, "month": 3, "day": 8, "text": "如果某一天需要被纪念，一定是因为那天发生了特别的事，不能忘。\n"}, {"year": 2022, "month": 3, "day": 12, "text": "收到近半数简历，各位企业家在个人经历一栏普遍低调，惜字如金思想食堂主要是企业家社群，但报名咨询里印象最深的是1位牧师，和另1位大学里的理工科副教授，真是没想到孙老师要求这是个讨论真问题的班，期待他知行合一的酒神精神。王院长希望这是个实干家和理论学者共同组成的学术共同体，所以一定要在校园里，用正式高级研修班的流程和仪式赋予教学严肃性。\n这么用心的老师，这么优秀的同学，费用已是全国最低，值得。百战归来，索要过简章的同学抓紧填简历。\n生命哲学\n"}, {"year": 2022, "month": 3, "day": 13, "text": "看到x春老师的朋友圈视频，画面应该是通往神瀑的路上，仙踪雪野，心驰神往。不知何时能再去雨崩\n"}, {"year": 2022, "month": 3, "day": 15, "text": "复旦哲学教授对企业家的殷切期望：要做社会贤达社会贤达就像精神贵族，是几代人修养出来的。年青一代有为企业家应该充分意识到这一点，从现在开始学习修养起来，至少要在有限的社会生活范围里，做贤达人。\n王德峰：企业家应有哲学修养，否则只能叫老板\n"}, {"year": 2022, "month": 3, "day": 23, "text": "山中天籁，卓然世外。好久未去永福寺放空了，看到能诚法师视频，格外惦念，哲学班开课前一定要再去一趟。\n"}, {"year": 2022, "month": 3, "day": 25, "text": "人到中年，有人仰慕弘一，有人暗羡西门。弘一法师自然是学不来的，那也断不可学错了西门。「修心之旅」雪虎分享99本修心之书之《金瓶梅》现在开播，扫码即看。\n天西人尼成年人为何要读下《金照南》？\n8882\n"}, {"year": 2022, "month": 3, "day": 26, "text": "溪水潺潺，流向远方。想起那年魏玛，三五同学，跑在秋日的伊尔姆河畔，身姿轻盈。\n杭州市·灵隐寺-飞来峰-冷泉溪\n"}, {"year": 2022, "month": 3, "day": 30, "text": "非常时期，昨日惊闻余老师叹息：汉语失去了命名和判断。早晨突然读到半首诗，第一次读塞尔努达，感谢北大赵振江老师的译文，原字敲给你看南方是一边歌唱一边哭泣的荒漠这声音不会像死鸟一样消亡向南方发出它痛苦的欲望开拓出一个缓慢地生活着的回响我愿混迹在如此遥远的南方那里的雨水如同玫瑰含苞待放\n· · ·\n"}, {"year": 2022, "month": 4, "day": 2, "text": "无挂碍故无有恐怖\n"}, {"year": 2022, "month": 4, "day": 3, "text": "很久没进城，竟有点陌生。每个人似乎都在用自己的方式诉说，亦或沉默，又似乎全然未得知音。不知为什么，突然想起很久前的波士顿唐人街，在那里偶然看到的天安门事件纪念碑。未经他乡，何谈故国。\n"}, {"year": 2022, "month": 4, "day": 4, "text": "今日和老友举家相约潭柘寺踏青。临行前，观怡默老师庚子年飞赠手书\n《心经》。怡默老师系台北游学一期学友，非云门中人，字如其人，兰质蕙心，皆唤兰姐。感恩此二年有此一卷，消解几多贪嗔。此行心中念亲念友，亦念自己，愿皆远离颠倒，得自在。\n波日放子\n"}, {"year": 2022, "month": 4, "day": 9, "text": "我们即将亲历2个超级事实：77天后，成都成为世界中心。然后再77天，杭州成为亚洲中心。\n这两件大事，会如何确保顺利进行？如果没有调整的计划，在病毒防控政策持续作用下，会给我们的工作和生活带来怎样的影响？\n很多事，正悄悄发生着。没人提及，并不意味着就不必被提及，更不意味着它们将不会发生。古语云：君子居易以侯命，小人行险以微幸。\n光“全球发布06/26 20:00212320年第19属登运会\n"}, {"year": 2022, "month": 4, "day": 13, "text": "恭喜海总，单人单车单机，走珠峰闯新疆巡海南，从见路不走到行路不难，从人生小白走成自由初阶。理工男嘴笨，3个月不出100字（如下）\n，想说还没说的都在视频里一人生路都在脚下生命的意义让我们心生困惑带着迷茫，我选择用双眼看看这辽阔山河用镜头记录脚下的土地丈量生我养我的地方路就在脚下我想告诉自己行路不难\n"}, {"year": 2022, "month": 4, "day": 14, "text": "围观余世存老师给青年人的淳淳直播，评论区好气又笑。年轻人，你在想啥呢，咋就这么直抒胸臆了？\n余老师也慈祥的笑着背起他的书：年轻人，你的职责是平整土地，而非焦虑时光。你做三四月的事，在八九月自有答案。一《时间之书》\n小时候觉得自己改变世界，长大是苟且，膜太理智和人清醒，是否真的不适合只要他退一步就会退一万步。难道真老师，我27岁，焦虑35岁不能退休，我想之后做闲云野鹤，但是现在看来遥遥无期，\n我有点清醒不过来\n"}, {"year": 2022, "month": 4, "day": 16, "text": "在大家把掌声给了吴敬琏、王克勤、龙应台、姜文..之后，尽管大家坐了一下午已疲倦不堪，但崔健催生了我们。——被誉为“当代中国最富有思想冲击力”思想者之一的余老师，如此形容他在北大百年讲堂听崔健。\n余世存：梦中的崔健\n"}, {"year": 2022, "month": 4, "day": 20, "text": "这几日一直惦记这张“西迁图”。和很多人一样，曾无限向往战火中的西南联大，那是心中不可逾越的人文教育丰碑，但突然发现，自己对那段历史其实知之甚少。先且不说西南联大校训“刚毅坚卓\"四字，就没记牢。更不必提同时期在硝烟中迁移的西北联大、长汀厦大、北碚复旦，还有遵义的湄潭浙大。今天就说浙大，37年9月开始，辗转天目山、建德、江西吉安、泰和、广东三水、广西宜山、最后落脚遵义，遵义是长征之城，浙大西迁即是“文军长征”。这段书生长征历时2年半，全程2600公里，有千里徒步，中年校长竺可桢痛失妻儿，真是难以想象的艰苦之旅。行程过半，校长定下浙大校训“求是”二字。日：“所谓‘求是”，不仅限于埋头读书，或是实验室做实验，而是要有杀身成仁、舍生取义之精神，凭自己之良心，甘冒不，以使真理卒以大明。”抚古观今，忆苦思苦，君子竟无卑失色邪。\n"}, {"year": 2022, "month": 4, "day": 22, "text": "一个没有谎言的视频，为什么被封，又为什么总也封不住。今日朋友圈告诉我们：狂风吹，大海啸，真心的人死不了。\n"}, {"year": 2022, "month": 4, "day": 25, "text": "《思想与时代》是抗战时期钱穆、张其昀、谢幼伟、张荫麟、贺麟等学者在浙江大学创办的学术期刊，刊物以建立现代民族国家为使命，致力于探索当时中国面临的难题和出路，重视中西文化交流，提倡“科学时代的人文主义”，并努力坚守文化的民族性。\n公开课|思想与时代：找回丢失的中国故事\n"}, {"year": 2022, "month": 4, "day": 28, "text": "“哲学，是要把混沌、黑暗变成透明...人不可能忍受在一个不合理的世界”4年前的夏天，张老师在上海讲授《哲学是什么》如是说。那天课后，思想食堂开始了第一次台北游学。明天张教授的视频直播，由浙大哲学学院主办，主要面向专业学生和研究人员，有兴趣的朋友亦不妨围观。\n公开课|张志伟：在存在与存在者“之间”\n"}, {"year": 2022, "month": 4, "day": 28, "text": "如果没有理想人选，你是用一个没能力的好人，还是用一个有能力的小人？不要着急下结论，听姜老师讲讲历史经验，可以看到老师家里的书架直播已结束形史为登解析“唯才是举”04/28（周四）\n202214:00-15:30主锅直宾直膜亮点百家消远名得带您显流系存“南王教科书”之界的（真治通面）\n从“激才星学“的改质某：反用“才”与“律”的只系工用人2道以费为事，对为代会业管理列用人的员高也义\n· · ·\n"}, {"year": 2022, "month": 5, "day": 2, "text": "邓晓芒：有德国汉学家对我主张中国历来不存在公共空间的说法提出质疑，说先秦百家争鸣不就是公共空间吗？我的回答是，那不是什么“百家争鸣”，而是“百家争宠”，而且是极其可怕的非学术争夺。不只是失宠者惶惶如丧家之犬，而且即使那些得宠者如商鞅、韩非子，最后的下场也极为悲惨，一个被权势者车裂，一个被同为法家学派的李斯陷害而死，哪有半点学术自由？而这种争宠心态正是广义的儒家精神在各家各派中作为集体无意识的体现。\n这种集体无意识如此的顽固，以致就连西来佛法一到中土也随即变味变性，成为协助主流意识形态治国平天下的一股精神力量。这样一种一心向往权力的文化心理作为一种潜意识，直到今天仍然在中国知识分子、即使是那些理工科的知识分子中普遍存在着，在国家所建立的各种奖励科研的政策和基金中也理所当然地设定了一个最核心的目的：\n即解决国家目前所急需解决的重大问题。\n从上到下，几乎没有人认为这样规定科研的目的有什么不妥；但却不断有人提出为什么中国的科研总是出不了大师级的人才和成果。\n邓晓芒：一切有良知和上进心的中国知识分子，要尽一切所能地促进“启蒙的进化”\n"}, {"year": 2022, "month": 5, "day": 4, "text": "校长坐在第一排认真抄笔记，很难想象30年前他就已在德国学习人工智能。今天五四，中科院院士的校长虚心人文，快退休的倪教授也是挥洒自如：心理，物理，生理。。。佛学，儒学，哲学，文学。。。自己的好莱坞观影心得也一并送出。核心一个字，对意识、心灵有兴趣的，不用着急读哲学。有时间就看看《西部世界》，再有时间看普鲁斯特，穆希尔，乔伊斯，再有时间，读修昔底德等经典史家。实在觉得没挑战，读胡塞尔吧图想与时代新江六学管学公开部\n5月4日：2:00\n"}, {"year": 2022, "month": 5, "day": 4, "text": "大师兄校长认真听讲，仔细笔记，积极提问。。。一场讲座学得如此尽心尽力，竟仍未逃过新青年们炙热的激情。。。看评论区简直忘了这里是浙想与时代新江六学管学公开部\n"}, {"year": 2022, "month": 5, "day": 5, "text": "全国一盘棋，哲学班肯定要延迟上课了。准备了这么长时间，心情多少有点复杂，学校工作群里空气都凝固了，孙老师突然冒了一句“不要紧张”。\n乐了。德国哲学与艺术之旅，跟孙老师转了半个德国，听了马克思、贝多芬、海德格尔、尼采、歌德、李斯特。。。很多名言金句早都忘了，就孙老师这句slogan让大家受用无穷，真是怀念那个有远方的2019啊。\n过于紧张是不利于团结的，而团结就是力量呢。十分严肃也是不活泼的，\n活泼是革命乐观主义的体现呀。要团结，要活泼不能闲着，调整心态，积极参与到革命大家庭，发挥一下余热，为广大考生家庭押道文综题参考答案：历史证明，中国共产党要打的战最终都胜利了。（2分）前途是光明的，道路是曲折的。战争展现的残酷正是对我们前进的考验，一切反动派都是纸老虎。（2分）要时刻抓住主要矛盾，建立统一战线，枪口一致对外，警惕内部矛盾演变成为主要矛盾。（2分）一时失利是宝贵经验，我们要汲取教训，眼光长远，越挫越勇！局部受损是战术常态，我们要沉着冷静，眼观大局，敢打敢拼！（2分）战斗是艰苦的，死一两个人是常有的事，不要被敌人吓破了胆。我们是革命事业接班人，一定要坚持信仰不动摇，下定决心，不怕牺牲，要坚信，伟大的中国共产党必将带领我们迎接最后的胜利。（2分）敌人是谁，战士是谁，武器是什么，用辩证唯物主义的眼光看，都不是战斗的重点。重点是要听党的话！（plus5分）因为只要党一声令下，没有完不成的任务，更没有赢不了的战斗。相信党的智慧，相信人民的选择！（plus5分）\n不要紧张。\n我们打赢了武汉保卫战结紧张严常也一定能够打赢大上海保卫战北京市·首都师范大学附属中学（通州校区)\n"}, {"year": 2022, "month": 5, "day": 12, "text": "赵汀阳：思想，就是去想他人、社会、国家和世界。不想大事情，就不是思想，而是感想。\n赵汀阳1人民需要思想，而不仅仅是娱乐和知识\n"}, {"year": 2022, "month": 5, "day": 24, "text": "此时，看着窗外的青山白云（图1），没想喝咖啡。只想起去年今日，在林芝机场开始的修心之旅（图2-9）。那次有两个突发情况让我印象深刻，一是凌晨5点接到朋友电话告知在机场被劝返，让我们从此对疫情防控充满警惕，虽然这警惕并没有减少我们在过去1年的游学实践中栽跟头；二是甘肃白银越野事故刷屏，让我们对雅鲁藏布徒步心生敬畏，也明白了一个道理：人，不论在什么环境下，不能让自己失温。因为失温是致安庆市·安庆师范大学（龙山校区)文渊楼\n"}, {"year": 2022, "month": 5, "day": 24, "text": "忍不住再翻出去年的视频。真的很怀念那些被高反折磨的日子，想念那些既“好”又“好玩”的朋友们。\n"}, {"year": 2022, "month": 5, "day": 25, "text": "摘要：以商业的“公共事务”的属性来看，“在商言商”本身就是政治，这意味着商人不可能回避政治。\n无论是为了求自保而躲避政治，还是为了自己的利益而依附于政治，政治总是在那里，你不改变它，它就一定会改变你。\n越是躲避政治，就越可能把一切交给政治，或者就是按照政治现在的样子与它结成“不神圣”的同盟。\n徐责：别滥用“在商言商”这个词，商业的本意就是公共事务\n"}, {"year": 2022, "month": 5, "day": 27, "text": "文明不会亡于衰落，只会亡于愚蠢。\n观察|愚政进行曲：那些灾难性的决策是怎么做出的？\n"}, {"year": 2022, "month": 5, "day": 27, "text": "明天会更好吗？\n37年前的5月，罗大佑如此叩问世界，那年他31岁，他记下一轻轻抚摸麻木的身体无奈闭上你的眼睛这个荒谬的世界依然黑白不分地转个不停春风已解风情刺痛少女的心那旧时撕裂的的伤痕永不会愈合了抬头寻找夜空的繁星天际闪现一丝踪影传来喜玛的高原千年的冰雪渐渐消融的消息黑夜热泪滚落灼痛少女的心让愤怒语化为音符控诉无耻的谎言嘶哑着你的喉咙发出一阵怒吼让我们撕碎这旧世界让我们重构美丽新世界让
